    ctx.fillRect(ix + 1, iy + 1, 14, 14);
    drawItemIcon(ing, ix + 2, iy + 2);
    drawText(ctx, n + ' ' + ing.name, ix + 20, iy + 5, 1, '#e8e8e8');
    if (r.keep && r.keep.includes(key)) drawText(ctx, 'KEPT', ix + 118, iy + 5, 1, '#8ad8ff');
    drawText(ctx, have + '/' + n, ix + 160, iy + 5, 1, ok ? '#6ad46a' : '#ff8a8a', 'right');
  });
  craftButton(CRAFT_BTN, 'CRAFT', canCraft(r));

  ctx.fillStyle = '#3a2f4a';
  ctx.fillRect(p.x + 6, p.y + 144, p.w - 12, 1);
  const wb = ITEMS.water_bucket, hasWater = itemCount('water_bucket') > 0;
  const iy = p.y + 152;
  ctx.fillStyle = hasWater ? '#3a6a3a' : '#3a3a4a';
  ctx.fillRect(p.x + 6, iy, 16, 16);
  ctx.fillStyle = '#140c1c';
  ctx.fillRect(p.x + 7, iy + 1, 14, 14);
  drawItemIcon(wb, p.x + 8, iy + 2);
  drawText(ctx, 'DUMP ' + wb.name, p.x + 26, iy + 1, 1, '#e8e8e8');

  craftButton(DUMP_BTN, 'DUMP', hasWater);
}

function craftButton(b, label, ready) {
  ctx.fillStyle = '#140c1c';
  ctx.fillRect(b.x - 1, b.y - 1, b.w + 2, b.h + 2);
  ctx.fillStyle = ready ? (over(b) ? '#5ac85a' : '#3a9a3a') : '#3a3a4a';
  ctx.fillRect(b.x, b.y, b.w, b.h);
  drawText(ctx, label, b.x + b.w / 2, b.y + 5, 1, ready ? '#ffffff' : '#7a7a8a', 'center');
}

function chestHitFx(c, amount) {
  c.flash = HURT_FLASH;
  if (settings.mining) sfx(CHEST_HIT_SFX[chestKind(c)] || 'chestHit', c.x + chestW(c) / 2, c.y);
  addDamageNumber(c.x + chestW(c) / 2 - PLAYER_W / 2, c.y + 4, amount);
}

function chestBlockedFx(c, msg) {
  emit(c.x + chestW(c) / 2, c.y + chestH(c) / 2, 6, '#e8eef8', 70, 0.25);
  damageNumbers.push({ x: c.x + chestW(c) / 2, y: c.y - 12, text: '0', life: 0.8 });
  const kind = chestKind(c), rule = CHEST_KINDS[kind];
  const it = attackItem(msg && msg.w) || FIST_ITEM;
  // Point bow users at the charged shot when it would be strong enough.
  const chargeHelps = it.kind === 'bow' && !(msg && msg.ch) && it.charged >= (rule.minDamage || 0);
  if (rule.needsItem) showToast('NEEDS A FROZEN PICKAXE', '#b4ecfa');
  else if (rule.needsItems) showToast('ONLY A HEAVY HAMMER OR MINERS GAUNTLET CAN BREAK IT', '#ff9a3d');
  else if (chargeHelps) showToast('MAYBE TRY HOLDING RIGHT CLICK');
  else if (kind === 'magma') showToast('NEED A HIT THAT DOES 30 OR MORE DAMAGE', '#ff9a3d');
  else if (kind === 'thunder') showToast('NEED 35+ DAMAGE, A MINERS GAUNTLET OR A FLAMETHROWER', '#c8a8ff');
  else if (kind === 'cave') showToast('NEED 35+ DAMAGE OR A MINERS GAUNTLET', '#5ae8ff');
  else if (kind === 'stone') showToast('NEED A HIT THAT DOES MORE THAN 20 DAMAGE');
  else if (kind === 'armor') showToast('NEED A HIT THAT DOES 9 OR MORE DAMAGE');
  else showToast('NEED A WEAPON STRONGER THAN A STONE SWORD');
}

function announceIceChest() {
  showToast('AN ICE CHEST HAS APPEARED IN THE SNOW BIOME', '#b4ecfa');
}

function applyChestHit(chestId, attackerId, d) {
  const c = chests.find(o => o.id === chestId);
  if (!c) return;
  let damage;
  if (attackerId !== myPeerId) {
    const r = remotes.get(attackerId);
    if (!r || r.dead) return;
    const hit = validateHit(d, r.tx, r.ty, c.x, c.y, 32, true);
    if (!hit || !allowHit(r, 'chestHits_' + hit.key, hit)) return;
    damage = hit.damage;
  } else {
    damage = hitDamage(d);
  }
  if (!canHurtChest(chestKind(c), d)) {
    if (attackerId === myPeerId) chestBlockedFx(c, d);
    return;
  }
  c.hp = Math.max(0, c.hp - damage);
  chestHitFx(c, damage);
  if (c.hp <= 0) {
    const msg = { id: c.id, by: attackerId, x: c.x, y: c.y, k: chestKind(c) };
    onChestBreak(msg, myPeerId);
    if (sendChestBreak) {
      try { sendChestBreak(msg); } catch (e) { /* ignore */ }
    }
  }
  chestsDirty = true;
  tickChests();
}

function onChestHit(id, d) {
  if (!isChestHost() || !d || typeof d.id !== 'string') return;
  applyChestHit(d.id, id, d);
}

function onChests(id, d) {
  if (id !== chestHostId() || !d || !Array.isArray(d.l) || d.l.length > 150) return;
  const old = new Map(chests.map(c => [c.id, c]));
  chests = [];
  for (const e of d.l) {
    if (!Array.isArray(e) || typeof e[0] !== 'string' || !Number.isFinite(e[1]) || !Number.isFinite(e[2])) continue;
    const prev = old.get(e[0]);
    const c = { id: e[0].slice(0, 12), x: e[1], y: e[2], hp: 0, flash: prev ? prev.flash : 0 };
    if (isChestKind(e[4])) c.k = e[4];
    if (c.k === 'ice') c.born = performance.now() - Math.max(0, Math.min(ICE_CHEST_LIFE * 1000, Number(e[5]) || 0));
    c.hp = Math.max(0, Math.min(chestMaxHp(c), Number(e[3]) || 0));
    if (prev && c.hp < prev.hp) chestHitFx(c, prev.hp - c.hp);
    if (!prev && c.k === 'ice' && chestsKnown) announceIceChest();
    chests.push(c);
  }
  chestsKnown = true;
  if (Array.isArray(d.cv) && d.cv.length <= 10) {
    const oldClovers = new Map(clovers.map(c => [c.id, c]));
    clovers = d.cv
      .filter(e => Array.isArray(e) && typeof e[0] === 'string' && Number.isFinite(e[1]) && Number.isFinite(e[2]))
      .map(e => {
        const c = { id: e[0].slice(0, 12), x: e[1], y: e[2], hp: Math.max(1, Math.min(CLOVER_HP, Number(e[3]) || CLOVER_HP)), flash: 0 };
        const prev = oldClovers.get(c.id);
        if (prev) {
          c.flash = prev.flash || 0;
          if (c.hp < prev.hp) cloverHitFx(c, prev.hp - c.hp);
        }
        return c;
      });
  }
  if ('is' in d) {
    const e = d.is;
    if (Array.isArray(e) && typeof e[0] === 'string' && Number.isFinite(e[1]) && Number.isFinite(e[2])) {
      const prev = shard && shard.id === e[0] ? shard : null;
      const hp = Math.max(1, Math.min(SHARD_HP, Number(e[3]) || SHARD_HP));
      if (prev && hp < prev.hp) shardHitFx(prev, prev.hp - hp);
      shard = { id: e[0].slice(0, 12), x: e[1], y: e[2], hp, flash: prev ? prev.flash : 0,
        last: performance.now() - Math.max(0, Math.min(SHARD_IDLE_TIME * 1000, Number(e[4]) || 0)) };
    } else {
      shard = null;
    }
  }
  const left = Number(d.b) || 0;
  if (left > 0) {
    if (!biomeOpen) openBiome(true, left);
    else biomeCloseAt = performance.now() + left;
  } else if (biomeOpen && performance.now() - biomeOpenedAt > 3000) {
    // The grace period covers a host broadcast that was sent before it heard about an admin summon.
    closeBiome();
  }
}

// ---------------------------------------------------------------------------
// Purple biome events (rolled by the chest host)
// ---------------------------------------------------------------------------
let nextBiomeRoll = 0, nextStormRoll = 0;
let storms = [];
let biomeCloseAt = 0, biomeOpenedAt = 0;
let skyFlash = 0;

function openBiome(announce, durationMs = BIOME_DURATION * 1000) {
  if (biomeOpen) return;
  biomeOpen = true;
  biomeOpenedAt = performance.now();
  biomeCloseAt = biomeOpenedAt + durationMs;
  nextStormRoll = 0;
  biomeFalling = false;
  solids.find(s => s.t === 'ceiling').y = BIOME_TOP - 16;
  solids.push(...biomeSolids);
  if (announce) {
    showToast('A LOUD THUNDER STRIKES FROM ABOVE', GRASS[BIOME_SECTION].top);
    skyFlash = 0.5;
    if (state === 'game') sfx('thunder', undefined, undefined, 1.2);
  }
}

function closeBiome() {
  if (!biomeOpen) return;
  biomeOpen = false;
  biomeFalling = state === 'game' && !me.dead && me.y < 0;
  if (!biomeFalling) solids.find(s => s.t === 'ceiling').y = -16;
  for (const s of biomeSolids) {
    const i = solids.indexOf(s);
    if (i >= 0) solids.splice(i, 1);
  }
  chests = chests.filter(c => chestSection(c) < BIOME_SECTION);
  storms = [];
  chestsDirty = true;
  showToast('THE THUNDER BIOME FADED AWAY', GRASS[BIOME_SECTION].top);
}

function tickBiomeEvents(now) {
  if (!nextBiomeRoll) nextBiomeRoll = now + BIOME_ROLL_INTERVAL * 1000;
  if (!biomeOpen && now >= nextBiomeRoll) {
    nextBiomeRoll = now + BIOME_ROLL_INTERVAL * 1000;
    if (Math.random() < BIOME_CHANCE) {
      openBiome(true);
      chestsDirty = true;
    }
  }
  if (!biomeOpen) return;
  if (!nextStormRoll) nextStormRoll = now + STORM_ROLL_INTERVAL * 1000;
  if (now >= nextStormRoll) {
    nextStormRoll = now + STORM_ROLL_INTERVAL * 1000;
    const hit = [];
    BIOME_PLATS.forEach((s, i) => {
      const charged = chests.some(c => chestKind(c) === 'thunder' && c.y + chestH(c) === s.y && c.x >= s.x && c.x < s.x + s.w);
      if (Math.random() < (charged ? THUNDER_CHEST_STORM_CHANCE : STORM_CHANCE)) hit.push(i);
    });
    if (hit.length) {
      hit.forEach(startStorm);
      if (sendStorm) {
        try { sendStorm({ l: hit }); } catch (e) { /* ignore */ }
      }
    }
  }
}

function onStorm(id, d) {
  if (!d) return;
  // Lightning staff: one strike per cooldown from someone holding the staff.
  if (Array.isArray(d.ls)) {
    const r = remotes.get(id), now = performance.now();
    if (!r || r.dead || r.w !== 'lightning_staff' || now - (r.lastStaff || -1e9) < (ITEMS.lightning_staff.cooldown - 1) * 1000) return;
    if (d.ls.length !== 3 || !d.ls.every(Number.isFinite)) return;
    r.lastStaff = now;
    startStormRect([d.ls[0], d.ls[1], Math.min(STAFF_STRIKE_W, d.ls[2])], id);
    return;
  }
  // Admin lightning can land on any surface, so it carries the rectangle itself.
  if (Array.isArray(d.r)) {
    const r = remotes.get(id);
    if (!r || !r.n.includes('LARP')) return;
    for (const e of d.r.slice(0, 40)) {
      if (Array.isArray(e) && e.length === 3 && e.every(Number.isFinite)) startStormRect([e[0], e[1], Math.min(ADMIN_STORM_MAX_W, e[2])], id);
    }
    return;
  }
  if (id !== chestHostId()) return;
  const list = (Array.isArray(d.l) ? d.l : [d.i]).filter(i => Number.isInteger(i) && i >= 0 && i < BIOME_PLATS.length);
  if (!list.length) return;
  openBiome(true);
  list.forEach(startStorm);
}

function startStorm(i) {
  storms.push({ plat: BIOME_PLATS[i], at: performance.now(), struck: false, bolt: null });
}
// by: the admin who called it down; their own lightning never hurts them.
function startStormRect([x, y, w], by) {
  storms.push({ plat: { x, y, w }, at: performance.now(), struck: false, bolt: null, by });
}

const stormZone = s => ({ x: s.plat.x, y: s.plat.y - STORM_CLOUD_H, w: s.plat.w, h: STORM_CLOUD_H });

// Timed off the wall clock so a strike still lands while the tab is in the background.
function tickStorms() {
  const now = performance.now();
  // Others wait a moment longer so the host's close message arrives before their own timer runs out.
  if (biomeOpen && now >= biomeCloseAt + (isChestHost() ? 0 : 1500)) closeBiome();
  for (const s of storms) {
    if (s.struck || now - s.at < STORM_DELAY * 1000) continue;
    s.struck = true;
    const z = stormZone(s);
    if (!s.bolt) s.bolt = makeStormBolt(s);
    const [ix, iy] = s.bolt.main[s.bolt.main.length - 1];
    emit(ix, iy, 24, '#ffffff', 140, 0.5);
    emit(ix, iy, 14, '#b8c8ff', 90, 0.45);
    emit(ix, iy, 8, '#8a6aff', 60, 0.6);
    const onScreen = Math.abs(z.x + z.w / 2 - (cam.x + VIEW_W / 2)) < VIEW_W / 2 + 40 && Math.abs(s.plat.y - (cam.y + VIEW_H / 2)) < VIEW_H / 2 + 80;
    if (state === 'game' && (me.y < 60 || (s.by && onScreen))) {
      skyFlash = Math.max(skyFlash, onScreen ? 0.45 : 0.2);
    }
    if (state === 'game') {
      if (onScreen) sfx('thunder');
      else if (me.y < 60) sfx('thunderFar', undefined, undefined, 0.6);
    }
    if (state === 'game' && !me.dead && s.by !== myPeerId && immuneLeft() <= 0 && rectsOverlap(me.x, me.y, PLAYER_W, PLAYER_H, z.x, z.y, z.w, z.h)) {
      hitByLightning();
    }
  }
  storms = storms.filter(s => now - s.at < (STORM_DELAY + 0.7) * 1000);
}

function hitByLightning() {
  me.hp = Math.max(0, me.hp - LIGHTNING_DAMAGE);
  me.flash = HURT_FLASH;
  me.stunUntil = performance.now() + STUN_TIME * 1000;
  me.vx = 0;
  me.jetting = false;
  me.dashT = 0;
  sfx('stun');
  addDamageNumber(me.x, me.y, LIGHTNING_DAMAGE);
  if (sendDamage) {
    try { sendDamage({ a: LIGHTNING_DAMAGE, hp: me.hp }); } catch (e) { /* ignore */ }
  }
  if (me.hp <= 0) die('LIGHTNING');
}

const bushAt = (x, y) => (biomeOpen ? bushes.findIndex(b => x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h) : -1);
const myBush = () => (me.dead ? -1 : bushAt(me.x + PLAYER_W / 2, me.y + PLAYER_H - 4));
// Someone hiding in a bush is only visible to players inside the same bush.
const hiddenFromMe = r => r.bu >= 0 && r.bu !== myBush();

function onChestBreak(d, fromId) {
  if (!d || typeof d.id !== 'string' || fromId !== chestHostId()) return;
  const c = chests.find(o => o.id === d.id);
  const x = c ? c.x : Number(d.x) || 0, y = c ? c.y : Number(d.y) || 0;
  chests = chests.filter(o => o.id !== d.id);
  const kind = c ? chestKind(c) : isChestKind(d.k) ? d.k : chestKind({ y });
  if (kind === 'armor' && fromId === myPeerId) {
    const b = armorBiomeOf(sectionOf(y + CHEST_H));
    if (b >= 0) armorTargets[b] = rollArmorTarget();
  }
  const [fx1, fx2] = CHEST_KINDS[kind].fx;
  const cx = x + (CHEST_KINDS[kind].w || CHEST_W) / 2, cy = y + (CHEST_KINDS[kind].h || CHEST_H) / 2;
  emit(cx, cy, kind === 'ice' ? 40 : 18, fx1, 90, 0.6);
  emit(cx, cy, 8, fx2, 70, 0.5);
  sfx('chestBreak', cx, cy);
  if (d.by !== myPeerId || state !== 'game') return;
  grantChestReward(kind, !!d.a);
}

function updateChests(dt) {
  for (const c of chests) c.flash = Math.max(0, c.flash - dt);
  skyFlash = Math.max(0, skyFlash - dt * 2.5);
  if (toast) {
    toast.life -= dt;
    if (toast.life <= 0) toast = null;
  }
}

function die(killer) {
  me.dead = true;
  me.beam = null;
  me.jetting = false;
  me.killedBy = killer || '';
  pickerOpen = false;
  inventoryOpen = false;
  talk = null;
  closeAdmin();
  dragTarget = null;
  deathBurst(me.x, me.y, me.color);
  broadcastState();
}

function resetLife() {
  me.boosted = false;
  updateMaxHp();
  me.hp = me.maxHp;
  me.frozenUntil = 0;
  me.burnUntil = me.burnNext = 0;
  me.combo = { id: '', n: 0 };
  me.dashT = me.dashCd = 0;
  me.charging = false;
  me.jetting = false;
  me.jetFuel = JET_TIME;
  me.jetEmpty = false;
  me.stunUntil = 0;
  me.ammo = SHURIKEN_AMMO;
  me.burst = 0;
  me.fuel = MAX_FUEL;
  me.laserOut = 0;
  me.beam = null;
  me.tridentOut = me.tridentCharging = me.launching = false;
  me.tridentT = me.bubbleHold = 0;
  me.tridentFlyReady = true;
  me.bubbleCdUntil = me.blastCdUntil = 0;
  dashQueued = 0;
  powerQueued = '';
  burstQueued = jetQueued = tridentFlyQueued = false;
  me.dead = false;
  me.immuneUntil = performance.now() + SPAWN_IMMUNITY * 1000;
  me.flash = 0;
  me.regenAt = performance.now() + REGEN_INTERVAL * 1000;
  me.punchT = me.punchCd = me.punchBuffer = 0;
  me.lock = me.jumpBuffer = 0;
  jumpPressedQueued = punchQueued = false;
  spawn(me);
  cam.x = Math.max(0, Math.min(WORLD_W - VIEW_W, me.x - VIEW_W / 2));
  cam.y = Math.max(0, Math.min(WORLD_H - VIEW_H, me.y - VIEW_H / 2));
}

function respawn() {
  resetLife();
  broadcastState();
}

// Reloading gives a fresh peer ID; rejoining the room with the same ID can be
// ignored by peers that still hold the old connection.
function leaveGame() {
  saveInventory();
  const leaving = room ? Promise.resolve(room.leave()).catch(() => {}) : Promise.resolve();
  room = null;
  sendState = sendHit = sendDamage = null;
  sendChests = sendChestHit = sendChestBreak = sendArrow = sendStorm = sendBiome = sendAdmin = sendClover = sendThorns = sendBoom = null;
  craftOpen = storageOpen = false;
  state = 'leaving';
  Promise.race([leaving, new Promise(r => setTimeout(r, 800))]).then(() => location.reload());
}

let nextInventorySave = 0;
function updateMe(dt) {
  updateTalk(dt);
  if (performance.now() >= nextInventorySave) {
    nextInventorySave = performance.now() + 1000;
    saveInventory();
  }
  syncFreezeBoost();
  if (craftOpen && !nearBench()) craftOpen = false;
  if (storageOpen && !nearVault()) storageOpen = false;
  updateBucket(dt);
  me.flash = Math.max(0, me.flash - dt);
  me.punchT = Math.max(0, me.punchT - dt);
  me.punchCd = Math.max(0, me.punchCd - dt);
  me.dashCd = Math.max(0, me.dashCd - dt);
  if (!me.jetting) {
    me.jetFuel = Math.min(JET_TIME, me.jetFuel + dt * JET_TIME / JET_COOLDOWN);
    if (me.jetFuel >= JET_TIME) me.jetEmpty = false;
  }
  if (performance.now() < me.stunUntil) {
    dashQueued = 0;
    if (powerKey() !== 'radar_blocker') powerQueued = '';
  }
  if (dashQueued) {
    tryDash(dashQueued);
    dashQueued = 0;
  }
  if (powerQueued) {
    usePower(powerQueued);
    powerQueued = '';
  }
  updateShuriken(dt);
  updateLaser(dt);
  updateSpear(dt);
  updateBubbleBurst(dt);
  if (me.charging) {
    if (heldItem().kind === 'bow') me.chargeT += dt;
    else me.charging = false;
  }
  const hand = heldItem();
  if (me.onGround) me.tridentFlyReady = true;
  if (tridentFlyQueued) {
    tridentFlyQueued = false;
    if (hand.style !== 'trident' || performance.now() < me.stunUntil) { /* nothing */ }
    else if (!inThunderBiome()) showToast('THE TRIDENT ONLY FLIES IN THE THUNDER BIOME', hand.color);
    else if (me.tridentFlyReady) {
      me.tridentFlyReady = false;
      launchUp(TRIDENT_FLY_JUMPS);
      sfx('airJump');
      for (let i = 0; i < 14; i++) particles.push({ x: me.x + Math.random() * PLAYER_W, y: me.y + PLAYER_H, vx: (Math.random() - 0.5) * 40, vy: 40 + Math.random() * 60, life: 0.4, max: 0.4, color: Math.random() < 0.5 ? '#4ac8f0' : '#e8f8ff', g: 0 });
    }
  }
  // Trident: a click stabs, holding the attack and letting go throws it.
  if (hand.style === 'trident') {
    if (punchQueued) {
      me.attackSource = punchQueued;
      punchQueued = false;
      if (!me.tridentOut) {
        me.tridentCharging = true;
        me.tridentT = 0;
      }
    }
    if (me.tridentCharging) {
      if (mouseLeftHeld || held(PUNCH_KEYS)) me.tridentT += dt;
      else {
        me.tridentCharging = false;
        if (!me.tridentOut && me.punchCd <= 0) {
          if (me.tridentT >= TRIDENT_HOLD) throwTrident(me.attackSource === 'mouse');
          else doMelee();
        }
      }
    }
    return;
  }
  me.tridentCharging = false;
  if (punchQueued) {
    me.attackSource = punchQueued;
    punchQueued = false;
    me.punchBuffer = PUNCH_BUFFER;
  }
  if (me.punchBuffer > 0) {
    if (me.punchCd <= 0) {
      me.punchBuffer = 0;
      const kind = heldItem().kind;
      if (kind === 'bow') {
        if (!me.charging) fireArrow(false, me.attackSource === 'mouse');
      } else if (kind === 'staff' && heldItem().strike) {
        castLightning(me.attackSource === 'mouse');
      } else if (kind === 'staff') {
        fireArrow(false, me.attackSource === 'mouse');
      } else if (kind === 'shuriken') {
        shurikenAttack(me.attackSource === 'mouse');
      } else if (kind !== 'laser') {
        doMelee();
      }
    } else {
      me.punchBuffer -= dt;
    }
  }
}

let state = 'menu';

let time = 0;

function startGame() {
  if (state !== 'menu') return;
  nameInput.blur();
  me.name = nameInput.value.trim() || DEFAULT_NAME;
  saveProfile();
  loadStorage();
  loadInventory();
  loadRock();
  loadQuests();
  state = 'game';
  me.joinedAt = Date.now();
  joinedPerf = performance.now();
  keys.clear();
  resetLife();
  startNet();
}

function updateCamera(dt) {
  const tx = me.x + PLAYER_W / 2 - VIEW_W / 2 + me.facing * 24;
  const ty = me.y + PLAYER_H / 2 - VIEW_H / 2 - 10;
  const k = Math.min(1, dt * 6);
  cam.x += (tx - cam.x) * k;
  cam.y += (ty - cam.y) * k;
  clampCamera();
}
function clampCamera() {
  if (inShop(me.y)) {
    cam.x = 0;
    cam.y = SHOP_TOP;
  } else if (inUnder(me.y)) {
    cam.x = Math.max(0, Math.min(UG_W - VIEW_W, cam.x));
    cam.y = Math.max(UG_TOP, Math.min(UG_BOTTOM - VIEW_H, cam.y));
  } else {
    cam.x = Math.max(0, Math.min(WORLD_W - VIEW_W, cam.x));
    cam.y = Math.max(worldTop(), Math.min(WORLD_H - VIEW_H, cam.y));
  }
}

const BUTTON_THEMES = {
  green: { base: '#4fb53e', hover: '#6ad46a', top: '#86e05c', topHover: '#a6f08a', side: '#256d22', text: '#1d5a1a' },
  red: { base: '#c8404a', hover: '#e0565f', top: '#ee7a7f', topHover: '#ff9da0', side: '#7a1f2b', text: '#4a1018' },

function drawButton(b, label, theme) {
  const t = BUTTON_THEMES[theme];
  const hover = over(b);
  const press = hover ? 1 : 0;
  ctx.fillStyle = '#140c1c';
  ctx.fillRect(b.x - 1, b.y - 1, b.w + 2, b.h + 4);
  ctx.fillStyle = t.side;
  ctx.fillRect(b.x, b.y + 3, b.w, b.h);
  ctx.fillStyle = hover ? t.hover : t.base;
  ctx.fillRect(b.x, b.y + press, b.w, b.h);
  ctx.fillStyle = hover ? t.topHover : t.top;
  ctx.fillRect(b.x, b.y + press, b.w, 2);
  drawText(ctx, label, b.x + b.w / 2, b.y + press + 10, 2, '#ffffff', 'center', t.text);
  return hover;
}

function hpColor(frac) {
  return frac > 0.5 ? '#6ad46a' : frac > 0.25 ? '#f2c14e' : '#e84a5f';
}

function drawNameAndHp(name, x, y, col, hp, maxHp, hidden) {
  x = Math.round(x); y = Math.round(y);
  const frac = Math.max(0, Math.min(1, hp / maxHp));
  if (hidden) ctx.globalAlpha = 0.15;
  drawText(ctx, name, x + PLAYER_W / 2, y - 12, 1, col, 'center', '#140c1c');
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#140c1c';
  ctx.fillRect(x - 2, y - 5, PLAYER_W + 4, 3);
  ctx.fillStyle = hpColor(frac);
  ctx.fillRect(x - 1, y - 4, Math.round((PLAYER_W + 2) * frac), 1);
}

function drawChargeBar(x, y, charge, color) {
  if (charge < 0) return;
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = '#140c1c';
  ctx.fillRect(x - 2, y + PLAYER_H + 2, PLAYER_W + 4, 3);
  ctx.fillStyle = color || (charge >= 1 ? (Math.floor(time * 12) % 2 ? '#ffd84a' : '#ffffff') : '#e8e8e8');
  ctx.fillRect(x - 1, y + PLAYER_H + 3, Math.round((PLAYER_W + 2) * Math.min(1, charge)), 1);
}

function playerFx(color, flash, immune, punchT, item, armor, charge) {
  let f = null;
  if (flash > 0) f = hurtFlashColor(color);
  else if (immune && Math.floor(time * 10) % 2 === 0) f = '#4aa8ff';
  return { flash: f, punch: punchT > 0, item, armor, charge };
}

function itemDescription(it) {
  if (it.chestDamage) return it.chestDamage + ' DMG TO CHESTS ONLY' + (it.cooldown ? ' / ' + it.cooldown + 'S' : '') + (it === ITEMS.frozen_pickaxe ? ' / BREAKS ICE CHESTS' : '');
  if (it.mineAll) return it.damage + ' DMG / ' + it.cooldown + 'S / MINES EVERY CHEST';
  if (it.style === 'trident') return it.damage + ' DMG / HOLD: THROW ' + it.throwDamage + ' / RIGHT CLICK: FLY';
  if (it.ramDamage) return it.damage + ' DMG / RUN INTO: ' + it.ramDamage + ' / FALL ON + RIGHT CLICK: ' + it.dropDamage;
  if (it.stun) return it.damage + ' DMG / ' + it.cooldown + 'S / CAN STUN';
  if (it.light) return 'LIGHTS UP DARK PLACES';
  if (it.kind === 'melee') return it.damage + ' DMG' + (it.freeze ? ' / CAN FREEZE' : it.cooldown ? ' / ' + it.cooldown + 'S COOLDOWN' : '');
  if (it.sling) return it.damage + ' DMG ROCKS / ' + it.cooldown + 'S';
  if (it.kind === 'bow') return it.damage + ' DMG / ' + it.charged + ' CHARGED';
  if (it.drill) return Math.round(it.damage / it.tick) + ' DMG/S / SHORT RANGE / RIGHT CLICK: REFUEL';
  if (it.kind === 'shuriken') return it.damage + ' DMG X5 / RIGHT CLICK: X' + SHURIKEN_BURST_COUNT;
  if (it.flame) return Math.round(it.damage / it.tick) + ' DMG/S / ' + it.fuel + 'S FUEL / RIGHT CLICK: REFUEL';
  if (it.bubble) return Math.round(it.damage / it.tick) + ' DMG/S / KNOCKBACK / RIGHT CLICK: REFUEL';
  if (it.kind === 'laser') return LASER_DPS + ' DMG/S / RIGHT CLICK: REFUEL';
  if (it.strike) return 'LIGHTNING STRIKE AT CURSOR / ' + it.cooldown + 'S';
  if (it.kind === 'staff') return it.damage + ' DMG FIREBALLS / ' + it.cooldown + 'S / CAN SET ON FIRE';
  if (it.burn) return it.damage + ' DMG / ' + MAGMA_COMBO + ' HITS IN A ROW: BURN';
  if (ARMOR_KINDS[it.kind]) {
    const parts = [];
    if (it.hp) parts.push('+' + it.hp + ' MAX HP');
    if (it.speed) parts.push(it.speed > 1 ? 'RUN ' + Math.round((it.speed - 1) * 100) + '% FASTER' : it.speed + 'X SPEED');
    if (it.thorns) parts.push(Math.round(it.thorns * 100) + '% REFLECT ' + THORNS_DAMAGE + ' DMG');
    return parts.join(' / ');
  }
  if (it.kind === 'power') return POWER_HELP[Object.keys(ITEMS).find(k => ITEMS[k] === it)] || '';
  if (it.desc) return it.desc;
  if (it === ITEMS.luck_potion) return 'DOUBLE CLICK: ' + LUCK_MULT + 'X CHEST LUCK FOR 2 MIN';
  return '';
}

function drawPicker() {
  const p = PICKER;
  ctx.fillStyle = '#140c1c';
  ctx.fillRect(p.x - 1, p.y - 1, p.w + 2, p.h + 2);
  ctx.fillStyle = '#241a33';
  ctx.fillRect(p.x, p.y, p.w, p.h);

  const sv = SV_RECT;
  ctx.fillStyle = hsvToHex(picker.h, 1, 1);
  ctx.fillRect(sv.x, sv.y, sv.w, sv.h);
  let gr = ctx.createLinearGradient(sv.x, 0, sv.x + sv.w, 0);
  gr.addColorStop(0, '#ffffff');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gr;
  ctx.fillRect(sv.x, sv.y, sv.w, sv.h);
  gr = ctx.createLinearGradient(0, sv.y, 0, sv.y + sv.h);
  gr.addColorStop(0, 'rgba(0,0,0,0)');
  gr.addColorStop(1, '#000000');
  ctx.fillStyle = gr;
  ctx.fillRect(sv.x, sv.y, sv.w, sv.h);

  const hr = HUE_RECT;
  gr = ctx.createLinearGradient(0, hr.y, 0, hr.y + hr.h);
  for (let i = 0; i <= 6; i++) gr.addColorStop(i / 6, hsvToHex((i * 60) % 360, 1, 1));
  ctx.fillStyle = gr;
  ctx.fillRect(hr.x, hr.y, hr.w, hr.h);

  const mx = Math.round(sv.x + picker.s * (sv.w - 1));
  const my = Math.round(sv.y + (1 - picker.v) * (sv.h - 1));
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(mx - 2, my - 2, 5, 5);
  ctx.fillStyle = '#000000';
  ctx.fillRect(mx - 1, my - 1, 3, 3);
  ctx.fillStyle = me.color;
  ctx.fillRect(mx, my, 1, 1);

  const hy = Math.round(hr.y + picker.h / 360 * (hr.h - 1));
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(hr.x - 2, hy - 1, hr.w + 4, 3);
  ctx.fillStyle = '#000000';
  ctx.fillRect(hr.x - 1, hy, hr.w + 2, 1);
}

  ctx.fillStyle = '#140c1c';
  ctx.fillRect(VIEW_W - 16, 6, 9, 9);
  ctx.fillStyle = me.airJumps > 0 ? me.color : '#3a2f4a';
  ctx.fillRect(VIEW_W - 15, 7, 7, 7);
  if (maxAirJumps() > 1) drawText(ctx, String(me.airJumps), VIEW_W - 11, 8, 1, me.airJumps > 0 ? '#140c1c' : '#ffffff', 'center');

  // Held weapon + dash

  drawText(ctx, activeHand === 'hand' ? '1' : '2', VIEW_W - 4 - hw + 3, 26, 1, '#ffe66d');

  let rowY = 38;
  const statusRow = (label, frac, color, text) => {
    ctx.fillStyle = 'rgba(20, 12, 28, 0.7)';
    ctx.fillRect(VIEW_W - 110, rowY, 106, 14);
    drawText(ctx, label, VIEW_W - 104, rowY + 4, 1, '#ffffff');
    ctx.fillStyle = '#140c1c';
    ctx.fillRect(VIEW_W - 50, rowY + 4, 43, 5);
    ctx.fillStyle = color;
    ctx.fillRect(VIEW_W - 49, rowY + 5, Math.round(41 * Math.max(0, Math.min(1, frac))), 3);
    if (text) drawText(ctx, text, VIEW_W - 52, rowY + 4, 1, color, 'right');
    rowY += 16;
  };
  if (it.kind === 'laser') {
    const out = me.laserOut > 0;
    statusRow('FUEL', out ? 1 - me.laserOut / LASER_EMPTY_COOLDOWN : me.fuel / fuelMax(it),
      out ? '#7a3a3a' : me.refueling && me.fuel < fuelMax(it) ? '#ffe66d' : '#ff5a4a',
      out ? Math.ceil(me.laserOut) + 'S' : me.fuel.toFixed(1));
  } else if (it.kind === 'shuriken') {
    const reloading = me.ammo === 0 && me.burst === 0;
    statusRow('AMMO', reloading ? 1 - me.punchCd / SHURIKEN_BURST_COOLDOWN : me.ammo / SHURIKEN_AMMO,
      reloading ? '#5a6070' : it.color, reloading ? '' : String(me.ammo));
  } else if (it.strike) {
    statusRow('STRIKE', 1 - me.punchCd / it.cooldown, me.punchCd > 0 ? '#4a3a6a' : it.color, me.punchCd > 0 ? Math.ceil(me.punchCd) + 'S' : '');
  } else if (it.style === 'trident') {
    const fly = inThunderBiome() && me.tridentFlyReady;
    statusRow('FLY', fly ? 1 : 0, fly ? it.color : '#3a4a5a', inThunderBiome() ? '' : 'OFF');
  }
  const pk = powerKey(), nowMs = performance.now();
  if (pk === 'bubble_burst') {
    if (nowMs < me.bubbleCdUntil) statusRow('BUBBLE', 1 - (me.bubbleCdUntil - nowMs) / (BUBBLE_COOLDOWN * 1000), '#2a5a6a', Math.ceil((me.bubbleCdUntil - nowMs) / 1000) + 'S');
    else statusRow('BUBBLE', me.bubbleHold / BUBBLE_HOLD, ITEMS.bubble_burst.color);
  } else if (pk === 'explosion_power') {
    if (nowMs < me.blastCdUntil) statusRow('BLAST', 1 - (me.blastCdUntil - nowMs) / (BLAST_COOLDOWN * 1000), '#6a3a2a', Math.ceil((me.blastCdUntil - nowMs) / 1000) + 'S');
    else statusRow('BLAST', 1, ITEMS.explosion_power.color);
  }
  if (pk === 'dash') {
    statusRow('DASH', 1 - me.dashCd / DASH_COOLDOWN, me.dashCd > 0 ? '#3a8a80' : ITEMS.dash.color);
  } else if (pk === 'jetpack') {
    statusRow('JETPACK', me.jetFuel / JET_TIME,
      me.jetting ? '#ff9a3d' : me.jetEmpty ? '#7a3a3a' : '#ff5a4a');
  } else if (pk === 'radar_blocker') {
    const now = performance.now();
    if (radarActive()) statusRow('HIDDEN', (me.radarUntil - now) / (RADAR_TIME * 1000), '#7a8ad8', Math.ceil((me.radarUntil - now) / 1000) + 'S');
    else if (now < me.radarCdUntil) statusRow('RADAR', 1 - (me.radarCdUntil - now) / (RADAR_COOLDOWN * 1000), '#3a3f5a', Math.ceil((me.radarCdUntil - now) / 1000) + 'S');
    else statusRow('RADAR', 1, '#7a8ad8');
  }

  if (luckActive()) {
    const left = me.luckUntil - performance.now(), sec = Math.ceil(left / 1000);
    statusRow('LUCK', Math.min(1, left / (LUCK_TIME * 1000)), ITEMS.luck_potion.color, Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'));
  }

  const immune = immuneLeft();
  if (immune > 0 && !me.dead) {
    drawText(ctx, 'SPAWN IMMUNITY ' + Math.ceil(immune), VIEW_W / 2, VIEW_H - 14, 1, '#4aa8ff', 'center', '#140c1c');
  }

  canvas.style.cursor = cHover || (pickerOpen && over(PICKER)) ? 'pointer' : 'default';
}

// Arrows are rasterized per pixel at the target angle; rotating a tiny sprite
// with nearest-neighbor sampling garbles diagonal directions.
const ARROW_R = 10;
// Head from x=1 to the tip at x=8, shaft from x=-6 to x=1.
function insideArrow(px, py, cos, sin) {
  const lx = px * cos + py * sin, ly = Math.abs(-px * sin + py * cos);
  return (lx >= 1 && lx <= 8 && ly <= (8 - lx) * 6 / 7) || (lx >= -6 && lx < 1 && ly <= 2);
}
function drawArrow(ax, ay, angle, color) {
  const cos = Math.cos(angle), sin = Math.sin(angle);
  for (let py = -ARROW_R; py <= ARROW_R; py++) {
    for (let px = -ARROW_R; px <= ARROW_R; px++) {
      if (!insideArrow(px, py, cos, sin)) continue;
      const edge = !insideArrow(px - 1, py, cos, sin) || !insideArrow(px + 1, py, cos, sin) ||
                   !insideArrow(px, py - 1, cos, sin) || !insideArrow(px, py + 1, cos, sin);
      ctx.fillStyle = edge ? '#140c1c' : color;
      ctx.fillRect(ax + px, ay + py, 1, 1);
    }
  }
}

// Edge-of-screen arrows pointing at players who are out of view.
function drawPlayerArrows(cx, cy) {
  const EDGE = 11;
  const hw = VIEW_W / 2, hh = VIEW_H / 2;
  for (const r of remotes.values()) {
    if (r.dead || r.rb) continue;
    const sx = r.x - cx, sy = r.y - cy;
    if (sx + PLAYER_W > 0 && sx < VIEW_W && sy + PLAYER_H > 0 && sy < VIEW_H) continue;
    const dx = sx + PLAYER_W / 2 - hw, dy = sy + PLAYER_H / 2 - hh;
    const t = Math.min((hw - EDGE) / Math.abs(dx || 1e-6), (hh - EDGE) / Math.abs(dy || 1e-6));
    if (hiddenFromMe(r)) ctx.globalAlpha = 0.2;
    drawArrow(Math.round(hw + dx * t), Math.round(hh + dy * t), Math.atan2(dy, dx), r.c);
    ctx.globalAlpha = 1;
  }
}

function drawDeathScreen() {
  ctx.fillStyle = 'rgba(40, 0, 12, 0.65)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  drawText(ctx, 'YOU DIED', VIEW_W / 2 + 2, 62, 5, '#3a0d18', 'center');

  const h1 = drawButton(RESPAWN_BTN, 'RESPAWN', 'green');
  const h2 = drawButton(LEAVE_BTN, 'LEAVE', 'red');

}

const hash01 = n => {
  const v = Math.sin(n * 12.9898) * 43758.5453;
  return v - Math.floor(v);
};
// A purple glow, small arcs crackling over the chest, and the odd spark.
const BOLT_EMBLEM = ['..#', '.#.', '###', '.#.', '#..'];
function drawThunderChestFx(c, sx, sy, w, h) {
  const a = 0.45 + 0.25 * Math.sin(time * 5 + c.x);
  ctx.fillStyle = `rgba(160, 110, 255, ${a.toFixed(2)})`;
  ctx.fillRect(sx - 1, sy - 1, w + 2, 1);
  ctx.fillRect(sx - 1, sy + h, w + 2, 1);
  ctx.fillRect(sx - 1, sy, 1, h);
  ctx.fillRect(sx + w, sy, 1, h);
  ctx.fillStyle = `rgba(160, 110, 255, ${(a * 0.35).toFixed(2)})`;
  ctx.fillRect(sx - 2, sy - 2, w + 4, 1);
  ctx.fillRect(sx - 2, sy - 1, 1, h + 2);
  ctx.fillRect(sx + w + 1, sy - 1, 1, h + 2);
  drawSprite(BOLT_EMBLEM, sx + Math.floor(w / 2) - 1, sy + Math.floor(h / 2) - 2, '#fff27a');
  const frame = Math.floor(time * (flashesOn() ? 12 : 3)) * 7 + c.x;
  for (let k = 0; k < 3; k++) {
    if (hash01(frame + k * 31) < 0.25) continue;
    let x = Math.floor(hash01(frame + k * 13) * w), y = Math.floor(hash01(frame + k * 17) * h);
    const dir = hash01(frame + k * 19) < 0.5 ? -1 : 1;
    for (let s = 0; s < 8; s++) {
      ctx.fillStyle = s % 3 === 1 ? '#c8a8ff' : '#ffffff';
      ctx.fillRect(sx + x, sy + y, 1, 1);
      x = Math.max(-2, Math.min(w + 1, x + dir));
      y = Math.max(-2, Math.min(h + 1, y + (hash01(frame + k * 23 + s) < 0.5 ? -1 : 1)));
    }
  }
  if (!lowDetail() && Math.random() < 0.06) {
    const ang = Math.random() * Math.PI * 2;
    particles.push({ x: c.x + w / 2 + Math.cos(ang) * w / 2, y: c.y + h / 2 + Math.sin(ang) * h / 2, vx: Math.cos(ang) * 30, vy: Math.sin(ang) * 30,
      life: 0.25, max: 0.25, color: Math.random() < 0.3 ? '#fff27a' : '#c8a8ff', g: 0 });
  }
}

// Runestone Chest: carved stone blocks, iron corner bands, a glowing crystal lock,
// runes that pulse cyan, and light leaking from under the lid.
function drawCaveChest(c, sx, sy, w, h) {
  const white = c.flash > 0;
  const px = (col, x, y, pw = 1, ph = 1) => {
    ctx.fillStyle = white && col !== '#121018' ? '#ffffff' : col;
    ctx.fillRect(sx + x, sy + y, pw, ph);
  };
  const pulse = 0.55 + 0.45 * Math.sin(time * 3 + c.x * 0.1);
  const rune = `rgba(90, 232, 255, ${pulse.toFixed(2)})`;
  px('#121018', 1, 0, w - 2, 1);
  px('#121018', 0, 1, w, h - 1);
  // Lid slab
  px('#6a6874', 1, 1, w - 2, 5);
  px('#9a98a4', 1, 1, w - 2, 1);
  px('#4a4856', 1, 5, w - 2, 1);
  for (const x of [6, 15]) px('#4a4856', x, 2, 1, 3);
  px('#3e6a3a', 3, 1, 2, 1);
  px('#4e8a44', 16, 1, 3, 1);
  px('#4e8a44', 17, 2, 1, 1);
  // Body blocks, offset rows like masonry
  px('#55535f', 1, 7, w - 2, h - 8);
  for (const [y, xs] of [[7, [8, 14]], [11, [5, 11, 17]]]) {
    px('#6a6874', 1, y, w - 2, 1);
    for (const x of xs) px('#2e2c38', x, y, 1, 4);
  }
  px('#2e2c38', 1, 11, w - 2, 1);
  px('#3a3844', 1, h - 2, w - 2, 1);
  px('#2e2c38', 4, 13, 2, 1);
  px('#2e2c38', 15, 9, 1, 2);
  // Iron corner bands with rivets
  for (const x of [1, w - 3]) {
    px('#2a2a34', x, 1, 2, h - 2);
    px('#4a4a58', x, 1, 1, h - 2);
    for (const y of [3, 9, 13]) px('#b0b0be', x + (x === 1 ? 1 : 0), y, 1, 1);
  }
  // Lock plate and crystal
  const mx = Math.floor(w / 2);
  px('#2a2a34', mx - 3, 4, 6, 8);
  px('#4a4a58', mx - 3, 4, 6, 1);
  if (white) {
    px('#ffffff', mx - 1, 6, 2, 4);
  } else {
    ctx.fillStyle = '#1a6a8a';
    ctx.fillRect(sx + mx - 2, sy + 7, 4, 2);
    ctx.fillRect(sx + mx - 1, sy + 6, 2, 4);
    ctx.fillStyle = '#5ae8ff';
    ctx.fillRect(sx + mx - 1, sy + 7, 2, 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${(pulse * 0.9).toFixed(2)})`;
    ctx.fillRect(sx + mx - 1, sy + 7, 1, 1);
    // Light leaking from the lid seam, and carved runes
    ctx.fillStyle = rune;
    ctx.fillRect(sx + 3, sy + 6, mx - 6, 1);
    ctx.fillRect(sx + mx + 3, sy + 6, w - mx - 6, 1);
    for (const [x, y] of [[4, 8], [5, 9], [4, 10], [6, 13], [5, 14], [w - 6, 8], [w - 5, 9], [w - 6, 10], [w - 7, 13], [w - 6, 14], [mx, 13], [mx - 1, 14]]) {
      ctx.fillRect(sx + x, sy + y, 1, 1);
    }
    if (Math.random() < 0.04) {
      particles.push({ x: c.x + 3 + Math.random() * (w - 6), y: c.y + 6, vx: (Math.random() - 0.5) * 4, vy: -12 - Math.random() * 8, life: 0.9, max: 0.9, color: Math.random() < 0.5 ? '#5ae8ff' : '#c8f8ff', g: 0 });
    }
  }
}

function drawChests(cx, cy) {
  for (const c of chests) {
    const w = chestW(c), h = chestH(c);
    const sx = Math.round(c.x - cx), sy = Math.round(c.y - cy) + sinkAt(c.x, w, c.y + h);
    if (sx < -w || sx > VIEW_W || sy < -h - 6 || sy > VIEW_H) continue;
    const pal = CHEST_KINDS[chestKind(c)].pal;
    const maxHp = chestMaxHp(c);
    if (chestKind(c) === 'cave') drawCaveChest(c, sx, sy, w, h);
    // Bigger chests stretch the same sprite (nearest neighbour).
    else for (let r = 0; r < h; r++) {
      for (let col = 0; col < w; col++) {
        const ch = CHEST_SPRITE[Math.floor(r * CHEST_H / h)][Math.floor(col * CHEST_W / w)];
        if (ch === '.') continue;
        ctx.fillStyle = c.flash > 0 && ch !== 'o' ? '#ffffff' : pal[ch];
        ctx.fillRect(sx + col, sy + r, 1, 1);
      }
    }
    if (chestKind(c) === 'ice' && Math.floor(time * 3 + c.x) % 4 === 0) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(sx + 3 + Math.floor((time * 7 + c.x) % (w - 6)), sy + 3, 1, 1);
    }
    if (chestKind(c) === 'magma' && !(c.flash > 0)) {
      // Glowing cracks that pulse, plus the odd ember.
      const a = 0.55 + 0.45 * Math.sin(time * 4 + c.x);
      ctx.fillStyle = `rgba(255, 176, 64, ${a.toFixed(2)})`;
      for (const [px, py] of [[2, 6], [3, 7], [5, 8], [w - 4, 6], [w - 5, 8], [Math.floor(w / 2) + 2, h - 3]]) ctx.fillRect(sx + px, sy + py, 1, 1);
      if (Math.random() < 0.05) particles.push({ x: c.x + 2 + Math.random() * (w - 4), y: c.y, vx: (Math.random() - 0.5) * 6, vy: -18, life: 0.6, max: 0.6, color: '#ff8a2a', g: 0 });
    }
    if (chestKind(c) === 'thunder' && !(c.flash > 0)) drawThunderChestFx(c, sx, sy, w, h);
    if (c.hp < maxHp) {
      ctx.fillStyle = '#140c1c';
      ctx.fillRect(sx - 1, sy - 5, w + 2, 3);
      ctx.fillStyle = hpColor(c.hp / maxHp);
      ctx.fillRect(sx, sy - 4, Math.round(w * c.hp / maxHp), 1);
    }
  }
}

function drawDurability(item, x, y, w) {
  const frac = item.uses / ITEMS[item.key].uses;
  ctx.fillStyle = '#140c1c';
  ctx.fillRect(x, y, w, 2);
  ctx.fillStyle = hpColor(frac);
  ctx.fillRect(x, y, Math.max(1, Math.round(w * frac)), 2);
}

function drawInventory() {
  const p = INV_PANEL;
  ctx.fillStyle = '#140c1c';
  ctx.fillRect(p.x - 1, p.y - 1, p.w + 2, p.h + 2);
  ctx.fillStyle = '#241a33';
  ctx.fillRect(p.x, p.y, p.w, p.h);
  drawText(ctx, 'INVENTORY', p.x + 6, p.y + 7, 1, '#ffe66d');
  drawText(ctx, inventory.length + '/' + INVENTORY_SIZE, p.x + p.w - 6, p.y + 7, 1, '#ffffff', 'right');
  let hovered = null;
  for (let i = 0; i < INVENTORY_SIZE; i++) {
    const s = invSlotRect(i);
    const isOver = over(s);
    ctx.fillStyle = isOver ? '#5a4a7a' : '#3a2f4a';
    ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.fillStyle = '#1a1226';
    ctx.fillRect(s.x + 1, s.y + 1, s.w - 2, s.h - 2);
    const item = inventory[i];
    if (item) {
      const it = ITEMS[item.key];
      const isEquipped = EQUIP_SLOTS.some(slot => equipped[slot] === item);
      ctx.fillStyle = isEquipped ? '#ffe66d' : isOver ? '#ffffff' : shade(rarityOf(it).bg, 0.35);
      ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.fillStyle = rarityOf(it).bg;
      ctx.fillRect(s.x + 1, s.y + 1, s.w - 2, s.h - 2);
      drawItemIcon(it, s.x + 2, s.y + 2);
      if (item.n > 1) drawText(ctx, String(item.n), s.x + s.w, s.y + s.h - 5, 1, '#ffffff', 'right', '#140c1c');
      if (item.uses) drawDurability(item, s.x + 2, s.y + s.h - 3, s.w - 4);
      if (item.marked) drawDeleteMark(s.x, s.y, s.w);
      if (isOver) hovered = item;
    }
  }
  // Equipment column
  EQUIP_SLOTS.forEach(slot => {
    const s = equipSlotRect(slot);
    const active = slot === activeHand;
    drawText(ctx, EQUIP_LABELS[slot], s.x + s.w / 2, s.y - 8, 1, active ? '#ffe66d' : '#b9a8e0', 'center');
    ctx.fillStyle = over(s) && equipped[slot] ? '#ffffff' : active ? '#ffe66d' : '#5a4a7a';
    ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.fillStyle = equipped[slot] ? rarityOf(ITEMS[equipped[slot].key]).bg : '#1a1226';
    ctx.fillRect(s.x + 1, s.y + 1, s.w - 2, s.h - 2);
    if (equipped[slot]) {
      drawItemIcon(ITEMS[equipped[slot].key], s.x + 5, s.y + 5);
      if (equipped[slot].uses) drawDurability(equipped[slot], s.x + 3, s.y + s.h - 4, s.w - 6);
      if (over(s)) hovered = equipped[slot];
    }
  });
  drawText(ctx, 'CLICK: EQUIP   RIGHT CLICK: MARK X   1/2/SCROLL: SWAP WEAPON', VIEW_W / 2, p.y + p.h + 4, 1, '#8a7aaf', 'center', '#140c1c');

  // Delete button (bottom-right corner of the screen)
  const marked = inventory.filter(i => i.marked).length;
  const db = DELETE_BTN;
  const dHover = over(db) && marked > 0;
  ctx.fillStyle = '#140c1c';
  ctx.fillRect(db.x - 1, db.y - 1, db.w + 2, db.h + 2);
  ctx.fillStyle = marked ? (dHover ? '#ff6a6a' : '#c8383c') : '#4a3a4a';
  ctx.fillRect(db.x, db.y, db.w, db.h);
  drawDeleteMark(db.x + 1, db.y + 1, db.w - 2, marked ? '#ffffff' : '#7a6a7a');
  drawText(ctx, marked ? 'DELETE ' + marked : 'RIGHT CLICK ITEMS TO MARK', db.x - 4, db.y + 7, 1,
    marked ? '#ff8a8a' : '#8a7aaf', 'right', '#140c1c');

  if (hovered) {
    const it = ITEMS[hovered.key];
    const rar = rarityOf(it);
    const desc = itemDescription(it) + (hovered.uses ? ' / ' + hovered.uses + (hovered.uses === 1 ? ' HIT LEFT' : ' HITS LEFT') : '');
    const w = Math.max(textWidth(it.name, 1), textWidth(desc, 1), textWidth(rar.label, 1)) + 6;
    const tx = Math.max(2, Math.min(VIEW_W - w - 2, mouse.x + 6)), ty = mouse.y - 28;
    ctx.fillStyle = '#140c1c';
    ctx.fillRect(tx, ty, w, 27);
    ctx.fillStyle = rar.bg;
    ctx.fillRect(tx, ty, 2, 27);
    drawText(ctx, it.name, tx + 4, ty + 3, 1, rar.text);
    drawText(ctx, rar.label, tx + 4, ty + 11, 1, shade(rar.text, -0.2));
    drawText(ctx, desc, tx + 4, ty + 19, 1, '#ffffff');
  }
}

function drawDeleteMark(x, y, size, color = '#ff3b3b') {
  for (let i = 2; i < size - 2; i++) {
    for (const [px, py] of [[x + i, y + i], [x + size - 1 - i, y + i]]) {
      ctx.fillStyle = '#140c1c';
      ctx.fillRect(px - 1, py, 3, 1);
      ctx.fillStyle = color;
      ctx.fillRect(px, py, 1, 1);
    }
  }
}

function drawToast() {

}

const snowflakes = [];
const SNOW_TOP = WORLD_H - (SNOW_SECTION + 1) * SECTION_H, SNOW_BOTTOM = SNOW_TOP + SECTION_H;
const SNOW_FADE_IN = 0.35, SNOW_FADE_OUT = 0.6;
let snowAmt = 0;
const inSnowBiome = () => state === 'game' && !me.dead && sectionOf(me.y + PLAYER_H) === SNOW_SECTION;
function updateSnow(dt) {
  const inside = inSnowBiome();
  snowAmt = inside ? Math.min(1, snowAmt + dt / SNOW_FADE_IN) : Math.max(0, snowAmt - dt / SNOW_FADE_OUT);
  if (snowAmt === 0 || lowDetail()) snowflakes.length = 0;
  if (inside && !lowDetail() && snowflakes.length < 400) {
    // Fill the whole view straight away when arriving, then keep it topped up from above.
    const sparse = snowflakes.length < 80;
    for (let n = sparse ? 8 : Math.floor(dt * 50 + Math.random()); n > 0; n--) {
      snowflakes.push({ x: cam.x - 30 + Math.random() * (VIEW_W + 60), y: sparse ? cam.y + Math.random() * VIEW_H : cam.y - 4,
        vy: 26 + Math.random() * 24, ph: Math.random() * 6.28, s: Math.random() < 0.25 ? 2 : 1 });
    }
  }
  for (let i = snowflakes.length - 1; i >= 0; i--) {
    const f = snowflakes[i];
    f.ph += dt * 2;
    f.y += f.vy * dt;
    f.x += Math.sin(f.ph) * 12 * dt;
    if (f.y > cam.y + VIEW_H + 4 || f.y < cam.y - 40 || f.y > SNOW_BOTTOM + 40) snowflakes.splice(i, 1);
  }
}

function drawSnow(cx, cy) {
  if (snowAmt <= 0) return;
  ctx.fillStyle = '#ffffff';
  ctx.globalAlpha = 0.85 * snowAmt;
  for (const f of snowflakes) ctx.fillRect(Math.round(f.x - cx), Math.round(f.y - cy), f.s, f.s);
  ctx.globalAlpha = 1;
}

// Whitens the whole view (neighbouring biomes included) only while the player is in the snow biome.
function drawFrost() {
  if (snowAmt <= 0 || lowDetail()) return;
  ctx.fillStyle = `rgba(236, 248, 255, ${(0.3 * snowAmt).toFixed(3)})`;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}

// Volcanic area: falling fire and a warm glow while the player is in it, fading like the snow.
const fireRain = [];
let lavaAmt = 0;
const inVolcano = () => state === 'game' && !me.dead && sectionOf(me.y + PLAYER_H) === VOLCANO_SECTION;
function updateVolcano(dt) {
  const inside = inVolcano();
  lavaAmt = inside ? Math.min(1, lavaAmt + dt / SNOW_FADE_IN) : Math.max(0, lavaAmt - dt / SNOW_FADE_OUT);
  const onFire = state === 'game' && !me.dead && burning();
  burnAmt = onFire ? Math.min(1, burnAmt + dt / SNOW_FADE_IN) : Math.max(0, burnAmt - dt / SNOW_FADE_OUT);
  if (lavaAmt === 0 || lowDetail()) fireRain.length = 0;
  // With the thunder biome open above, the fire starts at the volcano's top edge instead of the view's.
  const fireTop = biomeOpen ? Math.max(cam.y - 10, 0) : cam.y - 10;
  if (inside && !lowDetail() && fireRain.length < 90) {
    const sparse = fireRain.length < 15;
    for (let n = sparse ? 6 : Math.floor(dt * 22 + Math.random()); n > 0; n--) {
      fireRain.push({ x: cam.x + Math.random() * (VIEW_W + 120), y: sparse ? fireTop + Math.random() * (cam.y + VIEW_H * 0.8 - fireTop) : fireTop,
        vx: -25 - Math.random() * 20, vy: 110 + Math.random() * 70, big: Math.random() < 0.3 });
    }
  }
  for (let i = fireRain.length - 1; i >= 0; i--) {
    const f = fireRain[i];
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    if (Math.random() < 0.4) particles.push({ x: f.x, y: f.y - 2, vx: (Math.random() - 0.5) * 10, vy: -10, life: 0.25, max: 0.25, color: Math.random() < 0.5 ? '#ff6a1a' : '#ffb040', g: 0 });
    if (overlaps(f.x, f.y, 1, 1)) {
      emit(f.x, f.y - 1, 5, Math.random() < 0.5 ? '#ffb040' : '#ff6a1a', 50, 0.35);
      fireRain.splice(i, 1);
    } else if (f.y > cam.y + VIEW_H + 10) {
      fireRain.splice(i, 1);
    }
  }
  // Embers drift up off the magma platforms.
  if (lavaAmt > 0) {
    for (const s of magmaPlats) {
      if (s.x + s.w < cam.x || s.x > cam.x + VIEW_W || s.y < cam.y || s.y > cam.y + VIEW_H) continue;
      if (Math.random() < dt * s.w / 40) {
        particles.push({ x: s.x + Math.random() * s.w, y: s.y - 1, vx: (Math.random() - 0.5) * 8, vy: -20 - Math.random() * 20,
          life: 0.8, max: 0.8, color: Math.random() < 0.6 ? '#ff8a2a' : '#ffe08a', g: 0 });
      }
    }
  }
}

function drawFireRain(cx, cy) {
  if (lavaAmt <= 0) return;
  ctx.globalAlpha = lavaAmt;
  for (const f of fireRain) {
    if (biomeOpen && f.y < 0) continue;

// ---------------------------------------------------------------------------
// Thunder biome weather: storm clouds replace the night sky, rain lashes down,
// lightning flickers in the distance and a drifting mist hides everything.
// ---------------------------------------------------------------------------
// Smooth value noise that wraps every px cells across and py cells down, so the art tiles.
function makeNoise(seed, px, py = px) {
  const rnd = mulberry32(seed);
  const t = Array.from({ length: px * py }, rnd);
  const at = (i, j) => t[(((j % py) + py) % py) * px + (((i % px) + px) % px)];
  const ease = v => v * v * (3 - 2 * v);
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), u = ease(x - xi), v = ease(y - yi);
    const a = at(xi, yi), b = at(xi + 1, yi), c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}

const [stormSkyCanvas, ssg] = makeCanvas(VIEW_W, VIEW_H);
(function buildStormSky() {
  const bands = ['#07050c', '#0b0812', '#100b18', '#140e1e', '#1a1226', '#20162e', '#261a34', '#2c1e3a'];
  const bh = Math.ceil(VIEW_H / bands.length);
  bands.forEach((c, i) => { ssg.fillStyle = c; ssg.fillRect(0, i * bh, VIEW_W, bh); });
})();

// A sideways-tiling strip of chunky storm clouds; denser at the top, ragged underneath.
function buildCloudStrip(w, h, seed, cell, colors) {
  const [c, g] = makeCanvas(w, h);
  const n1 = makeNoise(seed, 16), n2 = makeNoise(seed + 1, 32);
  for (let y = 0; y < h; y += cell) {
    for (let x = 0; x < w; x += cell) {
      const v = n1(x / w * 16, y / 40) * 0.65 + n2(x / w * 32, y / 18) * 0.35;
      const need = 0.32 + 0.45 * (y / h);
      if (v < need) continue;
      const k = (v - need) / (1 - need);
      g.fillStyle = k > 0.45 ? colors[0] : k > 0.2 ? colors[1] : colors[2];
      g.fillRect(x, y, cell, cell);
    }
  }
  return c;
}

// Mist: soft patches of pale purple, two tiling layers drifting at different speeds.
function buildMist(w, h, seed) {
  const [c, g] = makeCanvas(w, h);
  const n1 = makeNoise(seed, 12, 4), n2 = makeNoise(seed + 7, 24, 10);
  for (let y = 0; y < h; y += 2) {
    for (let x = 0; x < w; x += 2) {
      const v = n1(x / w * 12, y / h * 4) * 0.7 + n2(x / w * 24, y / h * 10) * 0.3;
      const a = Math.max(0, (v - 0.35) / 0.65);
      if (a <= 0) continue;
      g.fillStyle = `rgba(176, 150, 222, ${(a * 0.85).toFixed(3)})`;
      g.fillRect(x, y, 2, 2);
    }
  }
  return c;
}

const STORM_FADE = 1.2, BIOME_FADE_OUT = 2;
let stormAmt = 0;
const rain = [];
let nextBgFlash = 0, bgFlash = 0, bgBolt = null, lastBgThunder = 0;
const inThunderBiome = () => state === 'game' && !me.dead && biomeOpen && sectionOf(me.y + PLAYER_H) >= BIOME_SECTION;
const windNow = () => -70 - 50 * Math.sin(time * 0.4) - 30 * Math.sin(time * 1.7);

function makeBgBolt() {
  let x = 40 + Math.random() * (VIEW_W - 80), y = 0;
  const pts = [[x, y]];
  while (y < 90 + Math.random() * 60) {
    x += (Math.random() - 0.5) * 18;
    y += 6 + Math.random() * 10;
    pts.push([x, y]);
  }
  return pts;
}

function updateStormWeather(dt) {
  if (biomeFalling && (state !== 'game' || me.dead || me.y >= 0)) {
    biomeFalling = false;
    solids.find(s => s.t === 'ceiling').y = -16;
  }
  biomeFade = biomeOpen ? Math.min(1, biomeFade + dt / 0.8) : Math.max(0, biomeFade - dt / BIOME_FADE_OUT);
  const inside = inThunderBiome();
  stormAmt = inside ? Math.min(1, stormAmt + dt / STORM_FADE) : Math.max(0, stormAmt - dt / (biomeOpen ? STORM_FADE : BIOME_FADE_OUT));
  bgFlash = Math.max(0, bgFlash - dt * 3);
  if (stormAmt === 0) {
    rain.length = 0;
    nextBgFlash = 0;
    return;
  }
  // Distant lightning, sometimes with a second flicker right after.
  const now = performance.now();
  if (!nextBgFlash) nextBgFlash = now + 1500;
  if (now >= nextBgFlash) {
    bgFlash = flashesOn() ? 0.6 + Math.random() * 0.4 : 0;
    bgBolt = Math.random() < 0.7 ? makeBgBolt() : null;
    if (now - lastBgThunder > 1000) {
      lastBgThunder = now;
      const vol = 0.5 * stormAmt;
      setTimeout(() => sfx('thunderFar', undefined, undefined, vol), 300 + Math.random() * 900);
    }
    nextBgFlash = now + (Math.random() < 0.3 ? 140 : 2500 + Math.random() * 5000);
  }
  const wind = windNow();
  if (lowDetail()) rain.length = 0;
  else if (inside && rain.length < 320) {
    const sparse = rain.length < 60;
    for (let n = sparse ? 30 : Math.floor(dt * 260 + Math.random()); n > 0; n--) {
      rain.push({ x: cam.x - 40 + Math.random() * (VIEW_W + 120), y: sparse ? cam.y + Math.random() * VIEW_H : cam.y - 8,
        vy: 380 + Math.random() * 120, l: 4 + Math.floor(Math.random() * 4) });
    }
  }
  for (let i = rain.length - 1; i >= 0; i--) {
    const d = rain[i];
    d.x += wind * dt;
    d.y += d.vy * dt;
    if (overlaps(d.x, d.y, 1, 1)) {
      if (Math.random() < 0.5) {
        particles.push({ x: d.x, y: d.y - 1, vx: (Math.random() - 0.5) * 30, vy: -20 - Math.random() * 20, life: 0.2, max: 0.2, color: '#a898d0', g: 300 });
      }
      rain.splice(i, 1);
    } else if (d.y > cam.y + VIEW_H + 10) {
      rain.splice(i, 1);
    }
  }
  // Static crackles along the platforms.
  for (const s of BIOME_PLATS) {
    if (s.x + s.w < cam.x || s.x > cam.x + VIEW_W || s.y < cam.y || s.y > cam.y + VIEW_H) continue;
    if (Math.random() < dt * s.w / 300) {
      emit(s.x + Math.random() * s.w, s.y - 1, 2, Math.random() < 0.5 ? '#c8a0ff' : '#8ad8ff', 25, 0.2);
    }
  }
}

// Sky part, drawn behind the hills.

    g.fillRect(0, 0, VIEW_W, VIEW_H);

// Rain and mist, drawn over everything in the world (players included).

function drawWorldImage(img, top, cx, cy) {

// Cloud platforms dip a few pixels (with a small springy bounce) while someone stands on them.
// Only the drawing moves; collision stays put.
const CLOUD_SINK = 3;
const cloudUnder = (x, w, feet) => cloudPlats.find(c => Math.abs(c.s.y - feet) <= 1.5 && x + w > c.s.x && x < c.s.x + c.s.w);
const sinkAt = (x, w, feet) => {
  if (biomeFade <= 0) return 0;
  const c = cloudUnder(x, w, feet);
  return c ? Math.round(c.sink) : 0;
};
function updateClouds(dt) {
  if (biomeFade <= 0) return;
  const loaded = new Set();
  const add = (x, y) => { const c = cloudUnder(x, PLAYER_W, y + PLAYER_H); if (c) loaded.add(c); };
  if (state === 'game' && !me.dead) add(me.x, me.y);
  for (const r of remotes.values()) if (!r.dead) add(r.x, r.y);
  for (const c of cloudPlats) {
    const target = loaded.has(c) ? CLOUD_SINK : 0;
    if (!target && Math.abs(c.sink) < 0.05 && Math.abs(c.v) < 0.05) { c.sink = c.v = 0; continue; }
    c.v += ((target - c.sink) * 220 - c.v * 14) * dt;
    c.sink += c.v * dt;
  }
}
function drawClouds(cx, cy) {
  for (const c of cloudPlats) {
    const x = c.s.x - cx, y = c.s.y - CLOUD_PAD - cy + Math.round(c.sink);
    if (x > VIEW_W || x + c.s.w < 0 || y > VIEW_H || y + c.img.height < 0) continue;
    ctx.drawImage(c.img, x, y);
  }
}

function drawBushes(cx, cy) {
  if (biomeFade <= 0) return;
  const mine = myBush();
  bushes.forEach((b, i) => {
    const sx = b.x - cx, sy = b.y - cy + sinkAt(b.x, b.w, b.y + b.h);
    if (sx < -b.w || sx > VIEW_W || sy < -b.h || sy > VIEW_H) return;
    ctx.globalAlpha = (i === mine ? 0.55 : 1) * biomeFade;
    ctx.drawImage(b.img, sx, sy);
  });
  ctx.globalAlpha = 1;
}

const CLOUD_ROWS = [
  '....oooo..ooo.....',
  '..oogggooogggoo...',
  '.ogggdgggggggdgoo.',
  'ogggddggggdddgggo.',
  'oggdddddddddddggo',
  '.oddddddddddddddo.',
  '..oooooooooooooo..',

// Lightning: a jagged main channel (midpoint displacement) with a few forks.
const LEADER_TIME = 0.25;
function jagPath(x0, y0, x1, y1, disp) {
  let pts = [[x0, y0], [x1, y1]];
  for (let d = disp; d > 2; d /= 2) {
    const out = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
      out.push([(ax + bx) / 2 + (Math.random() - 0.5) * d, (ay + by) / 2 + (Math.random() - 0.5) * d * 0.25], pts[i]);
    }
    pts = out;
  }
  return pts.map(([x, y]) => [Math.round(x), Math.round(y)]);
}
function makeStormBolt(s) {
  const z = stormZone(s), mid = z.x + z.w / 2;
  const x0 = mid + (Math.random() - 0.5) * z.w * 0.4, y0 = z.y + 10;
  const x1 = mid + (Math.random() - 0.5) * Math.min(40, z.w * 0.6), y1 = s.plat.y;
  const main = jagPath(x0, y0, x1, y1, (y1 - y0) * 0.5);
  const forks = [];
  for (let i = 2; i < main.length * 0.75 && forks.length < 4; i++) {
    if (Math.random() > 0.12) continue;
    const [fx, fy] = main[i], len = 12 + Math.random() * 24, dir = Math.random() < 0.5 ? -1 : 1;
    forks.push(jagPath(fx, fy, fx + dir * len * (0.5 + Math.random() * 0.5), Math.min(y1 - 3, fy + len * 0.8), len * 0.4));
  }

}
// Real strikes flicker: a few bright return strokes with dark gaps between them.
const STROKES = [1, 1, 0.3, 0.05, 0.9, 0.7, 0.15, 0, 0, 0.85, 0.45, 0.1, 0, 0.6, 0.3, 0.1, 0.05];

// Draws the first `frac` of a path once per [color, width] layer.
function drawBoltPath(pts, cx, cy, frac, ...layers) {
  const end = Math.min(pts.length, Math.max(1, Math.ceil(pts.length * frac)));
  for (const [color, width] of layers) {
    for (let i = 1; i < end; i++) drawLine(pts[i - 1][0] - cx, pts[i - 1][1] - cy, pts[i][0] - cx, pts[i][1] - cy, color, width);
  }
}

function drawStorms(cx, cy, front) {

    if (!s.struck && age > 0.3 && Math.random() < 0.12) s.glow = 1;
    s.glow = Math.max(b, (s.glow || 0) * 0.85);

    ctx.globalAlpha = fade;

    if (t < 0) {

        g.addColorStop(0, `rgba(220, 225, 255, ${(0.55 * b).toFixed(3)})`);
        g.addColorStop(1, 'rgba(160, 140, 255, 0)');

      ctx.globalAlpha = 1;

  }
}

function drawLine(x0, y0, x1, y1, color, width) {
  ctx.fillStyle = color;
  const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= steps; i++) {
    const x = Math.round(x0 + (x1 - x0) * i / steps), y = Math.round(y0 + (y1 - y0) * i / steps);
    ctx.fillRect(x - (width >> 1), y, width, 1);
  }
}

function drawGame() {

    if (r.fr) drawIceBlock(r.x - cx, ry);

  if (!me.dead) {

    const fx = playerFx(me.color, me.flash, immuneLeft() > 0, me.punchT,
      me.tridentOut && heldKey() === 'trident' ? '' : heldKey(), armorList(), mch);

    }
    if (burning()) burnFx(me.x, me.y);
    if (heldItem().kind === 'laser') {
      const out = me.laserOut > 0;
      drawChargeBar(me.x - cx, my, out ? 1 - me.laserOut / LASER_EMPTY_COOLDOWN : me.fuel / fuelMax(heldItem()), out ? '#7a3a3a' : '#ff5a4a');

  drawParticles(ctx, cx, cy);
  drawSnow(cx, cy);
  drawFireRain(cx, cy);
  drawStormFront(cx, cy);
  if (under) drawDarkness(cx, cy);

  if (skyFlash > 0 && flashesOn()) {
    ctx.fillStyle = `rgba(255, 252, 230, ${Math.min(0.6, skyFlash)})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

}

const VOL_MAX = 200;

let soundMuted = false;
const clampVol = v => Math.max(0, Math.min(VOL_MAX, Math.round(v)));
try {
  soundMuted = localStorage.getItem('combat.sound') === 'off';
  const s = JSON.parse(localStorage.getItem('combat.settings') || '{}');
  for (const k of ['music', 'sfx']) if (Number.isFinite(s[k])) settings[k] = clampVol(s[k]);
  for (const k of ['wind', 'rain', 'thunder', 'mining', 'lowDetail', 'flashes']) if (typeof s[k] === 'boolean') settings[k] = s[k];
  if (s.saved && Number.isFinite(s.saved.music) && Number.isFinite(s.saved.sfx)) {
    settings.saved = { music: clampVol(s.saved.music), sfx: clampVol(s.saved.sfx) };
  }
} catch (e) { /* storage unavailable or bad save */ }
function saveSettings() {
  try {
    localStorage.setItem('combat.settings', JSON.stringify(settings));
  } catch (e) { /* storage unavailable */ }
}
const lowDetail = () => settings.lowDetail;
const flashesOn = () => settings.flashes;
const musicLevel = () => (soundMuted ? 0 : MUSIC_VOL * settings.music / 100);
let musicRegionNow = null;

function voice(dest, t, f, { type = 'sine', vol = 0.1, a = 0.005, d = 0.3, cut = 0, q = 0.7, detune = 0, bend = 0 } = {}) {
  const o = actx.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (bend) o.frequency.exponentialRampToValueAtTime(f * bend, t + a + d);
  if (detune) o.detune.value = detune;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  let n = o;
  if (cut) {
    const fl = actx.createBiquadFilter();
    fl.type = 'lowpass';
    fl.frequency.value = cut;
    fl.Q.value = q;
    n = o.connect(fl);
  }
  n.connect(g).connect(dest);
  o.start(t);
  o.stop(t + a + d + 0.05);
}

function noiseHit(dest, t, { vol = 0.1, a = 0.002, d = 0.05, type = 'highpass', f = 7000, q = 0.7, to = 0 } = {}) {
  const s = actx.createBufferSource();
  s.buffer = noiseBuf;
  const fl = actx.createBiquadFilter();
  fl.type = type;
  fl.frequency.setValueAtTime(f, t);
  if (to) fl.frequency.exponentialRampToValueAtTime(to, t + d);
  fl.Q.value = q;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  s.connect(fl).connect(g).connect(dest);
  s.start(t, Math.random() * Math.max(0, 3.9 - a - d));
  s.stop(t + a + d + 0.05);
}

const kick = (o, t, vol) => voice(o, t, 140, { vol, d: 0.28, bend: 0.28 });
const tom = (o, t, f, vol) => {
  voice(o, t, f, { vol, d: 0.7, bend: 0.65 });
  noiseHit(o, t, { vol: vol * 0.35, d: 0.12, type: 'lowpass', f: 900 });

const snare = (o, t, vol) => {
  noiseHit(o, t, { vol, d: 0.18, type: 'bandpass', f: 1800, q: 0.8 });

  voice(o, t, f * 3, { vol: vol * 0.22, d: d * 0.35 });

};

function loopNoise() {
  const s = actx.createBufferSource();
  s.buffer = noiseBuf;
  s.loop = true;
  s.start(0, Math.random() * 3);
  return s;
}

function initAudio() {
  if (actx) {
    if (actx.state === 'suspended') actx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  const comp = actx.createDynamicsCompressor();
  comp.threshold.value = -14;
  comp.ratio.value = 4;
  comp.connect(actx.destination);
  musicBus = actx.createGain();
  musicBus.gain.value = musicLevel();
  musicBus.connect(comp);
  sfxBus = actx.createGain();
  sfxBus.gain.value = soundMuted ? 0 : SFX_VOL * settings.sfx / 100;
  sfxBus.connect(comp);

  const rate = actx.sampleRate;
  noiseBuf = actx.createBuffer(1, rate * 4, rate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  const ir = actx.createBuffer(2, rate * 2.5, rate);
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 3;
  }
  reverb = actx.createConvolver();
  reverb.buffer = ir;
  reverb.connect(musicBus);

  for (const [id, def] of Object.entries(MUSIC_TRACKS)) {
    const out = actx.createGain();
    out.gain.value = 0;
    out.connect(musicBus);
    if (def.verb) {
      const send = actx.createGain();
      send.gain.value = def.verb;
      out.connect(send).connect(reverb);
    }
    const tr = { id, def, out, target: 0, until: 0, running: false, step: 0, nextT: 0 };
    if (def.build) def.build(tr);
    tracks[id] = tr;
  }
  musicRegionNow = null;
  buildLoops();
  setInterval(musicTick, 50);
}
addEventListener('keydown', initAudio, true);
addEventListener('pointerdown', initAudio, true);

function musicTick() {
  if (!actx || actx.state !== 'running' || soundMuted) return;
  const now = actx.currentTime;
  for (const tr of Object.values(tracks)) {
    if (tr.target <= 0 && now >= tr.until) {
      tr.running = false;
      continue;
    }
    if (tr.def.tick) {
      tr.def.tick(tr, now);
      continue;
    }
    if (!tr.running) {
      tr.running = true;
      tr.step = 0;
      tr.nextT = now + 0.06;
    }
    if (tr.nextT < now - 0.3) tr.nextT = now + 0.05;
    const sd = 60 / tr.def.bpm / tr.def.spb;
    while (tr.nextT < now + 0.25) {
      tr.def.play(tr.out, tr.step, tr.nextT, sd);
      tr.step++;
      tr.nextT += sd;
    }
  }
}

function musicRegion() {
  if (state !== 'game') return 'menu';
  const viewY = me.dead ? cam.y + VIEW_H / 2 : me.y;
  if (inShop(viewY)) return 'shop';
  if (inUnder(viewY)) return 'cave';
  const sec = sectionOf(me.dead ? cam.y + VIEW_H / 2 : me.y + PLAYER_H);
  if (sec >= BIOME_SECTION) return biomeFade > 0.5 ? 'thunder' : 'volcano';
  if (sec === VOLCANO_SECTION) return 'volcano';
  if (sec === SNOW_SECTION) return 'snow';
  if (sec === 2) return 'quirky';
  return 'happy';
}

function updateMusic() {
  if (!actx) return;
  const region = musicRegion();
  if (region === musicRegionNow) return;
  musicRegionNow = region;
  applySfxLevel();
  const mix = MUSIC_MIX[region], now = actx.currentTime;
  for (const tr of Object.values(tracks)) {
    const off = (tr.id === 'wind' || tr.id === 'rain') && !settings[tr.id];
    const target = off ? 0 : mix[tr.id] || 0;
    if (target === tr.target) continue;
    if (tr.target > 0 && target <= 0) tr.until = now + MUSIC_FADE * 6;
    tr.target = target;
    tr.out.gain.setTargetAtTime(target * tr.def.level, now, MUSIC_FADE);
  }
}

function toggleSound() {
  soundMuted = !soundMuted;
  try {
    localStorage.setItem('combat.sound', soundMuted ? 'off' : 'on');
  } catch (e) { /* storage unavailable */ }
  applyVolumes();
  showToast(soundMuted ? 'SOUND OFF' : 'SOUND ON');
}

function applyVolumes() {
  if (!musicBus) return;
  musicBus.gain.setTargetAtTime(musicLevel(), actx.currentTime, 0.1);
  applySfxLevel(0.1);
}

    noiseHit(o, t, { vol: 0.35, a: 0.05, d: 0.55, type: 'bandpass', f: 2500, q: 0.8, to: 300 });
    voice(o, t + 0.45, 60, { vol: 0.5, d: 0.9, bend: 0.5 });
    noiseHit(o, t + 0.45, { vol: 0.4, d: 0.5, type: 'lowpass', f: 600, to: 120 });
    for (let k = 0; k < 3; k++) voice(o, t + 0.9 + k * 0.35, 220 - k * 30, { type: 'triangle', vol: 0.07 / (k + 1), d: 0.6, bend: 0.7 });
    [1760, 1318, 1976].forEach((f, k) => voice(o, t + 1.1 + k * 0.4, f, { vol: 0.04, d: 0.1, bend: 1.5 }));
  },
  // Wooden door thump, then a little shop bell.
  door(o, t) {
    noiseHit(o, t, { vol: 0.3, d: 0.12, type: 'lowpass', f: 900, to: 200 });
    voice(o, t, 110, { type: 'triangle', vol: 0.2, d: 0.15, bend: 0.6 });
    [2093, 2637, 2093].forEach((f, k) => voice(o, t + 0.08 + k * 0.09, f, { vol: 0.05, d: 0.5, bend: 1 }));
  },
  shuriken(o, t) {
    noiseHit(o, t, { vol: 0.2, d: 0.08, type: 'bandpass', f: 6000, q: 2, to: 2500 });
    voice(o, t, 3200 + Math.random() * 400, { vol: 0.03, d: 0.07, bend: 0.8 });
  },
  shurikenBurst(o, t) {
    voice(o, t, 600, { type: 'square', vol: 0.06, d: 0.12, bend: 2.5, cut: 3500 });
    noiseHit(o, t, { vol: 0.3, a: 0.02, d: 0.35, type: 'bandpass', f: 1500, q: 1, to: 7000 });
    [1760, 2349].forEach((f, k) => voice(o, t + 0.05 + k * 0.05, f, { type: 'triangle', vol: 0.05, d: 0.12 }));
  },
  bubblePop(o, t) {
    voice(o, t, 500 + Math.random() * 700, { vol: 0.08, d: 0.05, bend: 2 });
    noiseHit(o, t, { vol: 0.03, d: 0.015, f: 4000 });
  },
  bubbleBurst(o, t) {
    noiseHit(o, t, { vol: 0.4, a: 0.02, d: 0.6, type: 'bandpass', f: 500, q: 0.8, to: 2500 });
    voice(o, t, 90, { vol: 0.3, d: 0.4, bend: 2 });
    for (let k = 0; k < 14; k++) voice(o, t + Math.random() * 0.7, 400 + Math.random() * 1200, { vol: 0.06, d: 0.05, bend: 2.2 });
  },
  explosion(o, t) {
    noiseHit(o, t, { vol: 1, d: 0.25, f: 2500 });
    noiseHit(o, t, { vol: 1, a: 0.01, d: 1.4, type: 'lowpass', f: 1200, to: 90 });
    voice(o, t, 70, { vol: 0.7, d: 0.9, bend: 0.4 });
    voice(o, t, 140, { type: 'square', vol: 0.08, d: 0.3, bend: 0.3, cut: 900 });
    for (let k = 0; k < 8; k++) noiseHit(o, t + 0.1 + Math.random() * 0.6, { vol: 0.1, d: 0.03, type: 'bandpass', f: 1500 + Math.random() * 2500, q: 2 });
  },
  stun(o, t) {
    for (let k = 0; k < 4; k++) voice(o, t + k * 0.08, 1800 - k * 250, { type: 'triangle', vol: 0.07, d: 0.12, detune: 20 });
    voice(o, t, 2400, { type: 'square', vol: 0.03, d: 0.35, bend: 0.5, cut: 5000 });
    noiseHit(o, t, { vol: 0.15, d: 0.05, type: 'highpass', f: 4000 });
  },
  secret(o, t) {
    voice(o, t, 45, { vol: 0.45, a: 0.2, d: 1.2, bend: 0.8 });
    noiseHit(o, t, { vol: 0.15, a: 0.4, d: 0.3, type: 'bandpass', f: 200, q: 1, to: 3000 });
    [62, 65, 69, 74, 77, 81, 86].forEach((m, k) => voice(o, t + 0.45 + k * 0.07, mtof(m), { type: 'triangle', vol: 0.07, d: 0.35 }));
    for (const m of [50, 57, 62, 65, 69]) {
      for (const dt of [-12, 12]) voice(o, t + 1, mtof(m), { type: 'sawtooth', vol: 0.025, a: 0.05, d: 1.5, cut: 2000, detune: dt });
    }
    voice(o, t + 1, 40, { vol: 0.4, d: 1.2, bend: 0.7 });
    [3136, 2637, 3520, 4186, 3136].forEach((f, k) => voice(o, t + 1.1 + k * 0.12, f, { vol: 0.03, d: 0.3 }));
  },
};

// Plays a sound; with a world position it fades with distance from the camera and pans.
function sfx(name, x, y, vol = 1) {
  if (!actx || actx.state !== 'running' || !SFX[name]) return;
  if (!settings.thunder && (name === 'thunder' || name === 'thunderFar')) return;
  const t = actx.currentTime;
  if (t - (sfxLast[name] || -1) < SFX_GAP) return;
  let pan = 0;
  if (x !== undefined) {
    const dx = x - (cam.x + VIEW_W / 2), dy = y - (cam.y + VIEW_H / 2);
    vol *= 1 - Math.hypot(dx, dy) / SFX_RANGE;
    if (vol <= 0.02) return;
    pan = Math.max(-0.8, Math.min(0.8, dx / (VIEW_W / 2)));
  }
  sfxLast[name] = t;
  const g = actx.createGain();
  g.gain.value = vol;
  if (pan && actx.createStereoPanner) {
    const p = actx.createStereoPanner();
    p.pan.value = pan;
    g.connect(p);
    p.connect(sfxBus);
  } else {
    g.connect(sfxBus);
  }
  SFX[name](g, t + 0.005);
  setTimeout(() => g.disconnect(), 3500);
}

const CHEST_HIT_SFX = { wood: 'chestHit', silver: 'chestSilver', stone: 'chestStone', ice: 'chestIce', armor: 'chestArmor', magma: 'chestMagma', thunder: 'chestThunder', cave: 'chestRune' };
// Louder biomes get louder effects so they still cut through the music.
const SFX_BOOST = { menu: 1, happy: 1, quirky: 1.15, snow: 1.5, thunder: 1.6, volcano: 2, cave: 1.2 };
// The boost shrinks along with the music volume, since quieter music needs less help.
function applySfxLevel(fade = 0.5) {
  if (!sfxBus) return;
  const boost = 1 + ((SFX_BOOST[musicRegionNow] || 1) - 1) * Math.min(1, settings.music / 100);
  sfxBus.gain.setTargetAtTime(soundMuted ? 0 : SFX_VOL * boost * settings.sfx / 100, actx.currentTime, fade);
}

const punchSfx = key => {
  if (!key || key === 'punch') return 'punchHit';
  return ITEMS[key] && ITEMS[key].style === 'gauntlet' ? 'gauntletHit' : '';
};
const swingSfx = key => {
  const it = ITEMS[key];
  if (!it || it.kind !== 'melee') return '';
  return it.style === 'sword' || it.style === 'dagger' ? 'slash' : it.style === 'katana' || it.style === 'trident' || it.style === 'scythe' || it.style === 'spear' ? 'katana' : '';
};

// Continuous sounds that follow the player's state: jetpack thrust, bow draw, radar expiry,
// laser hum, flamethrower roar and the refuel whine.
let jetGain = null, chargeTone = null, chargeDinged = false, radarWasOn = false;
let laserGain = null, flameGain = null, refuelGain = null, refuelOsc = null, drillGain = null, drillGrind = null;
let laserWas = false, flameWas = false, refuelWas = false, drillWas = false;

const lfo = (hz, depth, target) => {
  const o = actx.createOscillator(), g = actx.createGain();
  o.frequency.value = hz;
  g.gain.value = depth;
  o.connect(g).connect(target);
  o.start();
};
const loopOut = () => {
  const g = actx.createGain();
  g.gain.value = 0;
  g.connect(sfxBus);
  return g;
};

function buildLoops() {
  buildJetLoop();

  laserGain = loopOut();
  const lf = actx.createBiquadFilter();
  lf.type = 'bandpass';
  lf.frequency.value = 1000;
  lf.Q.value = 2;
  lfo(7, 350, lf.frequency);
  for (const f of [180, 183.5, 360]) {
    const o = actx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.value = f;
    o.connect(lf);
    o.start();
  }
  lf.connect(laserGain);
  const whine = actx.createOscillator(), wg = actx.createGain();
  whine.frequency.value = 1500;
  lfo(9, 25, whine.frequency);
  wg.gain.value = 0.25;
  whine.connect(wg).connect(laserGain);
  whine.start();

  flameGain = loopOut();
  const body = actx.createGain();
  body.gain.value = 0.8;
  lfo(23, 0.25, body.gain);
  const roar = actx.createBiquadFilter();
  roar.type = 'bandpass';
  roar.frequency.value = 280;
  roar.Q.value = 0.9;
  const hiss = actx.createBiquadFilter();
  hiss.type = 'lowpass';
  hiss.frequency.value = 2200;
  const hg = actx.createGain();
  hg.gain.value = 0.3;
  const src = loopNoise();
  src.connect(roar).connect(body);
  src.connect(hiss).connect(hg).connect(body);
  body.connect(flameGain);

  // Drill: a buzzing motor, plus a grinding layer that fades in while it's touching something.
  drillGain = loopOut();
  const motor = actx.createOscillator();
  motor.type = 'sawtooth';
  motor.frequency.value = 110;
  lfo(5, 6, motor.frequency);
  const mf = actx.createBiquadFilter();
  mf.type = 'lowpass';
  mf.frequency.value = 1100;
  const ripple = actx.createGain();
  ripple.gain.value = 0.7;
  lfo(34, 0.3, ripple.gain);
  motor.connect(mf).connect(ripple).connect(drillGain);
  motor.start();
  drillGrind = actx.createGain();
  drillGrind.gain.value = 0;
  const gf = actx.createBiquadFilter();
  gf.type = 'bandpass';
  gf.frequency.value = 2600;
  gf.Q.value = 1.4;
  lfo(13, 500, gf.frequency);
  loopNoise().connect(gf).connect(drillGrind).connect(drillGain);

  refuelGain = loopOut();
  refuelOsc = actx.createOscillator();
  refuelOsc.type = 'triangle';
  refuelOsc.frequency.value = 300;
  const trem = actx.createGain();
  trem.gain.value = 0.6;
  lfo(11, 0.4, trem.gain);
  refuelOsc.connect(trem).connect(refuelGain);
  refuelOsc.start();
}

function buildJetLoop() {
  const src = loopNoise();
  const low = actx.createBiquadFilter();
  low.type = 'lowpass';
  low.frequency.value = 700;
  const hiss = actx.createBiquadFilter();
  hiss.type = 'bandpass';
  hiss.frequency.value = 2500;
  hiss.Q.value = 0.8;
  const hg = actx.createGain();
  hg.gain.value = 0.25;
  const flutter = actx.createOscillator();
  flutter.frequency.value = 18;
  const fg = actx.createGain();
  fg.gain.value = 0.25;
  jetGain = actx.createGain();
  jetGain.gain.value = 0;
  const body = actx.createGain();
  body.gain.value = 0.75;
  flutter.connect(fg).connect(body.gain);
  flutter.start();
  src.connect(low).connect(body);
  src.connect(hiss).connect(hg).connect(body);
  body.connect(jetGain).connect(sfxBus);
}

function startChargeTone() {
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain(), fl = actx.createBiquadFilter();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(110, t);
  o.frequency.exponentialRampToValueAtTime(330, t + BOW_CHARGE_TIME);
  fl.type = 'lowpass';
  fl.frequency.value = 900;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.05, t + 0.1);
  o.connect(fl).connect(g).connect(sfxBus);
  o.start(t);
  noiseHit(sfxBus, t, { vol: 0.08, d: 0.15, type: 'bandpass', f: 1200, q: 3 });
  chargeTone = { o, g };
}

function stopChargeTone() {
  if (!chargeTone) return;
  const t = actx.currentTime;
  chargeTone.g.gain.setTargetAtTime(0, t, 0.02);
  chargeTone.o.stop(t + 0.15);
  chargeTone = null;
}

function updateSfx() {
  if (!actx || actx.state !== 'running') return;
  const playing = state === 'game' && !me.dead;
  jetGain.gain.setTargetAtTime(playing && me.jetting ? 0.35 : 0, actx.currentTime, 0.04);
  const drawing = playing && me.charging && heldItem().kind === 'bow';
  if (drawing && !chargeTone) {
    startChargeTone();
    chargeDinged = false;
  }
  if (!drawing) stopChargeTone();
  if (drawing && !chargeDinged && me.chargeT >= BOW_CHARGE_TIME) {
    chargeDinged = true;
    sfx('chargeReady');
  }
  const radarOn = playing && radarActive();
  if (radarWasOn && !radarOn && !me.dead) sfx('radarOff');
  radarWasOn = radarOn;

  const now = actx.currentTime, it = heldItem();
  const beam = playing && !!me.beam && it.kind === 'laser';
  const flame = beam && !!it.flame, drill = beam && !!it.drill, laser = beam && !it.flame && !it.bubble && !it.drill;
  if (drill && !drillWas) sfx('drillStart');
  drillWas = drill;
  const grinding = drill && (me.beam.peer || me.beam.chest || Math.hypot(me.beam.x2 - me.beam.x1, me.beam.y2 - me.beam.y1) < it.range - 2);
  drillGain.gain.setTargetAtTime(drill ? 0.12 : 0, now, 0.03);
  drillGrind.gain.setTargetAtTime(grinding ? 0.9 : 0, now, 0.04);
  if (beam && it.bubble && Math.random() < 0.35) sfx('bubblePop', undefined, undefined, 0.6 + Math.random() * 0.4);
  if (laser && !laserWas) sfx('laserStart');
  if (flame && !flameWas) sfx('flameStart');
  laserWas = laser;
  flameWas = flame;
  laserGain.gain.setTargetAtTime(laser ? 0.07 : 0, now, 0.03);
  flameGain.gain.setTargetAtTime(flame ? 0.45 : 0, now, 0.04);
  if (flame && Math.random() < 0.3) noiseHit(sfxBus, now, { vol: 0.04 + Math.random() * 0.08, d: 0.02, f: 3000 + Math.random() * 4000 });
  const full = it.kind === 'laser' && me.fuel >= fuelMax(it);
  const refill = playing && it.kind === 'laser' && me.refueling && !me.beam && me.laserOut <= 0 && !full;
  if (refill) refuelOsc.frequency.setTargetAtTime(250 + 650 * me.fuel / fuelMax(it), now, 0.05);
  refuelGain.gain.setTargetAtTime(refill ? 0.06 : 0, now, 0.03);
  if (refuelWas && full && me.refueling) sfx('refuelFull');
  refuelWas = refill;
}

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
const STEP = 1 / 120;
let acc = 0, lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  time += dt;

  if (state === 'game') {
    if (!me.dead) {
      acc += dt;
      while (acc >= STEP) {
        stepPlayer(me, STEP);
        acc -= STEP;
      }
      updateMe(dt);
    } else {
      acc = 0;
      jumpPressedQueued = punchQueued = false;
      dashQueued = 0;
    }
    updateRemotes(dt);
    updateArrows(dt);
    updateChests(dt);
    updateParticles(dt);
    updateSnow(dt);
    updateVolcano(dt);
    updateStormWeather(dt);
    updateClouds(dt);
    updateDamageNumbers(dt);
    updateCamera(dt);
    drawGame();
  } else {
    updateParticles(dt);
    updateStormWeather(dt);
    drawMenu();
  }
  updateMusic();
  updateSfx();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
