      break: chests.length + ' CHESTS',
      thunder: 'YOUR PLATFORM',
      tracker: trackerRepeat ? 'ON: CLICK TO STOP' : 'X2 CLICK: REPEAT',
      shard: 'YOUR PLATFORM',
    };
    const colors = { ice: '#4a8ab0', biome: GRASS[BIOME_SECTION].dark, kill: '#8a2a30', break: '#7a5a2a', thunder: '#6a6a3a', tracker: '#5a5a2a', shard: '#3a7a9a' };
    ADMIN_EVENTS.forEach((ev, i) => {
      const r = eventBtnRect(i), on = ev.id === 'tracker' && trackerRepeat;
      ctx.fillStyle = over(r) ? '#ffffff' : on ? '#fff6a0' : '#140c1c';
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = colors[ev.id];
      ctx.fillRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.fillRect(r.x + 1, r.y + 1, r.w - 2, 3);
      drawText(ctx, ev.label, r.x + 6, r.y + 7, 1, '#ffffff', 'left', '#140c1c');
      if (notes[ev.id]) drawText(ctx, notes[ev.id], r.x + r.w - 6, r.y + 7, 1, on ? '#fff6a0' : '#d8d0e8', 'right', '#140c1c');
    });
    return;
  }

  // Search box
  const sb = ADMIN_SEARCH, sbtn = ADMIN_SEARCH_BTN;
  ctx.fillStyle = adminSearchFocus ? '#ffe66d' : over(sb) ? '#7a6a9a' : '#5a4a7a';
  ctx.fillRect(sb.x, sb.y, sb.w, sb.h);
  ctx.fillStyle = '#1a1226';
  ctx.fillRect(sb.x + 1, sb.y + 1, sb.w - 2, sb.h - 2);
  if (adminSearch || adminSearchFocus) {
    const caret = adminSearchFocus && Math.floor(time * 2) % 2 === 0 ? '-' : '';
    drawText(ctx, adminSearch + caret, sb.x + 4, sb.y + 5, 1, '#ffffff');
  } else {
    drawText(ctx, 'CLICK TO TYPE...', sb.x + 4, sb.y + 5, 1, '#5a4a7a');
  }
  ctx.fillStyle = over(sbtn) || adminSearchFocus ? '#ffe66d' : '#b9a8e0';
  ctx.fillRect(sbtn.x, sbtn.y, sbtn.w, sbtn.h);
  drawText(ctx, 'SEARCH', sbtn.x + sbtn.w / 2, sbtn.y + 5, 1, '#241a33', 'center');

  // Scrollable item list
  const l = ADMIN_LIST;
  ctx.fillStyle = '#1a1226';
  ctx.fillRect(l.x, l.y, l.w, l.h);
  const { rows, height } = adminRows();
  const hoverRow = adminRowAtMouse();
  ctx.save();
  ctx.beginPath();
  ctx.rect(l.x, l.y, l.w, l.h);
  ctx.clip();
  for (const row of rows) {
    const y = l.y + row.y - adminScroll;
    if (y + row.h < l.y || y > l.y + l.h) continue;
    if (row.header) {
      drawText(ctx, row.header, l.x + 4, y + 5, 1, '#ffe66d');
      ctx.fillStyle = '#5a4a7a';
      ctx.fillRect(l.x + 8 + textWidth(row.header, 1), y + 7, l.w - 18 - textWidth(row.header, 1), 1);
      continue;
    }
    const it = ITEMS[row.key], rar = rarityOf(it);
    if (row === hoverRow) {
      ctx.fillStyle = '#3a2f4a';
      ctx.fillRect(l.x, y, l.w, row.h);
    }
    ctx.fillStyle = rar.bg;
    ctx.fillRect(l.x + 4, y + 1, 16, 16);
    drawItemIcon(it, l.x + 6, y + 3);
    drawText(ctx, it.name, l.x + 26, y + 6, 1, rar.text);
    drawText(ctx, row === hoverRow ? '+ ADD' : rar.label, l.x + l.w - 10, y + 6, 1,
      row === hoverRow ? '#ffe66d' : shade(rar.text, -0.25), 'right');
  }
  if (!rows.length) drawText(ctx, 'NO ITEMS FOUND', l.x + l.w / 2, l.y + 20, 1, '#8a7aaf', 'center');
  ctx.restore();
  if (height > l.h) {
    const barH = Math.max(12, l.h * l.h / height);
    const barY = l.y + (l.h - barH) * (adminScroll / (height - l.h));
    ctx.fillStyle = '#3a2f4a';
    ctx.fillRect(l.x + l.w - 4, l.y, 3, l.h);
    ctx.fillStyle = '#b9a8e0';
    ctx.fillRect(l.x + l.w - 4, Math.round(barY), 3, Math.round(barH));
  }
  drawText(ctx, 'CLICK AN ITEM TO ADD IT   SCROLL FOR MORE', VIEW_W / 2, p.y + p.h + 4, 1, '#8a7aaf', 'center', '#140c1c');
}

function drawDeleteMark(x, y, size, color = '#ff3b3b') {
  for (let i = 2; i < size - 2; i++) {
    for (const [px, py] of [[x + i, y + i], [x + size - 1 - i, y + i]]) {
      ctx.fillStyle = '#140c1c';
      ctx.fillRect(px - 1, py, 3, 1);
      ctx.fillStyle = color;
      ctx.fillRect(px, py, 1, 1);
    }
  }
}

function drawToast() {
  if (!toast) return;
  ctx.globalAlpha = Math.min(1, toast.life / 0.4);
  const w = textWidth(toast.text, 1) + 10;
  ctx.fillStyle = 'rgba(20, 12, 28, 0.8)';
  ctx.fillRect(Math.round(VIEW_W / 2 - w / 2), VIEW_H - 34, w, 13);
  drawText(ctx, toast.text, VIEW_W / 2, VIEW_H - 30, 1, toast.color, 'center');
  ctx.globalAlpha = 1;
}

const snowflakes = [];
const SNOW_TOP = WORLD_H - (SNOW_SECTION + 1) * SECTION_H, SNOW_BOTTOM = SNOW_TOP + SECTION_H;
const SNOW_FADE_IN = 0.35, SNOW_FADE_OUT = 0.6;
let snowAmt = 0;
const inSnowBiome = () => state === 'game' && !me.dead && sectionOf(me.y + PLAYER_H) === SNOW_SECTION;
function updateSnow(dt) {
  const inside = inSnowBiome();
  snowAmt = inside ? Math.min(1, snowAmt + dt / SNOW_FADE_IN) : Math.max(0, snowAmt - dt / SNOW_FADE_OUT);
  if (snowAmt === 0) snowflakes.length = 0;
  if (inside && snowflakes.length < 400) {
    // Fill the whole view straight away when arriving, then keep it topped up from above.
    const sparse = snowflakes.length < 80;
    for (let n = sparse ? 8 : Math.floor(dt * 50 + Math.random()); n > 0; n--) {
      snowflakes.push({ x: cam.x - 30 + Math.random() * (VIEW_W + 60), y: sparse ? cam.y + Math.random() * VIEW_H : cam.y - 4,
        vy: 26 + Math.random() * 24, ph: Math.random() * 6.28, s: Math.random() < 0.25 ? 2 : 1 });
    }
  }
  for (let i = snowflakes.length - 1; i >= 0; i--) {
    const f = snowflakes[i];
    f.ph += dt * 2;
    f.y += f.vy * dt;
    f.x += Math.sin(f.ph) * 12 * dt;
    if (f.y > cam.y + VIEW_H + 4 || f.y < cam.y - 40 || f.y > SNOW_BOTTOM + 40) snowflakes.splice(i, 1);
  }
}

function drawSnow(cx, cy) {
  if (snowAmt <= 0) return;
  ctx.fillStyle = '#ffffff';
  ctx.globalAlpha = 0.85 * snowAmt;
  for (const f of snowflakes) ctx.fillRect(Math.round(f.x - cx), Math.round(f.y - cy), f.s, f.s);
  ctx.globalAlpha = 1;
}

// Whitens the whole view (neighbouring biomes included) only while the player is in the snow biome.
function drawFrost() {
  if (snowAmt <= 0) return;
  ctx.fillStyle = `rgba(236, 248, 255, ${(0.3 * snowAmt).toFixed(3)})`;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}

// Volcanic area: falling fire and a warm glow while the player is in it, fading like the snow.
const fireRain = [];
let lavaAmt = 0;
const inVolcano = () => state === 'game' && !me.dead && sectionOf(me.y + PLAYER_H) === VOLCANO_SECTION;
function updateVolcano(dt) {
  const inside = inVolcano();
  lavaAmt = inside ? Math.min(1, lavaAmt + dt / SNOW_FADE_IN) : Math.max(0, lavaAmt - dt / SNOW_FADE_OUT);
  const onFire = state === 'game' && !me.dead && burning();
  burnAmt = onFire ? Math.min(1, burnAmt + dt / SNOW_FADE_IN) : Math.max(0, burnAmt - dt / SNOW_FADE_OUT);
  if (lavaAmt === 0) fireRain.length = 0;
  if (inside && fireRain.length < 90) {
    const sparse = fireRain.length < 15;
    for (let n = sparse ? 6 : Math.floor(dt * 22 + Math.random()); n > 0; n--) {
      fireRain.push({ x: cam.x + Math.random() * (VIEW_W + 120), y: sparse ? cam.y + Math.random() * VIEW_H * 0.8 : cam.y - 10,
        vx: -25 - Math.random() * 20, vy: 110 + Math.random() * 70, big: Math.random() < 0.3 });
    }
  }
  for (let i = fireRain.length - 1; i >= 0; i--) {
    const f = fireRain[i];
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    if (Math.random() < 0.4) particles.push({ x: f.x, y: f.y - 2, vx: (Math.random() - 0.5) * 10, vy: -10, life: 0.25, max: 0.25, color: Math.random() < 0.5 ? '#ff6a1a' : '#ffb040', g: 0 });
    if (overlaps(f.x, f.y, 1, 1)) {
      emit(f.x, f.y - 1, 5, Math.random() < 0.5 ? '#ffb040' : '#ff6a1a', 50, 0.35);
      fireRain.splice(i, 1);
    } else if (f.y > cam.y + VIEW_H + 10) {
      fireRain.splice(i, 1);
    }
  }
  // Embers drift up off the magma platforms.
  if (lavaAmt > 0) {
    for (const s of magmaPlats) {
      if (s.x + s.w < cam.x || s.x > cam.x + VIEW_W || s.y < cam.y || s.y > cam.y + VIEW_H) continue;
      if (Math.random() < dt * s.w / 40) {
        particles.push({ x: s.x + Math.random() * s.w, y: s.y - 1, vx: (Math.random() - 0.5) * 8, vy: -20 - Math.random() * 20,
          life: 0.8, max: 0.8, color: Math.random() < 0.6 ? '#ff8a2a' : '#ffe08a', g: 0 });
      }
    }
  }
}

function drawFireRain(cx, cy) {
  if (lavaAmt <= 0) return;
  ctx.globalAlpha = lavaAmt;
  for (const f of fireRain) {
    const x = Math.round(f.x - cx), y = Math.round(f.y - cy);
    const ux = f.vx / f.vy, k = f.big ? 2 : 1;
    ctx.fillStyle = 'rgba(255, 90, 20, 0.35)';
    ctx.fillRect(x - 2 * k, y - 2 * k, 5 * k, 5 * k);
    ctx.fillStyle = '#c8281c';
    ctx.fillRect(Math.round(x - ux * 8 * k), y - 8 * k, k, 3 * k);
    ctx.fillStyle = '#ff6a1a';
    ctx.fillRect(Math.round(x - ux * 4 * k), y - 5 * k, 2 * k, 4 * k);
    ctx.fillStyle = '#ffb040';
    ctx.fillRect(x - k, y - k, 3 * k, 3 * k);
    ctx.fillStyle = '#fff2b0';
    ctx.fillRect(x, y, k, k);
  }
  ctx.globalAlpha = 1;
}

// Magma tops shimmer, and the whole view gets a red-orange heat glow inside the volcano.
function drawMagmaGlow(cx, cy) {
  for (const s of magmaPlats) {
    const sx = s.x - cx, sy = s.y - cy;
    if (sx + s.w < 0 || sx > VIEW_W || sy < -8 || sy > VIEW_H + 4) continue;
    for (let x = 0; x < s.w; x += 4) {
      const a = 0.25 + 0.25 * Math.sin(time * 3 + (s.x + x) * 0.3);
      ctx.fillStyle = `rgba(255, 224, 138, ${a.toFixed(2)})`;
      ctx.fillRect(sx + x, sy, Math.min(4, s.w - x), 1);
      ctx.fillStyle = `rgba(255, 106, 26, ${(a * 0.5).toFixed(2)})`;
      ctx.fillRect(sx + x, sy - 2, Math.min(4, s.w - x), 2);
    }
  }
}
// Being on fire gives the same red glow as the volcano (without the falling fire).
let burnAmt = 0;
function drawHeat() {
  const heat = Math.max(lavaAmt, burnAmt);
  if (heat <= 0) return;
  ctx.fillStyle = `rgba(255, 80, 20, ${(0.12 * heat).toFixed(3)})`;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  const gr = ctx.createLinearGradient(0, VIEW_H * 0.55, 0, VIEW_H);
  gr.addColorStop(0, 'rgba(255, 90, 20, 0)');
  gr.addColorStop(1, `rgba(255, 90, 20, ${(0.22 * heat).toFixed(3)})`);
  ctx.fillStyle = gr;
  ctx.fillRect(0, VIEW_H * 0.55, VIEW_W, VIEW_H * 0.45);
  if (burnAmt > 0) {
    const pulse = 0.8 + 0.2 * Math.sin(time * 6);
    ctx.fillStyle = `rgba(255, 50, 20, ${(0.1 * burnAmt * pulse).toFixed(3)})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    const v = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.35, VIEW_W / 2, VIEW_H / 2, VIEW_W * 0.6);
    v.addColorStop(0, 'rgba(255, 40, 10, 0)');
    v.addColorStop(1, `rgba(255, 40, 10, ${(0.45 * burnAmt * pulse).toFixed(3)})`);
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}

// Draws the part of a world-space image (whose top edge sits at world y = top) that is in view.
function drawWorldImage(img, top, cx, cy) {
  const sy = Math.max(0, cy - top), ey = Math.min(img.height, cy + VIEW_H - top);
  if (ey <= sy) return;
  ctx.drawImage(img, cx, sy, VIEW_W, ey - sy, 0, top + sy - cy, VIEW_W, ey - sy);
}

function drawBushes(cx, cy) {
  if (!biomeOpen) return;
  const mine = myBush();
  bushes.forEach((b, i) => {
    const sx = b.x - cx, sy = b.y - cy;
    if (sx < -b.w || sx > VIEW_W || sy < -b.h || sy > VIEW_H) return;
    ctx.globalAlpha = i === mine ? 0.55 : 1;
    ctx.drawImage(b.img, sx, sy);
  });
  ctx.globalAlpha = 1;
}

const CLOUD_ROWS = [
  '....oooo..ooo.....',
  '..oogggooogggoo...',
  '.ogggdgggggggdgoo.',
  'ogggddggggdddgggo.',
  'oggdddddddddddggo',
  '.oddddddddddddddo.',
  '..oooooooooooooo..',
];
function drawStorms(cx, cy, front) {
  const now = performance.now();
  for (const s of storms) {
    const z = stormZone(s), age = (now - s.at) / 1000;
    const sx = Math.round(z.x - cx), sy = Math.round(z.y - cy);
    if (sx > VIEW_W || sx + z.w < 0 || sy > VIEW_H || sy + z.h + 8 < 0) continue;
    if (!front) {
      // Warning glow on the platform while the cloud charges up.
      if (!s.struck && Math.floor(age * 8) % 2 === 0) {
        ctx.fillStyle = 'rgba(255, 246, 160, 0.18)';
        ctx.fillRect(sx, sy, z.w, z.h);
      }
      continue;
    }
    const fade = s.struck ? Math.max(0, 1 - (age - STORM_DELAY) / 0.7) : Math.min(1, age * 4);
    ctx.globalAlpha = fade;
    const scale = 2, cw = 18 * scale, n = Math.max(1, Math.round(z.w / (cw - 8)));
    for (let k = 0; k < n; k++) {
      const ox = sx + Math.round((z.w - cw) * (n === 1 ? 0.5 : k / (n - 1))), oy = sy - 6 + (k % 2) * 3;
      CLOUD_ROWS.forEach((row, ry) => {
        for (let rx = 0; rx < row.length; rx++) {
          const ch = row[rx];
          if (ch === '.') continue;
          ctx.fillStyle = ch === 'o' ? '#1c1a26' : ch === 'g' ? (s.struck ? '#6a6878' : '#4a4858') : '#33313f';
          ctx.fillRect(ox + rx * scale, oy + ry * scale, scale, scale);
        }
      });
    }
    if (!s.struck && Math.random() < 0.35) {
      ctx.fillStyle = '#fff6a0';
      ctx.fillRect(sx + Math.random() * z.w, sy - 2 + Math.random() * 8, 2, 2);
    }
    if (s.bolt && age - STORM_DELAY < 0.4) {
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255, 255, 220, 0.3)';
      ctx.fillRect(sx, sy, z.w, z.h);
      // Flickers off for a frame now and then, like real lightning.
      if (Math.floor((age - STORM_DELAY) * 30) % 4 !== 2) {
        let [px, py] = [z.x + z.w / 2, z.y + 8];
        for (const [bx, by] of s.bolt) {
          drawLine(px - cx, py - cy, bx - cx, by - cy, 'rgba(138, 216, 255, 0.6)', 9);
          drawLine(px - cx, py - cy, bx - cx, by - cy, '#fff6a0', 5);
          drawLine(px - cx, py - cy, bx - cx, by - cy, '#ffffff', 2);
          px = bx; py = by;
        }
      }
    }
    ctx.globalAlpha = 1;
  }
}

function drawLine(x0, y0, x1, y1, color, width) {
  ctx.fillStyle = color;
  const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= steps; i++) {
    const x = Math.round(x0 + (x1 - x0) * i / steps), y = Math.round(y0 + (y1 - y0) * i / steps);
    ctx.fillRect(x - (width >> 1), y, width, 1);
  }
}

function drawIceBlock(x, y) {
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = 'rgba(26, 74, 106, 0.8)';
  ctx.fillRect(x - 2, y - 2, PLAYER_W + 4, PLAYER_H + 4);
  ctx.fillStyle = 'rgba(180, 236, 250, 0.6)';
  ctx.fillRect(x - 1, y - 1, PLAYER_W + 2, PLAYER_H + 2);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x, y, 3, 1);
  ctx.fillRect(x, y + 1, 1, 2);
  ctx.fillRect(x + PLAYER_W - 2, y + PLAYER_H - 3, 1, 2);
}

function drawGame() {
  const cx = Math.round(cam.x), cy = Math.round(cam.y);
  drawBackground(ctx, cx, cy);
  drawWorldImage(levelCanvas, 0, cx, cy);
  if (biomeOpen) drawWorldImage(biomeCanvas, BIOME_TOP, cx, cy);
  drawFrost();
  drawMagmaGlow(cx, cy);
  drawHeat();
  drawBench(cx, cy);
  drawVault(cx, cy);
  drawBucketSpot(cx, cy);
  drawChests(cx, cy);
  drawClovers(cx, cy);
  drawShard(cx, cy);
  drawStorms(cx, cy, false);

  for (const r of remotes.values()) {
    if (r.dead || hiddenFromMe(r)) continue;
    const rch = r.ch >= 0 ? r.ch / 10 : -1;
    drawPlayer(ctx, r.x - cx, r.y - cy, r.c, r.f, r.a, time, playerFx(r.c, r.flash, r.immune, r.punchT, r.w, r.ar, rch));
    if (r.fr) drawIceBlock(r.x - cx, r.y - cy);
    drawNameAndHp(r.n, r.x - cx, r.y - cy, '#ffffff', r.hp, r.maxHp || BASE_HP, r.rb);
    drawChargeBar(r.x - cx, r.y - cy, rch);
    if (r.lz) drawBeam(r.x + PLAYER_W / 2, r.y + 6, r.lz[0], r.lz[1], cx, cy, r.w && ITEMS[r.w].flame);
    if (r.bn) burnFx(r.x, r.y);
  }
  if (!me.dead) {
    const mch = me.charging ? me.chargeT / BOW_CHARGE_TIME : -1;
    const fx = playerFx(me.color, me.flash, immuneLeft() > 0, me.punchT,
      heldKey(), armorList(), mch);
    const inBush = myBush() >= 0;
    if (inBush) ctx.globalAlpha = 0.6;
    drawPlayer(ctx, me.x - cx, me.y - cy, me.color, me.facing, me.anim, time, fx);
    ctx.globalAlpha = 1;
    if (performance.now() < me.frozenUntil) drawIceBlock(me.x - cx, me.y - cy);
    drawNameAndHp(me.name, me.x - cx, me.y - cy, '#ffe66d', me.hp, me.maxHp, radarActive() || inBush);
    if (performance.now() < me.stunUntil && Math.random() < 0.5) {
      emit(me.x + Math.random() * PLAYER_W, me.y + Math.random() * PLAYER_H, 1, Math.random() < 0.5 ? '#fff6a0' : '#8ad8ff', 30, 0.2);
    }
    if (burning()) burnFx(me.x, me.y);
    if (heldItem().kind === 'laser') {
      const out = me.laserOut > 0;
      drawChargeBar(me.x - cx, me.y - cy, out ? 1 - me.laserOut / LASER_EMPTY_COOLDOWN : me.fuel / fuelMax(heldItem()), out ? '#7a3a3a' : '#ff5a4a');
    } else if (heldItem().cooldown >= 1 && me.punchCd > 0) {
      drawChargeBar(me.x - cx, me.y - cy, 1 - me.punchCd / heldItem().cooldown, '#8a8a98');
    } else {
      drawChargeBar(me.x - cx, me.y - cy, mch);
    }
    if (me.beam) drawBeam(me.beam.x1, me.beam.y1, me.beam.x2, me.beam.y2, cx, cy, heldItem().flame);
  }
  drawBushes(cx, cy);
  drawStorms(cx, cy, true);
  drawArrows(cx, cy);
  drawParticles(ctx, cx, cy);
  drawSnow(cx, cy);
  drawFireRain(cx, cy);
  drawDamageNumbers(cx, cy);
  if (skyFlash > 0) {
    ctx.fillStyle = `rgba(255, 252, 230, ${Math.min(0.6, skyFlash)})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }

  if (me.dead) {
    drawDeathScreen();
  } else {
    drawHud();
    drawPlayerArrows(cx, cy);
    if (inventoryOpen) drawInventory();
    if (craftOpen) drawCraftPanel();
    if (storageOpen) drawStoragePanel();
    if (adminOpen) drawAdminPanel();
    drawToast();
  }
}

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
const STEP = 1 / 120;
let acc = 0, lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  time += dt;

  if (state === 'game') {
    if (!me.dead) {
      acc += dt;
      while (acc >= STEP) {
        stepPlayer(me, STEP);
        acc -= STEP;
      }
      updateMe(dt);
    } else {
      acc = 0;
      jumpPressedQueued = punchQueued = false;
      dashQueued = 0;
    }
    updateRemotes(dt);
    updateArrows(dt);
    updateChests(dt);
    updateParticles(dt);
    updateSnow(dt);
    updateVolcano(dt);
    updateDamageNumbers(dt);
    updateCamera(dt);
    drawGame();
  } else {
    updateParticles(dt);
    drawMenu();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
