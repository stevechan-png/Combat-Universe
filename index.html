const ARMOR_SLOTS = ['head', 'chest', 'legs', 'feet'];
// Drop chances are "1 in N" each; they are used as relative weights.
const DROP_TABLES = {
  wood: { wood_sword: 2, leather_helmet: 4, leather_boots: 5, stone_sword: 7, wood_katana: 10, bow: 15, iron_sword: 20, stone_katana: 23, dash: 25, gold_bow: 30 },
  silver: { bow: 2, dash: 5, shuriken: 9, stone_pickaxe: 13, iron_katana: 18, radar_blocker: 20, jetpack: 25, laser_gun: 30 },
  stone: { stone_pickaxe: 3, iron_katana: 5, jetpack: 8, diamond_sword: 13, freeze_power: 15, frozen_blade: 20, diamond_bow: 25, ice_gauntlet: 30, diamond_katana: 40, heavy_hammer: 50 },
  armor: {
    leather_leggings: 2, leather_chestplate: 4, speed_boots: 7, iron_helmet: 10, iron_boots: 10, iron_leggings: 15, iron_chestplate: 15,
    heavy_chestplate: 20, diamond_helmet: 25, diamond_boots: 25, diamond_leggings: 28, diamond_chestplate: 29,
  },
  magma: {
    heavy_chestplate: 2, diamond_sword: 4, laser_gun: 6, magma_helmet: 8, iron_pickaxe: 10, magma_sword: 15, magma_boots: 18,
    magma_leggings: 22, fireball_staff: 25, magma_chestplate: 28, magma_katana: 30, flamethrower: 40, magma_gauntlet: 50,
  },
};
// Ice chests borrow the stone table until they get their own.
DROP_TABLES.ice = DROP_TABLES.stone;
// Luck makes every drop except the most common one `luck` times as likely;
// the most common drop gives up the difference.
function rollChestItem(kind = 'wood', luck = 1) {
  const entries = Object.entries(DROP_TABLES[kind]);
  const total = entries.reduce((a, [, n]) => a + 1 / n, 0);
  let p = entries.map(([, n]) => 1 / n / total);
  if (luck !== 1) {
    const top = p.indexOf(Math.max(...p));
    const rest = (1 - p[top]) * luck;
    const scale = rest > 0.99 ? 0.99 / rest : 1;
    p = p.map((v, i) => (i === top ? 0 : v * luck * scale));
    p[top] = 1 - p.reduce((a, b) => a + b, 0);
  }
  let pick = Math.random();
  for (let i = 0; i < entries.length; i++) {
    pick -= p[i];
    if (pick <= 0) return entries[i][0];
  }
  return entries[0][0];
}

const equipped = { hand: null, hand2: null, head: null, chest: null, legs: null, feet: null, power: null };
let activeHand = 'hand';
const HAND_KINDS = ['melee', 'bow', 'shuriken', 'laser', 'staff'];
// Materials can be held in a weapon slot, but attack like a bare fist.
const slotFor = it => (HAND_KINDS.includes(it.kind) || it.kind === 'material' ? 'hand' : ARMOR_KINDS[it.kind] || (it.kind === 'power' ? 'power' : null));
const armorKey = slot => (equipped[slot] ? equipped[slot].key : '');
const armorList = () => ARMOR_SLOTS.map(armorKey);
// Speed Boots and the Heavy Chestplate scale run speed; they stack.
const speedMult = () => ARMOR_SLOTS.reduce((m, s) => m * (equipped[s] ? ITEMS[equipped[s].key].speed || 1 : 1), 1);
const heldKey = () => (equipped[activeHand] ? equipped[activeHand].key : '');
const weaponKey = () => (heldKey() && HAND_KINDS.includes(ITEMS[heldKey()].kind) ? heldKey() : '');
const heldItem = () => (weaponKey() ? ITEMS[weaponKey()] : FIST_ITEM);
const powerKey = () => (equipped.power ? equipped.power.key : '');
const attackItem = w => {
  if (w === 'punch' || w === undefined) return FIST_ITEM;
  const it = ITEMS[w];
  return it && HAND_KINDS.includes(it.kind) ? it : null;
};
const itemDamage = (it, msg, forChest) => {
  if (forChest && it.chestDamage) return it.chestDamage;
  return it.kind === 'bow' && msg && msg.ch ? it.charged : it.damage;
};
const hasDash = () => powerKey() === 'dash';
const freezeBoosted = () => powerKey() === 'freeze_power' && !me.dead && sectionOf(me.y + PLAYER_H) === SNOW_SECTION;
const maxAirJumps = () => (freezeBoosted() ? FREEZE_AIR_JUMPS : 1);
const remoteBoosted = r => r.pw === 'freeze_power' && sectionOf(r.ty + PLAYER_H) === SNOW_SECTION;

// Armor (and the freeze bonus) raise max HP and current HP by the same amount,
// so swapping gear or walking in and out of the snow can't heal.
function updateMaxHp() {
  const old = me.maxHp;
  me.maxHp = BASE_HP + ARMOR_SLOTS.reduce((n, s) => n + (equipped[s] ? ITEMS[equipped[s].key].hp : 0), 0) +
    (me.boosted ? FREEZE_HP : 0);
  if (!me.dead) me.hp = Math.max(1, Math.min(me.maxHp, me.hp + me.maxHp - old));
}
function syncFreezeBoost() {
  const b = freezeBoosted();
  if (b === me.boosted) return;
  me.boosted = b;
  updateMaxHp();
  if (b) emit(me.x + PLAYER_W / 2, me.y + PLAYER_H / 2, 12, ITEMS.freeze_power.color, 60, 0.5);
}

// Weapons go into the selected weapon slot if it's free, otherwise the other
// free slot, otherwise they replace the selected one.
function toggleEquip(item) {
  const it = ITEMS[item.key];
  let slot = slotFor(it);
  if (!slot) return;
  const current = EQUIP_SLOTS.find(s => equipped[s] === item);
  if (current) {
    equipped[current] = null;
    slot = current;
  } else {
    if (slot === 'hand') {
      const other = activeHand === 'hand' ? 'hand2' : 'hand';
      slot = !equipped[activeHand] ? activeHand : !equipped[other] ? other : activeHand;
    }
    equipped[slot] = item;
  }
  if (slot === activeHand) cancelWeaponActions();
  if (slot === 'power') me.jetting = false;
  updateMaxHp();
  broadcastState();
}

function cancelWeaponActions() {
  me.charging = false;
  me.chargeT = 0;
  if (me.burst > 0) me.punchCd = SHURIKEN_BURST_COOLDOWN;
  me.burst = 0;
  me.beam = null;
  me.punchBuffer = 0;
}

function selectHand(slot) {
  if (slot === activeHand || state !== 'game' || me.dead) return;
  activeHand = slot;
  cancelWeaponActions();
  broadcastState();
}

function deleteMarkedItems() {
  const doomed = inventory.filter(i => i.marked);
  if (!doomed.length) return;
  for (const item of doomed) {
    for (const slot of EQUIP_SLOTS) if (equipped[slot] === item) toggleEquip(item);
  }
  for (let i = inventory.length - 1; i >= 0; i--) if (inventory[i].marked) inventory.splice(i, 1);
  showToast('DELETED ' + doomed.length + (doomed.length === 1 ? ' ITEM' : ' ITEMS'), '#ff8a8a');
}

let toast = null;
function showToast(text, color = '#ffe66d') {
  toast = { text, color, life: 2.5 };
}

const POWER_HELP = {
  dash: 'Q / MIDDLE CLICK / DOUBLE TAP',
  jetpack: 'MIDDLE CLICK / HOLD JUMP',
  radar_blocker: 'Q / MIDDLE CLICK',
  freeze_power: 'STRONGER IN THE SNOW BIOME',
};

// adminBreak: from the admin's Break All Chests. A full inventory then drops its
// oldest unequipped items to make room, and the toast counts the haul instead.
const adminLoot = { n: 0, at: 0 };
function grantChestReward(kind = 'wood', adminBreak = false) {
  if (inventory.length >= INVENTORY_SIZE) {
    const i = adminBreak ? inventory.findIndex(item => !EQUIP_SLOTS.some(s => equipped[s] === item)) : -1;
    if (i < 0) {
      showToast('INVENTORY FULL');
      return;
    }
    inventory.splice(i, 1);
  }
  const key = rollChestItem(kind, luckActive() ? LUCK_MULT : 1);
  const it = ITEMS[key];
  addItem(key);
  if (adminBreak) {
    const now = performance.now();
    if (now - adminLoot.at > 2000) adminLoot.n = 0;
    adminLoot.n++;
    adminLoot.at = now;
    showToast('BROKE ALL CHESTS: GOT ' + adminLoot.n + (adminLoot.n === 1 ? ' ITEM' : ' ITEMS'), '#ffe66d');
    return;
  }
  showToast('GOT ' + it.name + '!' + (POWER_HELP[key] ? ' ' + POWER_HELP[key] : ''), rarityOf(it).text);
}

// Stackable items (like clovers) fill an existing stack before taking a new slot.
const stackMax = key => ITEMS[key].stack || 1;
const itemCount = key => inventory.reduce((n, i) => n + (i.key === key ? i.n || 1 : 0), 0);
const canAdd = key => inventory.length < INVENTORY_SIZE || inventory.some(i => i.key === key && (i.n || 1) < stackMax(key));
function removeItems(key, count) {
  for (let i = inventory.length - 1; i >= 0 && count > 0; i--) {
    const item = inventory[i];
    if (item.key !== key) continue;
    const take = Math.min(count, item.n || 1);
    count -= take;
    if ((item.n || 1) - take > 0) {
      item.n -= take;
    } else {
      for (const slot of EQUIP_SLOTS) if (equipped[slot] === item) toggleEquip(item);
      inventory.splice(i, 1);
    }
  }
}

function useItem(item) {
  if (ITEMS[item.key].kind !== 'consumable') return;
  if (item.key === 'luck_potion') {
    me.luckUntil = Math.max(performance.now(), me.luckUntil) + LUCK_TIME * 1000;
    showToast('LUCK POTION: ' + LUCK_MULT + 'X CHEST LUCK FOR 2 MIN', ITEMS.luck_potion.color);
    emit(me.x + PLAYER_W / 2, me.y + PLAYER_H / 2, 14, ITEMS.luck_potion.color, 60, 0.6);
  }
  removeItems(item.key, 1);
}

function addItem(key) {
  if (stackMax(key) > 1) {
    const stack = inventory.find(i => i.key === key && (i.n || 1) < stackMax(key));
    if (stack) {
      stack.n = (stack.n || 1) + 1;
      return stack;
    }
  }
  const item = stackMax(key) > 1 ? { key, n: 1 } : { key };
  inventory.push(item);
  const it = ITEMS[key], slot = slotFor(it);
  const autoEquip = it.kind !== 'material' || it.autoHold;
  if (slot && autoEquip && (slot === 'hand' ? !equipped.hand || !equipped.hand2 : !equipped[slot])) toggleEquip(item);
  return item;
}

// ---------------------------------------------------------------------------
// Admin panel (Tab), only for players with LARP in their name
// ---------------------------------------------------------------------------
const isAdmin = () => me.name.includes('LARP');
// The page source is public, so only a hash of the password is kept here.
const ADMIN_PASS_HASH = 4114122251;
const hashText = s => [...s].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0, 2166136261);
const ADMIN_PASS_MAX = 12;
let adminPass = '';
let adminPassError = 0;
function adminNames() {
  try {
    const list = JSON.parse(localStorage.getItem('combat.adminNames') || '[]');
    return Array.isArray(list) ? list : [];
  } catch (e) {
    return [];
  }
}
const adminUnlocked = () => adminNames().includes(me.name);
function unlockAdmin() {
  try {
    localStorage.setItem('combat.adminNames', JSON.stringify([...adminNames(), me.name]));
  } catch (e) { /* storage unavailable */ }
}
let adminOpen = false;
let adminTab = 'teleport';
let adminSearch = '';
let adminSearchFocus = false;
let adminScroll = 0;
const ADMIN_PANEL = { x: VIEW_W / 2 - 130, y: 26, w: 260, h: 200 };
const ADMIN_TABS = [{ id: 'teleport', label: 'TELEPORT' }, { id: 'inventory', label: 'INVENTORY' }, { id: 'events', label: 'EVENTS' }];
const adminTabRect = i => ({ x: ADMIN_PANEL.x + 6 + i * 84, y: ADMIN_PANEL.y + 17, w: 80, h: 14 });
const ADMIN_EVENTS = [
  { id: 'ice', label: 'SPAWN ICE CHESTS' },
  { id: 'biome', label: 'SUMMON THUNDER BIOME' },
  { id: 'kill', label: 'KILL ALL' },
  { id: 'break', label: 'BREAK ALL CHESTS' },
  { id: 'thunder', label: 'SUMMON THUNDER X1' },
  { id: 'tracker', label: 'THUNDER TRACKER' },
  { id: 'shard', label: 'SPAWN ICE SHARD' },
];
const eventBtnRect = i => ({ x: ADMIN_PANEL.x + 20, y: ADMIN_PANEL.y + 38 + i * 22, w: ADMIN_PANEL.w - 40, h: 19 });
const TRACKER_DOUBLE_CLICK = 400;
let adminIceCount = 0;
let trackerRepeat = false, trackerNext = 0, lastTrackerClick = 0;
// Layer 2 is the second half of the layer 1 biome, so it isn't a separate stop.
// Layer 6 is the thunder biome; teleporting there summons it if it hasn't appeared yet.
const tpLayers = () => [1, 3, 4, 5, 6];
const layerName = layer => (layer === 6 ? 'THUNDER BIOME' : 'LAYER ' + layer);
const tpBtnRect = i => ({ x: ADMIN_PANEL.x + 40, y: ADMIN_PANEL.y + 50 + i * 29, w: 180, h: 25 });
const ADMIN_SEARCH = { x: ADMIN_PANEL.x + 6, y: ADMIN_PANEL.y + 37, w: ADMIN_PANEL.w - 62, h: 14 };
const ADMIN_SEARCH_BTN = { x: ADMIN_PANEL.x + ADMIN_PANEL.w - 52, y: ADMIN_PANEL.y + 37, w: 46, h: 14 };
const ADMIN_LIST = { x: ADMIN_PANEL.x + 6, y: ADMIN_PANEL.y + 56, w: ADMIN_PANEL.w - 12, h: ADMIN_PANEL.h - 62 };
const ADMIN_ROW = 18, ADMIN_HEADER = 13, ADMIN_SEARCH_MAX = 20;
const ADMIN_CATEGORIES = [
  { label: 'WEAPONS', test: it => HAND_KINDS.includes(it.kind) },
  { label: 'ARMOR', test: it => !!ARMOR_KINDS[it.kind] },
  { label: 'POWER', test: it => it.kind === 'power' },
  { label: 'MATERIALS/ITEMS', test: it => it.kind === 'material' || it.kind === 'consumable' },
];

function toggleAdmin() {
  if (!isAdmin() || state !== 'game' || me.dead) return;
  adminOpen = !adminOpen;
  adminSearchFocus = false;
  adminPass = '';
  adminPassError = 0;
  if (adminOpen) inventoryOpen = pickerOpen = craftOpen = storageOpen = false;
}

function adminPasswordKey(e) {
  e.preventDefault();
  if (e.code === 'Tab' || e.code === 'Escape') {
    if (!e.repeat) closeAdmin();
  } else if (e.code === 'Backspace') {
    adminPass = adminPass.slice(0, -1);
  } else if (e.code === 'Enter' || e.code === 'NumpadEnter') {
    if (hashText(adminPass) === ADMIN_PASS_HASH) {
      unlockAdmin();
      showToast('ADMIN UNLOCKED', '#6ad46a');
    } else {
      adminPassError = 1;
    }
    adminPass = '';
  } else if (e.key.length === 1 && /[a-z0-9]/i.test(e.key) && adminPass.length < ADMIN_PASS_MAX) {
    adminPass += e.key.toUpperCase();
    adminPassError = 0;
  }
}

function closeAdmin() {
  adminOpen = adminSearchFocus = false;
}

function adminRows() {
  const q = adminSearch.trim();
  const rows = [];
  let y = 0;
  for (const cat of ADMIN_CATEGORIES) {
    const keys = Object.keys(ITEMS).filter(k => cat.test(ITEMS[k]) && (!q || ITEMS[k].name.includes(q)));
    if (!keys.length) continue;
    rows.push({ header: cat.label, y, h: ADMIN_HEADER });
    y += ADMIN_HEADER;
    for (const key of keys) {
      rows.push({ key, y, h: ADMIN_ROW });
      y += ADMIN_ROW;
    }
  }
  return { rows, height: y };
}

function clampAdminScroll() {
  adminScroll = Math.max(0, Math.min(adminRows().height - ADMIN_LIST.h, adminScroll));
}

function adminRowAtMouse() {
  if (!over(ADMIN_LIST)) return null;
  const ly = mouse.y - ADMIN_LIST.y + adminScroll;
  return adminRows().rows.find(r => r.key && ly >= r.y && ly < r.y + r.h) || null;
}

function adminClick() {
  if (!adminUnlocked()) return;
  adminSearchFocus = false;
  ADMIN_TABS.forEach((t, i) => {
    if (over(adminTabRect(i))) adminTab = t.id;
  });
  if (adminTab === 'teleport') {
    tpLayers().forEach((layer, i) => {
      if (over(tpBtnRect(i))) adminTeleport(layer);
    });
    return;
  }
  if (adminTab === 'events') {
    ADMIN_EVENTS.forEach((ev, i) => {
      if (over(eventBtnRect(i))) adminEvent(ev.id);
    });
    return;
  }
  if (over(ADMIN_SEARCH) || over(ADMIN_SEARCH_BTN)) {
    adminSearchFocus = true;
    return;
  }
  const row = adminRowAtMouse();
  if (row) adminGive(row.key);
}

function adminSearchKey(e) {
  e.preventDefault();
  if (e.code === 'Backspace') adminSearch = adminSearch.slice(0, -1);
  else if (['Enter', 'NumpadEnter', 'Escape', 'Tab'].includes(e.code)) adminSearchFocus = false;
  else if (e.key.length === 1 && /[a-z0-9 \-]/i.test(e.key) && adminSearch.length < ADMIN_SEARCH_MAX) adminSearch += e.key.toUpperCase();
  adminScroll = 0;
}

function adminGive(key) {
  if (!canAdd(key)) {
    showToast('INVENTORY FULL');
    return;
  }
  addItem(key);
  showToast('ADDED ' + ITEMS[key].name, rarityOf(ITEMS[key]).text);
}

function adminTeleport(layer) {
  const sec = layer - 1;
  const summoned = sec >= BIOME_SECTION && !biomeOpen;
  if (summoned) {
    openBiome(true);
    if (sendBiome) {
      try { sendBiome({ open: 1 }); } catch (e) { /* ignore */ }
    }
  }
  if (sec === 0) {
    spawn(me);
  } else {
    const spots = solids.filter(s => s.t === P && s.w >= 40 && sectionOf(s.y) === sec &&
      !overlaps(s.x + s.w / 2 - PLAYER_W / 2, s.y - PLAYER_H - 1, PLAYER_W, PLAYER_H));
    const s = spots[Math.floor(Math.random() * spots.length)];
    me.x = s.x + s.w / 2 - PLAYER_W / 2;
    me.y = s.y - PLAYER_H - 1;
    me.vx = me.vy = 0;
  }
  me.jetting = false;
  me.dashT = 0;
  cam.x = Math.max(0, Math.min(WORLD_W - VIEW_W, me.x - VIEW_W / 2));
  cam.y = Math.max(worldTop(), Math.min(WORLD_H - VIEW_H, me.y - VIEW_H / 2));
  closeAdmin();
  broadcastState();
  if (!summoned) showToast('TELEPORTED TO ' + layerName(layer), GRASS[sec].top);
}

function summonBiome() {
  if (biomeOpen) return false;
  openBiome(true);
  chestsDirty = true;
  if (sendBiome) {
    try { sendBiome({ open: 1 }); } catch (e) { /* ignore */ }
  }
  return true;
}

// Chest changes run on the chest host; anyone else asks the host to do them.
function adminToHost(d) {
  if (isChestHost()) hostAdmin(myPeerId, d);
  else if (sendAdmin) {
    try { sendAdmin(d, chestHostId()); } catch (e) { /* host gone */ }
  }
}

function adminEvent(id) {
  if (!isAdmin() || !adminUnlocked()) return;
  if (id === 'ice') {
    adminIceCount++;
    adminToHost({ ice: adminIceCount });
    showToast('SPAWNING ' + adminIceCount + (adminIceCount === 1 ? ' ICE CHEST' : ' ICE CHESTS'), '#b4ecfa');
  } else if (id === 'biome') {
    if (summonBiome()) showToast('THUNDER BIOME SUMMONED', GRASS[BIOME_SECTION].top);
    else showToast('THE THUNDER BIOME IS ALREADY HERE', GRASS[BIOME_SECTION].top);
  } else if (id === 'kill') {
    const alive = [...remotes.values()].filter(r => !r.dead).length;
    if (sendAdmin) {
      try { sendAdmin({ kill: 1 }); } catch (e) { /* ignore */ }
    }
    showToast('KILLED ' + alive + (alive === 1 ? ' PLAYER' : ' PLAYERS'), '#ff6a6a');
  } else if (id === 'break') {
    adminToHost({ breakAll: 1 });
  } else if (id === 'thunder') {
    adminStorms([stormRectAt(me.x + PLAYER_W / 2, me.y + PLAYER_H)]);
  } else if (id === 'tracker') {
    const now = performance.now();
    if (trackerRepeat) {
      trackerRepeat = false;
      showToast('THUNDER TRACKER OFF', '#fff6a0');
    } else if (now - lastTrackerClick < TRACKER_DOUBLE_CLICK) {
      trackerRepeat = true;
      trackerNext = now + 1000;
      showToast('THUNDER TRACKER ON: EVERY SECOND', '#fff6a0');
    } else {
      thunderTracker();
    }
    lastTrackerClick = now;
  } else if (id === 'shard') {
    const feet = me.y + PLAYER_H;
    const s = solids.find(o => Math.abs(o.y - feet) <= 1 && me.x + PLAYER_W > o.x && me.x < o.x + o.w);
    if (!s) {
      showToast('STAND ON A PLATFORM FIRST', '#b4ecfa');
      return;
    }
    const want = me.facing > 0 ? me.x + PLAYER_W + 4 : me.x - SHARD_W - 4;
    const x = Math.round(Math.max(s.x, Math.min(s.x + s.w - SHARD_W, want)));
    adminToHost({ shard: [x, s.y - SHARD_H] });
    showToast('ICE SHARD SPAWNED', ITEMS.ice_shard.color);
  }
}

// Strikes the surface under (or nearest to) a point, capped so the ground doesn't light up end to end.
const ADMIN_STORM_MAX_W = 120;
function stormRectAt(px, feet) {
  let best = null, bestScore = Infinity;
  for (const s of solids) {
    if (s.t !== P && s.t !== 'ground') continue;
    const dx = px < s.x ? s.x - px : px > s.x + s.w ? px - s.x - s.w : 0;
    const dy = s.y >= feet - 4 ? s.y - feet : 200 + feet - s.y;
    const score = dx * 2 + dy;
    if (score < bestScore) { bestScore = score; best = s; }
  }
  if (!best) return null;
  const w = Math.min(best.w, ADMIN_STORM_MAX_W);
  const x = Math.max(best.x, Math.min(best.x + best.w - w, px - w / 2));
  return [Math.round(x), best.y, w];
}

function thunderTracker() {
  const rects = [];
  for (const r of remotes.values()) {
    if (r.dead) continue;
    const rect = stormRectAt(r.tx + PLAYER_W / 2, r.ty + PLAYER_H);
    if (rect) rects.push(rect);
  }
  adminStorms(rects);
  if (!trackerRepeat) showToast(rects.length ? 'THUNDER SENT TO ' + rects.length + (rects.length === 1 ? ' PLAYER' : ' PLAYERS') : 'NO PLAYERS TO TRACK', '#fff6a0');
}

function tickTracker() {
  if (!trackerRepeat) return;
  if (state !== 'game' || !isAdmin()) { trackerRepeat = false; return; }
  const now = performance.now();
  if (now < trackerNext) return;
  trackerNext = now + 1000;
  thunderTracker();
}

function adminStorms(rects) {
  rects = rects.filter(Boolean);
  if (!rects.length) return;
  for (const r of rects) startStormRect(r, myPeerId);
  if (sendStorm) {
    try { sendStorm({ r: rects }); } catch (e) { /* ignore */ }
  }
}

function onAdminMsg(id, d) {
  const r = remotes.get(id);
  if (!d || !r || !r.n.includes('LARP')) return;
  if (d.kill) {
    if (state !== 'game' || me.dead) return;
    me.hp = 0;
    if (sendDamage) {
      try { sendDamage({ a: me.maxHp, hp: 0 }); } catch (e) { /* ignore */ }
    }
    die(r.n);
    return;
  }
  if (isChestHost()) hostAdmin(id, d);
}

function hostAdmin(by, d) {
  if (d.breakAll) breakAllChests(by);
  if (d.ice) spawnIceChests(Math.max(1, Math.min(30, d.ice | 0)));
  if (Array.isArray(d.shard) && d.shard.every(Number.isFinite)) spawnShardAt(d.shard[0], d.shard[1]);
}

// Admin shards can go anywhere and replace the current one.
function spawnShardAt(x, y) {
  if (x < 0 || x > WORLD_W - SHARD_W || y < worldTop() || y > WORLD_H) return;
  shard = { id: Math.random().toString(36).slice(2, 10), x: Math.round(x), y: Math.round(y), hp: SHARD_HP, flash: 0, last: performance.now() };
  broadcastChests();
}

function breakAllChests(by) {
  for (const c of [...chests]) {
    const msg = { id: c.id, by, x: c.x, y: c.y, k: chestKind(c), a: 1 };
    onChestBreak(msg, myPeerId);
    if (sendChestBreak) {
      try { sendChestBreak(msg); } catch (e) { /* ignore */ }
    }
  }
  chestsDirty = true;
}

function spawnIceChests(n) {
  let made = 0;
  for (let i = 0; i < n; i++) {
    const spot = randomChestSpot(SNOW_SECTION, CHEST_KINDS.ice.w, CHEST_KINDS.ice.h);
    if (!spot) break;
    chests.push({ id: Math.random().toString(36).slice(2, 10), ...spot, k: 'ice', hp: CHEST_KINDS.ice.hp, flash: 0, born: performance.now() });
    made++;
  }
  if (made) {
    announceIceChest();
    broadcastChests();
  }
}

// ---------------------------------------------------------------------------
// Chests
// ---------------------------------------------------------------------------
// One peer (whoever has been in the lobby longest) owns chest state and
// broadcasts it; everyone else sends hit requests to that peer.
const CHEST_COUNT = 5; // per map section
const CHEST_HP = 50;
const CHEST_W = 14, CHEST_H = 11;
const CHEST_SPRITE = [
  '.oooooooooooo.',
  'ohhhhhhhhhhhho',
  'owwwwwwwwwwwwo',
  'oddddddddddddo',
  'ommmmmyymmmmmo',
  'owwwwwyywwwwwo',
  'owwwwwwwwwwwwo',
  'owwwwwwwwwwwwo',
  'oddddddddddddo',
  'ommmmmmmmmmmmo',
  '.oooooooooooo.',
];
const CHEST_PAL = { o: '#2a1608', h: '#d29a5a', w: '#a8672f', d: '#7a4520', m: '#6a6a78', y: '#f2c14e' };
const SILVER_PAL = { o: '#1a1c28', h: '#f4f7fc', w: '#c2c8d4', d: '#868ea0', m: '#4e5466', y: '#4ae8f0' };
const STONE_PAL = { o: '#1e1e26', h: '#b4b4be', w: '#8a8a96', d: '#5c5c68', m: '#f2c14e', y: '#fff3a0' };
const ARMOR_PAL = { o: '#1c0e12', h: '#c25a5e', w: '#8e2e34', d: '#5e1a20', m: '#c8ccd6', y: '#f2f4f8' };
const ICE_PAL = { o: '#1a4a6a', h: '#f4ffff', w: '#b4ecfa', d: '#78c4e2', m: '#e2fbff', y: '#4ae8f0' };
const MAGMA_PAL = { o: '#1a0a06', h: '#ff9a3d', w: '#c8381c', d: '#5a1a10', m: '#2a1a16', y: '#ffe08a' };
// Silver chests are tougher, and only hits stronger than a stone sword can damage them.
const SILVER_CHEST_HP = 100;
const SILVER_MIN_DAMAGE = ITEMS.stone_sword.damage + 1;
// minDamage: hits below it do nothing (silverOk items skip the silver check).
// needsItem / needsItems: only those exact items can damage the chest.
const CHEST_KINDS = {
  wood: { hp: CHEST_HP, pal: CHEST_PAL, fx: ['#a8672f', '#f2c14e'] },
  silver: { hp: SILVER_CHEST_HP, pal: SILVER_PAL, fx: ['#c2c8d4', '#4ae8f0'], minDamage: SILVER_MIN_DAMAGE, silverOk: true },
  stone: { hp: 300, pal: STONE_PAL, fx: ['#8a8a96', '#f2c14e'], minDamage: 21 },
  ice: { hp: 1000, pal: ICE_PAL, fx: ['#d8f6ff', '#4ae8f0'], needsItem: 'frozen_pickaxe', w: 20, h: 16 },
  armor: { hp: 100, pal: ARMOR_PAL, fx: ['#7a2a30', '#c8ccd6'], minDamage: 9 },
  magma: { hp: 350, pal: MAGMA_PAL, fx: ['#ff6a1a', '#ffe08a'], minDamage: 30 },
};
// The Armorer's Chest keeps one or two in every biome; the number is rerolled each time one breaks.
const ARMOR_BIOMES = [[0, 1], [2], [3], [4], [BIOME_SECTION, BIOME_SECTION + 1]];
const armorBiomeOf = sec => ARMOR_BIOMES.findIndex(b => b.includes(sec));
const rollArmorTarget = () => (Math.random() < 0.5 ? 1 : 2);
const armorTargets = ARMOR_BIOMES.map(rollArmorTarget);
const isChestKind = k => Object.prototype.hasOwnProperty.call(CHEST_KINDS, k);
// How many of each chest kind every map section keeps (section 0 is the bottom).
const CHEST_MIX = [
  { wood: 5 },
  { wood: 3, silver: 2 },
  { silver: 5 },
  { stone: 5 },
  { magma: 5 },
];
const ICE_ROLL_INTERVAL = 60;
const ICE_CHANCE = 0.2;
const ICE_CHEST_LIFE = 300;
const chestKind = c => (isChestKind(c.k) ? c.k : sectionOf(c.y + CHEST_H) >= 2 ? 'silver' : 'wood');
const chestMaxHp = c => CHEST_KINDS[chestKind(c)].hp;
const chestW = c => CHEST_KINDS[chestKind(c)].w || CHEST_W;
const chestH = c => CHEST_KINDS[chestKind(c)].h || CHEST_H;
const hitDamage = msg => itemDamage(attackItem(msg && msg.w) || FIST_ITEM, msg, true);
function canHurtChest(kind, msg) {
  const rule = CHEST_KINDS[kind];
  if (msg && ITEMS[msg.w] && ITEMS[msg.w].mineAll) return true;
  if (rule.needsItem) return !!msg && msg.w === rule.needsItem;
  if (rule.needsItems) return !!msg && rule.needsItems.includes(msg.w);
  if (!rule.minDamage) return true;
  const it = attackItem(msg && msg.w) || FIST_ITEM;
  return (rule.silverOk && !!it.silverOk) || itemDamage(it, msg, true) >= rule.minDamage;
}
const CHEST_SURFACES = solids.filter(s => (s.t === P || s.t === 'ground') && s.w >= CHEST_W + 8);
const chestSection = c => sectionOf(c.y + chestH(c));
// The purple biome has 11 fixed chest spots, split over its two sections.
const BIOME_CHEST_MIX = { wood: 3, silver: 3, stone: 2 };
const BIOME_CHEST_SPOTS = (() => {
  const rnd = mulberry32(778);
  const spots = [];
  for (const [sec, n] of [[BIOME_SECTION, 6], [BIOME_SECTION + 1, 5]]) {
    const plats = BIOME_PLATS.filter(s => sectionOf(s.y) === sec);
    for (let i = 0; i < n && plats.length; i++) {
      const s = plats.splice(Math.floor(rnd() * plats.length), 1)[0];
      spots.push({ x: Math.round(s.x + s.w / 2 - CHEST_W / 2), y: s.y - CHEST_H });
    }
  }
  return spots;
})();

let chests = [];
let chestsKnown = false;
let chestsDirty = false;
let lastChestBroadcast = 0;
let joinedPerf = 0;
let nextIceRoll = 0;

function chestHostId() {
  let best = myPeerId, bestT = me.joinedAt;
  for (const [id, r] of remotes) {
    if (!r.joinedAt) continue;
    if (r.joinedAt < bestT || (r.joinedAt === bestT && id < best)) {
      best = id;
      bestT = r.joinedAt;
    }
  }
  return best;
}
const isChestHost = () => chestHostId() === myPeerId;

// Keeps random chests and clovers off the bench, the bucket and the storage chest.
const reservedSpot = (x, y, w, h) =>
  rectsOverlap(x, y, w, h, BENCH.x - 10, BENCH.y - 10, BENCH.w + 20, BENCH.h + 10)
  || rectsOverlap(x, y, w, h, VAULT.x - 10, VAULT.y - 10, VAULT.w + 20, VAULT.h + 10)
  || rectsOverlap(x, y, w, h, BUCKET_SPOT.x - 8, BUCKET_SPOT.y - 4, BUCKET_W + 16, BUCKET_H + 4);

function randomChestSpot(section, w = CHEST_W, h = CHEST_H) {
  const surfaces = CHEST_SURFACES.filter(s => sectionOf(s.y) === section && s.w >= w + 8);
  if (!surfaces.length) return null;
  const weight = s => Math.min(s.w, 200);
  const total = surfaces.reduce((a, s) => a + weight(s), 0);
  for (let tries = 0; tries < 30; tries++) {
    let pick = Math.random() * total, surf = surfaces[0];
    for (const s of surfaces) {
      pick -= weight(s);
      if (pick <= 0) { surf = s; break; }
    }
    const x = Math.round(surf.x + 2 + Math.random() * (surf.w - w - 4));
    const y = surf.y - h;
    if (overlaps(x, y, w, h)) continue;
    if (reservedSpot(x, y, w, h)) continue;
    if (chests.some(c => Math.abs(c.x - x) < 30 && Math.abs(c.y - y) < 20)) continue;
    if (shard && Math.abs(shard.x - x) < 30 && Math.abs(shard.y - y) < 20) continue;
    return { x, y };
  }
  return null;
}

function broadcastChests() {
  lastChestBroadcast = performance.now();
  chestsDirty = false;
  if (!sendChests) return;
  try {
    sendChests({
      l: chests.map(c => (c.born ? [c.id, c.x, c.y, c.hp, c.k, Math.round(performance.now() - c.born)] : [c.id, c.x, c.y, c.hp, c.k])),
      b: biomeOpen ? Math.max(1, Math.round(biomeCloseAt - performance.now())) : 0,
      cv: clovers.map(c => [c.id, c.x, c.y, c.hp]),
      is: shard ? [shard.id, shard.x, shard.y, shard.hp, Math.round(performance.now() - shard.last)] : 0,
    });
  } catch (e) { /* ignore */ }
}

function tickChests() {
  if (state !== 'game' || !isChestHost()) {
    nextBiomeRoll = nextStormRoll = nextIceRoll = nextShardRoll = 0;
    return;
  }
  const now = performance.now();
  if (!chestsKnown) {
    // Give an existing host time to tell us about its chests before making our own.
    if (netStatus !== 'OFFLINE' && now - joinedPerf < 2500) return;
    chestsKnown = true;
  }
  tickBiomeEvents(now);
  let added = false;
  const before = chests.length;
  chests = chests.filter(c => chestKind(c) !== 'ice' || now - (c.born || now) < ICE_CHEST_LIFE * 1000);
  if (chests.length !== before) added = true;
  if (biomeOpen) {
    for (const k of Object.keys(BIOME_CHEST_MIX)) {
      let have = chests.filter(c => chestSection(c) >= BIOME_SECTION && chestKind(c) === k).length;
      while (have < BIOME_CHEST_MIX[k]) {
        const free = BIOME_CHEST_SPOTS.filter(sp => !chests.some(c => c.x === sp.x && c.y === sp.y));
        if (!free.length) break;
        const spot = free[Math.floor(Math.random() * free.length)];
        const c = { id: Math.random().toString(36).slice(2, 10), ...spot, k, hp: 0, flash: 0 };
        c.hp = chestMaxHp(c);
        chests.push(c);
        have++;
        added = true;
      }
    }
  }
  for (let sec = 0; sec < SECTIONS; sec++) {
    for (const k of Object.keys(CHEST_MIX[sec])) {
      let have = chests.filter(c => chestSection(c) === sec && chestKind(c) === k).length;
      while (have < CHEST_MIX[sec][k]) {
        const spot = randomChestSpot(sec);
        if (!spot) break;
        const c = { id: Math.random().toString(36).slice(2, 10), ...spot, k, hp: 0, flash: 0 };
        c.hp = chestMaxHp(c);
        chests.push(c);
        have++;
        added = true;
      }
    }
  }
  ARMOR_BIOMES.forEach((secs, b) => {
    const inBiome = secs[0] >= BIOME_SECTION;
    if (inBiome && !biomeOpen) return;
    let have = chests.filter(c => chestKind(c) === 'armor' && armorBiomeOf(chestSection(c)) === b).length;
    while (have < armorTargets[b]) {
      let spot = null;
      if (inBiome) {
        const free = BIOME_CHEST_SPOTS.filter(sp => !chests.some(c => c.x === sp.x && c.y === sp.y));
        if (free.length) spot = free[Math.floor(Math.random() * free.length)];
      } else {
        spot = randomChestSpot(secs[Math.floor(Math.random() * secs.length)]);
      }
      if (!spot) break;
      chests.push({ id: Math.random().toString(36).slice(2, 10), ...spot, k: 'armor', hp: CHEST_KINDS.armor.hp, flash: 0 });
      have++;
      added = true;
    }
  });
  // Rare ice chest: at most one, with a 1 in 5 chance each minute while there isn't one.
  if (!nextIceRoll) nextIceRoll = now + ICE_ROLL_INTERVAL * 1000;
  if (now >= nextIceRoll) {
    nextIceRoll = now + ICE_ROLL_INTERVAL * 1000;
    if (!chests.some(c => chestKind(c) === 'ice') && Math.random() < ICE_CHANCE) {
      const spot = randomChestSpot(SNOW_SECTION, CHEST_KINDS.ice.w, CHEST_KINDS.ice.h);
      if (spot) {
        chests.push({ id: Math.random().toString(36).slice(2, 10), ...spot, k: 'ice', hp: CHEST_KINDS.ice.hp, flash: 0, born: now });
        added = true;
        announceIceChest();
      }
    }
  }
  if (tickClovers(now)) added = true;
  if (tickShard(now)) added = true;
  if (added || chestsDirty || now - lastChestBroadcast > 1000) broadcastChests();
}

// Clovers: small, easy-to-miss pickups. The chest host keeps a few of them
// on the lower layers and respawns picked ones after a while.
const CLOVER_MAX = 3, CLOVER_W = 5, CLOVER_H = 4;
const CLOVER_SECTIONS = [0, 1, 2];
const CLOVER_RESPAWN_MIN = 15, CLOVER_RESPAWN_MAX = 45;
let clovers = [];
let nextCloverAt = 0;
const CLOVER_HP = 5;
let sendClover = null;

function randomCloverSpot() {
  const surfaces = CHEST_SURFACES.filter(s => CLOVER_SECTIONS.includes(sectionOf(s.y)));
  for (let tries = 0; tries < 30; tries++) {
    const s = surfaces[Math.floor(Math.random() * surfaces.length)];
    const x = Math.round(s.x + 2 + Math.random() * (s.w - CLOVER_W - 4));
    const y = s.y - CLOVER_H;
    if (overlaps(x, y, CLOVER_W, CLOVER_H)) continue;
    if (reservedSpot(x, y, CLOVER_W, CLOVER_H)) continue;
    if (chests.some(c => rectsOverlap(x - 2, y, CLOVER_W + 4, CLOVER_H, c.x, c.y, chestW(c), chestH(c)))) continue;
    if (clovers.some(c => Math.abs(c.x - x) < 40 && Math.abs(c.y - y) < 20)) continue;
    return { x, y };
  }
  return null;
}

function tickClovers(now) {
  if (clovers.length >= CLOVER_MAX || now < nextCloverAt) return false;
  let added = false;
  // The first fill is instant; after that one clover regrows at a time.
  const n = nextCloverAt ? 1 : CLOVER_MAX - clovers.length;
  for (let i = 0; i < n; i++) {
    const spot = randomCloverSpot();
    if (!spot) break;
    clovers.push({ id: Math.random().toString(36).slice(2, 10), ...spot, hp: CLOVER_HP });
    added = true;
  }
  nextCloverAt = now + (CLOVER_RESPAWN_MIN + Math.random() * (CLOVER_RESPAWN_MAX - CLOVER_RESPAWN_MIN)) * 1000;
  return added;
}

// Bucket: always waiting on the platform closest to the middle of the snow
// biome. Anyone without a bucket can walk into it to take one.
const BUCKET_W = 8, BUCKET_H = 8;
const BUCKET_SPOT = (() => {
  const midX = WORLD_W / 2, midY = WORLD_H - (SNOW_SECTION + 0.5) * SECTION_H;
  const s = CHEST_SURFACES.filter(o => sectionOf(o.y) === SNOW_SECTION)
    .sort((a, b) => Math.hypot(a.x + a.w / 2 - midX, a.y - midY) - Math.hypot(b.x + b.w / 2 - midX, b.y - midY))[0];
  const x = Math.round(Math.max(s.x + 2, Math.min(s.x + s.w - BUCKET_W - 2, midX - BUCKET_W / 2)));
  return { x, y: s.y - BUCKET_H };
})();
const hasBucket = () => BUCKET_KEYS.some(k => itemCount(k) > 0);
const feetSection = () => sectionOf(me.y + PLAYER_H - 1);

function updateBucket(dt) {
  if (me.dead) return;
  if (!hasBucket() && rectsOverlap(me.x, me.y, PLAYER_W, PLAYER_H, BUCKET_SPOT.x, BUCKET_SPOT.y, BUCKET_W, BUCKET_H)) {
    if (!canAdd('bucket')) {
      if (!me.bucketFullWarned) showToast('INVENTORY FULL', '#ff8a8a');
      me.bucketFullWarned = true;
    } else {
      addItem('bucket');
      showToast('GOT A BUCKET!', ITEMS.bucket.color);
    }
  } else {
    me.bucketFullWarned = false;
  }
  const held = equipped[activeHand];
  if (held && held.key === 'bucket' && feetSection() === SNOW_SECTION) {
    me.snowFill += dt;
    if (me.snowFill >= SNOW_FILL_TIME) {
      me.snowFill = 0;
      held.key = 'snow_bucket';
      held.melt = 0;
      broadcastState();
    }
  } else {
    me.snowFill = 0;
  }
  if (held && held.key === 'snow_bucket' && feetSection() !== SNOW_SECTION) {
    held.melt = (held.melt || 0) + dt * MELT_TIME / (feetSection() === VOLCANO_SECTION ? MELT_TIME_LAVA : MELT_TIME);
    if (held.melt >= MELT_TIME) {
      held.key = 'water_bucket';
      delete held.melt;
      broadcastState();
    }
  }
}

function dumpWater() {
  const item = inventory.find(i => i.key === 'water_bucket');
  if (!item) {
    showToast('NO WATER BUCKET', '#ff8a8a');
    return;
  }
  if (!canAdd('water')) {
    showToast('INVENTORY FULL', '#ff8a8a');
    return;
  }
  item.key = 'bucket';
  addItem('water');
  broadcastState();
  showToast('+1 WATER (' + itemCount('water') + ')', ITEMS.water.color);
}

function drawBucketSpot(cx, cy) {
  const x = Math.round(BUCKET_SPOT.x - cx), y = Math.round(BUCKET_SPOT.y - cy);
  if (x < -12 || x > VIEW_W + 12 || y < -12 || y > VIEW_H + 12) return;
  const o = '#140c1c', b = ITEMS.bucket.color;
  ctx.fillStyle = o;
  ctx.fillRect(x + 2, y, 4, 1);
  ctx.fillRect(x + 1, y + 1, 1, 1);
  ctx.fillRect(x + 6, y + 1, 1, 1);
  ctx.fillRect(x, y + 2, 8, 6);
  ctx.fillStyle = b;
  ctx.fillRect(x + 1, y + 3, 6, 4);
  ctx.fillStyle = shade(b, 0.35);
  ctx.fillRect(x + 1, y + 3, 1, 4);
  ctx.fillStyle = '#2a2a36';
  ctx.fillRect(x + 1, y + 3, 6, 1);
  if (!hasBucket() && Math.abs(me.x + PLAYER_W / 2 - BUCKET_SPOT.x - 4) < 60 && Math.abs(me.y + PLAYER_H - BUCKET_SPOT.y - BUCKET_H) < 30) {
    drawText(ctx, 'BUCKET', x + 4, y - 10, 1, '#ffe66d', 'center', '#140c1c');
  }
}

// The host applies clover hits; whoever lands the last one gets the clover.
function hostHitClover(cloverId, by, msg) {
  const c = clovers.find(c => c.id === cloverId);
  if (!c) return;
  if (by !== myPeerId) {
    const r = remotes.get(by);
    if (!r || Math.abs(r.tx + PLAYER_W / 2 - (c.x + CLOVER_W / 2)) > 50 || Math.abs(r.ty + PLAYER_H - (c.y + CLOVER_H)) > 30) return;
  }
  const it = attackItem(msg && msg.w);
  const dmg = it ? itemDamage(it, msg, true) : 0;
  if (!(dmg > 0)) return;
  c.hp = Math.max(0, (c.hp || CLOVER_HP) - dmg);
  cloverHitFx(c, dmg);
  if (c.hp > 0) {
    broadcastChests();
    return;
  }
  clovers = clovers.filter(o => o !== c);
  const now = performance.now();
  nextCloverAt = Math.max(nextCloverAt, now + CLOVER_RESPAWN_MIN * 1000);
  broadcastChests();
  if (by === myPeerId) gotClover(c);
  else if (sendClover) try { sendClover({ got: c.id, x: c.x, y: c.y }, by); } catch (e) { /* ignore */ }
}

function gotClover(c) {
  if (!canAdd('clover')) {
    showToast('INVENTORY FULL', '#ff8a8a');
    return;
  }
  addItem('clover');
  showToast('FOUND A CLOVER! (' + itemCount('clover') + ')', '#6ad46a');
  if (Number.isFinite(c.x) && Number.isFinite(c.y)) emit(c.x + CLOVER_W / 2, c.y + CLOVER_H / 2, 8, '#6ad46a', 40, 0.4);
}

function onCloverMsg(id, d) {
  if (!d) return;
  if (typeof d.hit === 'string' && isChestHost()) hostHitClover(d.hit, id, d);
  if (typeof d.got === 'string' && id === chestHostId()) gotClover(d);
  if (typeof d.shard === 'string' && isChestHost()) hostHitShard(d.shard, id, d);
  if (typeof d.gotShard === 'string' && id === chestHostId()) gotShard(d);
}

function cloverHitFx(c, amount) {
  c.flash = HURT_FLASH;
  addDamageNumber(c.x + CLOVER_W / 2 - PLAYER_W / 2, c.y - 4, amount);
}

// Called from melee attacks with the same reach box used for players and chests.
function hitClovers(hx, hy, reach, msg) {
  for (const c of [...clovers]) {
    if (!rectsOverlap(hx, hy, reach, PLAYER_H, c.x - 1, c.y - 2, CLOVER_W + 2, CLOVER_H + 2)) continue;
    if (!canAdd('clover')) {
      showToast('INVENTORY FULL', '#ff8a8a');
      continue;
    }
    if (isChestHost()) hostHitClover(c.id, myPeerId, msg);
    else if (sendClover) try { sendClover({ ...msg, hit: c.id }, chestHostId()); } catch (e) { /* ignore */ }
  }
}

function drawClovers(cx, cy) {
  for (const c of clovers) {
    const x = Math.round(c.x - cx), y = Math.round(c.y - cy);
    if (x < -8 || x > VIEW_W + 8 || y < -8 || y > VIEW_H + 8) continue;
    if (c.flash > 0) {
      c.flash = Math.max(0, c.flash - 1 / 60);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x - 1, y - 1, CLOVER_W + 2, CLOVER_H + 2);
    }
    ctx.fillStyle = '#2f8a2a';
    ctx.fillRect(x, y, 2, 2);
    ctx.fillRect(x + 3, y, 2, 2);
    ctx.fillRect(x, y + 2, 2, 1);
    ctx.fillRect(x + 3, y + 2, 2, 1);
    ctx.fillStyle = '#5ec04a';
    ctx.fillRect(x + 2, y + 1, 1, 1);
    ctx.fillStyle = '#24661f';
    ctx.fillRect(x + 2, y + 2, 1, 2);
  }
}

// Ice shard: a rare, player-sized crystal in the snow biome, kept by the chest host.
// Only hits of 30+ damage chip it (never the miners gauntlet), and it vanishes
// once nobody has hit it for a while. Spawning is silent.
const SHARD_W = PLAYER_W, SHARD_H = PLAYER_H;
const SHARD_HP = 600, SHARD_MIN_DAMAGE = 30;
const SHARD_ROLL_INTERVAL = 60, SHARD_CHANCE = 0.1, SHARD_IDLE_TIME = 180;
let shard = null;
let nextShardRoll = 0;

const shardDamage = msg => {
  const it = attackItem(msg && msg.w);
  if (!it || it.mineAll) return 0;
  const dmg = itemDamage(it, msg, true);
  return dmg >= SHARD_MIN_DAMAGE ? dmg : 0;
};

function tickShard(now) {
  let changed = false;
  if (shard && now - shard.last > SHARD_IDLE_TIME * 1000) {
    shard = null;
    changed = true;
  }
  if (!nextShardRoll) nextShardRoll = now + SHARD_ROLL_INTERVAL * 1000;
  if (now >= nextShardRoll) {
    nextShardRoll = now + SHARD_ROLL_INTERVAL * 1000;
    if (!shard && Math.random() < SHARD_CHANCE) {
      const spot = randomChestSpot(SNOW_SECTION, SHARD_W, SHARD_H);
      if (spot) {
        shard = { id: Math.random().toString(36).slice(2, 10), ...spot, hp: SHARD_HP, flash: 0, last: now };
        changed = true;
      }
    }
  }
  return changed;
}

// Any hit (even one too weak to chip it) restarts the shard's idle timer.
function hostHitShard(id, by, msg) {
  const s = shard;
  if (!s || s.id !== id) return;
  if (by !== myPeerId) {
    const r = remotes.get(by);
    const far = msg && msg.ar;
    if (!r || Math.abs(r.tx + PLAYER_W / 2 - (s.x + SHARD_W / 2)) > (far ? 700 : 50) || Math.abs(r.ty + PLAYER_H - (s.y + SHARD_H)) > (far ? 400 : 30)) return;
  }
  s.last = performance.now();
  const dmg = shardDamage(msg);
  if (dmg > 0) {
    s.hp = Math.max(0, s.hp - dmg);
    shardHitFx(s, dmg);
  }
  if (s.hp > 0) {
    broadcastChests();
    return;
  }
  shard = null;
  broadcastChests();
  if (by === myPeerId) gotShard(s);
  else if (sendClover) try { sendClover({ gotShard: s.id, x: s.x, y: s.y }, by); } catch (e) { /* ignore */ }
}

function gotShard(s) {
  if (!canAdd('ice_shard')) {
    showToast('INVENTORY FULL', '#ff8a8a');
    return;
  }
  addItem('ice_shard');
  showToast('GOT AN ICE SHARD! (' + itemCount('ice_shard') + ')', ITEMS.ice_shard.color);
  if (Number.isFinite(s.x) && Number.isFinite(s.y)) emit(s.x + SHARD_W / 2, s.y + SHARD_H / 2, 14, '#d8f6ff', 60, 0.5);
}

function hitShard(msg) {
  const s = shard;
  if (!s) return;
  if (!shardDamage(msg)) showToast('TOO WEAK TO CRACK THE ICE SHARD', '#b4ecfa');
  if (isChestHost()) hostHitShard(s.id, myPeerId, msg);
  else if (sendClover) try { sendClover({ ...msg, shard: s.id }, chestHostId()); } catch (e) { /* ignore */ }
}

const shardHitsBox = (x, y, w, h) => !!shard && rectsOverlap(x, y, w, h, shard.x, shard.y, SHARD_W, SHARD_H);

function shardHitFx(s, amount) {
  s.flash = HURT_FLASH;
  addDamageNumber(s.x, s.y - 4, amount);
  emit(s.x + SHARD_W / 2, s.y + SHARD_H / 2, 5, '#d8f6ff', 40, 0.3);
}

const SHARD_ART = [
  '....oo....', '...ohdo...', '...ohdo...', '..ohwddo..', '..ohwddo..', 'o.ohmwdo..', 'hoohmwdo.o',
  'hdohmwdoyo', 'hdohmwdoyd', 'odohwwddyd', 'odohwwddod', 'ooohwwddoo', 'oooooooooo',
];
function drawShard(cx, cy) {
  const s = shard;
  if (!s) return;
  const x = Math.round(s.x - cx), y = Math.round(s.y - cy);
  if (x < -20 || x > VIEW_W + 20 || y < -30 || y > VIEW_H + 20) return;
  const white = s.flash > 0;
  if (white) s.flash = Math.max(0, s.flash - 1 / 60);
  for (let r = 0; r < SHARD_H; r++) {
    for (let c = 0; c < SHARD_W; c++) {
      const ch = SHARD_ART[r][c];
      if (ch === '.') continue;
      ctx.fillStyle = white ? '#ffffff' : ICE_PAL[ch];
      ctx.fillRect(x + c, y + r, 1, 1);
    }
  }
  if (Math.random() < 0.04) emit(s.x + Math.random() * SHARD_W, s.y + Math.random() * SHARD_H, 1, '#ffffff', 8, 0.4);
  if (s.hp < SHARD_HP) {
    ctx.fillStyle = '#140c1c';
    ctx.fillRect(x - 3, y - 4, SHARD_W + 6, 3);
    ctx.fillStyle = '#9ad8f4';
    ctx.fillRect(x - 2, y - 3, Math.max(1, Math.round((SHARD_W + 4) * s.hp / SHARD_HP)), 1);
  }
}

function chestHitFx(c, amount) {
  c.flash = HURT_FLASH;
  addDamageNumber(c.x + chestW(c) / 2 - PLAYER_W / 2, c.y + 4, amount);
}

function chestBlockedFx(c, msg) {
  emit(c.x + chestW(c) / 2, c.y + chestH(c) / 2, 6, '#e8eef8', 70, 0.25);
  damageNumbers.push({ x: c.x + chestW(c) / 2, y: c.y - 12, text: '0', life: 0.8 });
  const kind = chestKind(c), rule = CHEST_KINDS[kind];
  const it = attackItem(msg && msg.w) || FIST_ITEM;
  // Point bow users at the charged shot when it would be strong enough.
  const chargeHelps = it.kind === 'bow' && !(msg && msg.ch) && it.charged >= (rule.minDamage || 0);
  if (rule.needsItem) showToast('NEEDS A FROZEN PICKAXE', '#b4ecfa');
  else if (rule.needsItems) showToast('ONLY A HEAVY HAMMER OR MINERS GAUNTLET CAN BREAK IT', '#ff9a3d');
  else if (chargeHelps) showToast('MAYBE TRY HOLDING RIGHT CLICK');
  else if (kind === 'magma') showToast('NEED A HIT THAT DOES 30 OR MORE DAMAGE', '#ff9a3d');
  else if (kind === 'stone') showToast('NEED A HIT THAT DOES MORE THAN 20 DAMAGE');
  else if (kind === 'armor') showToast('NEED A HIT THAT DOES 9 OR MORE DAMAGE');
  else showToast('NEED A WEAPON STRONGER THAN A STONE SWORD');
}

function announceIceChest() {
  showToast('AN ICE CHEST HAS APPEARED IN THE SNOW BIOME', '#b4ecfa');
}

function applyChestHit(chestId, attackerId, d) {
  const c = chests.find(o => o.id === chestId);
  if (!c) return;
  let damage;
  if (attackerId !== myPeerId) {
    const r = remotes.get(attackerId);
    if (!r || r.dead) return;
    const hit = validateHit(d, r.tx, r.ty, c.x, c.y, 32, true);
    if (!hit || !allowHit(r, 'chestHits_' + hit.key, hit)) return;
    damage = hit.damage;
  } else {
    damage = hitDamage(d);
  }
  if (!canHurtChest(chestKind(c), d)) {
    if (attackerId === myPeerId) chestBlockedFx(c, d);
    return;
  }
  c.hp = Math.max(0, c.hp - damage);
  chestHitFx(c, damage);
  if (c.hp <= 0) {
    const msg = { id: c.id, by: attackerId, x: c.x, y: c.y, k: chestKind(c) };
    onChestBreak(msg, myPeerId);
    if (sendChestBreak) {
      try { sendChestBreak(msg); } catch (e) { /* ignore */ }
    }
  }
  chestsDirty = true;
  tickChests();
}

function onChestHit(id, d) {
  if (!isChestHost() || !d || typeof d.id !== 'string') return;
  applyChestHit(d.id, id, d);
}

function onChests(id, d) {
  if (id !== chestHostId() || !d || !Array.isArray(d.l) || d.l.length > 150) return;
  const old = new Map(chests.map(c => [c.id, c]));
  chests = [];
  for (const e of d.l) {
    if (!Array.isArray(e) || typeof e[0] !== 'string' || !Number.isFinite(e[1]) || !Number.isFinite(e[2])) continue;
    const prev = old.get(e[0]);
    const c = { id: e[0].slice(0, 12), x: e[1], y: e[2], hp: 0, flash: prev ? prev.flash : 0 };
    if (isChestKind(e[4])) c.k = e[4];
    if (c.k === 'ice') c.born = performance.now() - Math.max(0, Math.min(ICE_CHEST_LIFE * 1000, Number(e[5]) || 0));
    c.hp = Math.max(0, Math.min(chestMaxHp(c), Number(e[3]) || 0));
    if (prev && c.hp < prev.hp) chestHitFx(c, prev.hp - c.hp);
    if (!prev && c.k === 'ice' && chestsKnown) announceIceChest();
    chests.push(c);
  }
  chestsKnown = true;
  if (Array.isArray(d.cv) && d.cv.length <= 10) {
    const oldClovers = new Map(clovers.map(c => [c.id, c]));
    clovers = d.cv
      .filter(e => Array.isArray(e) && typeof e[0] === 'string' && Number.isFinite(e[1]) && Number.isFinite(e[2]))
      .map(e => {
        const c = { id: e[0].slice(0, 12), x: e[1], y: e[2], hp: Math.max(1, Math.min(CLOVER_HP, Number(e[3]) || CLOVER_HP)), flash: 0 };
        const prev = oldClovers.get(c.id);
        if (prev) {
          c.flash = prev.flash || 0;
          if (c.hp < prev.hp) cloverHitFx(c, prev.hp - c.hp);
        }
        return c;
      });
  }
  if ('is' in d) {
    const e = d.is;
    if (Array.isArray(e) && typeof e[0] === 'string' && Number.isFinite(e[1]) && Number.isFinite(e[2])) {
      const prev = shard && shard.id === e[0] ? shard : null;
      const hp = Math.max(1, Math.min(SHARD_HP, Number(e[3]) || SHARD_HP));
      if (prev && hp < prev.hp) shardHitFx(prev, prev.hp - hp);
      shard = { id: e[0].slice(0, 12), x: e[1], y: e[2], hp, flash: prev ? prev.flash : 0,
        last: performance.now() - Math.max(0, Math.min(SHARD_IDLE_TIME * 1000, Number(e[4]) || 0)) };
    } else {
      shard = null;
    }
  }
  const left = Number(d.b) || 0;
  if (left > 0) {
    if (!biomeOpen) openBiome(true, left);
    else biomeCloseAt = performance.now() + left;
  } else if (biomeOpen && performance.now() - biomeOpenedAt > 3000) {
    // The grace period covers a host broadcast that was sent before it heard about an admin summon.
    closeBiome();
  }
}

// ---------------------------------------------------------------------------
// Purple biome events (rolled by the chest host)
// ---------------------------------------------------------------------------
let nextBiomeRoll = 0, nextStormRoll = 0;
let storms = [];
let biomeCloseAt = 0, biomeOpenedAt = 0;
let skyFlash = 0;

function openBiome(announce, durationMs = BIOME_DURATION * 1000) {
  if (biomeOpen) return;
  biomeOpen = true;
  biomeOpenedAt = performance.now();
  biomeCloseAt = biomeOpenedAt + durationMs;
  nextStormRoll = 0;
  solids.find(s => s.t === 'ceiling').y = BIOME_TOP - 16;
  solids.push(...biomeSolids);
  if (announce) {
    showToast('A LOUD THUNDER STRIKES FROM ABOVE', GRASS[BIOME_SECTION].top);
    skyFlash = 0.5;
  }
}

function closeBiome() {
  if (!biomeOpen) return;
  biomeOpen = false;
  solids.find(s => s.t === 'ceiling').y = -16;
  for (const s of biomeSolids) {
    const i = solids.indexOf(s);
    if (i >= 0) solids.splice(i, 1);
  }
  chests = chests.filter(c => chestSection(c) < BIOME_SECTION);
  storms = [];
  chestsDirty = true;
  // Anyone still up there drops onto a platform at the top of the red area.
  if (state === 'game' && !me.dead && me.y < 40) {
    const spots = solids.filter(s => s.t === P && s.y > 60 && s.y < 300 && s.w >= 40 &&
      !overlaps(s.x + s.w / 2 - PLAYER_W / 2, s.y - PLAYER_H - 1, PLAYER_W, PLAYER_H));
    const s = spots[Math.floor(Math.random() * spots.length)];
    me.x = s.x + s.w / 2 - PLAYER_W / 2;
    me.y = s.y - PLAYER_H - 1;
    me.vx = me.vy = 0;
    me.jetting = false;
    me.dashT = 0;
    broadcastState();
  }
  showToast('THE THUNDER BIOME FADED AWAY', GRASS[BIOME_SECTION].top);
}

function tickBiomeEvents(now) {
  if (!nextBiomeRoll) nextBiomeRoll = now + BIOME_ROLL_INTERVAL * 1000;
  if (!biomeOpen && now >= nextBiomeRoll) {
    nextBiomeRoll = now + BIOME_ROLL_INTERVAL * 1000;
    if (Math.random() < BIOME_CHANCE) {
      openBiome(true);
      chestsDirty = true;
    }
  }
  if (!biomeOpen) return;
  if (!nextStormRoll) nextStormRoll = now + STORM_ROLL_INTERVAL * 1000;
  if (now >= nextStormRoll) {
    nextStormRoll = now + STORM_ROLL_INTERVAL * 1000;
    const hit = [];
    BIOME_PLATS.forEach((s, i) => {
      if (Math.random() < STORM_CHANCE) hit.push(i);
    });
    if (hit.length) {
      hit.forEach(startStorm);
      if (sendStorm) {
        try { sendStorm({ l: hit }); } catch (e) { /* ignore */ }
      }
    }
  }
}

function onStorm(id, d) {
  if (!d) return;
  // Admin lightning can land on any surface, so it carries the rectangle itself.
  if (Array.isArray(d.r)) {
    const r = remotes.get(id);
    if (!r || !r.n.includes('LARP')) return;
    for (const e of d.r.slice(0, 40)) {
      if (Array.isArray(e) && e.length === 3 && e.every(Number.isFinite)) startStormRect([e[0], e[1], Math.min(ADMIN_STORM_MAX_W, e[2])], id);
    }
    return;
  }
  if (id !== chestHostId()) return;
  const list = (Array.isArray(d.l) ? d.l : [d.i]).filter(i => Number.isInteger(i) && i >= 0 && i < BIOME_PLATS.length);
  if (!list.length) return;
  openBiome(true);
  list.forEach(startStorm);
}

function startStorm(i) {
  storms.push({ plat: BIOME_PLATS[i], at: performance.now(), struck: false, bolt: null });
}
// by: the admin who called it down; their own lightning never hurts them.
function startStormRect([x, y, w], by) {
  storms.push({ plat: { x, y, w }, at: performance.now(), struck: false, bolt: null, by });
}

const stormZone = s => ({ x: s.plat.x, y: s.plat.y - STORM_CLOUD_H, w: s.plat.w, h: STORM_CLOUD_H });

// Timed off the wall clock so a strike still lands while the tab is in the background.
function tickStorms() {
  const now = performance.now();
  // Others wait a moment longer so the host's close message arrives before their own timer runs out.
  if (biomeOpen && now >= biomeCloseAt + (isChestHost() ? 0 : 1500)) closeBiome();
  for (const s of storms) {
    if (s.struck || now - s.at < STORM_DELAY * 1000) continue;
    s.struck = true;
    const z = stormZone(s);
    s.bolt = [];
    for (let y = z.y + 8; y < s.plat.y; y += 8) s.bolt.push([z.x + z.w / 2 + Math.round((Math.random() - 0.5) * Math.min(24, z.w * 0.4)), y]);
    s.bolt.push([z.x + z.w / 2, s.plat.y]);
    emit(z.x + z.w / 2, s.plat.y, 24, '#fff6a0', 140, 0.5);
    emit(z.x + z.w / 2, s.plat.y, 10, '#8ad8ff', 90, 0.4);
    const onScreen = Math.abs(z.x + z.w / 2 - (cam.x + VIEW_W / 2)) < VIEW_W / 2 + 40 && Math.abs(s.plat.y - (cam.y + VIEW_H / 2)) < VIEW_H / 2 + 80;
    if (state === 'game' && (me.y < 60 || (s.by && onScreen))) {
      skyFlash = Math.max(skyFlash, onScreen ? 0.45 : 0.2);
    }
    if (state === 'game' && !me.dead && s.by !== myPeerId && immuneLeft() <= 0 && rectsOverlap(me.x, me.y, PLAYER_W, PLAYER_H, z.x, z.y, z.w, z.h)) {
      hitByLightning();
    }
  }
  storms = storms.filter(s => now - s.at < (STORM_DELAY + 0.7) * 1000);
}

function hitByLightning() {
  me.hp = Math.max(0, me.hp - LIGHTNING_DAMAGE);
  me.flash = HURT_FLASH;
  me.stunUntil = performance.now() + STUN_TIME * 1000;
  me.vx = 0;
  me.jetting = false;
  me.dashT = 0;
  addDamageNumber(me.x, me.y, LIGHTNING_DAMAGE);
  if (sendDamage) {
    try { sendDamage({ a: LIGHTNING_DAMAGE, hp: me.hp }); } catch (e) { /* ignore */ }
  }
  if (me.hp <= 0) die('LIGHTNING');
}

const bushAt = (x, y) => (biomeOpen ? bushes.findIndex(b => x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h) : -1);
const myBush = () => (me.dead ? -1 : bushAt(me.x + PLAYER_W / 2, me.y + PLAYER_H - 4));
// Someone hiding in a bush is only visible to players inside the same bush.
const hiddenFromMe = r => r.bu >= 0 && r.bu !== myBush();

function onChestBreak(d, fromId) {
  if (!d || typeof d.id !== 'string' || fromId !== chestHostId()) return;
  const c = chests.find(o => o.id === d.id);
  const x = c ? c.x : Number(d.x) || 0, y = c ? c.y : Number(d.y) || 0;
  chests = chests.filter(o => o.id !== d.id);
  const kind = c ? chestKind(c) : isChestKind(d.k) ? d.k : chestKind({ y });
  if (kind === 'armor' && fromId === myPeerId) {
    const b = armorBiomeOf(sectionOf(y + CHEST_H));
    if (b >= 0) armorTargets[b] = rollArmorTarget();
  }
  const [fx1, fx2] = CHEST_KINDS[kind].fx;
  const cx = x + (CHEST_KINDS[kind].w || CHEST_W) / 2, cy = y + (CHEST_KINDS[kind].h || CHEST_H) / 2;
  emit(cx, cy, kind === 'ice' ? 40 : 18, fx1, 90, 0.6);
  emit(cx, cy, 8, fx2, 70, 0.5);
  if (d.by !== myPeerId || state !== 'game') return;
  grantChestReward(kind, !!d.a);
}

function updateChests(dt) {
  for (const c of chests) c.flash = Math.max(0, c.flash - dt);
  skyFlash = Math.max(0, skyFlash - dt * 2.5);
  if (toast) {
    toast.life -= dt;
    if (toast.life <= 0) toast = null;
  }
}

function die(killer) {
  me.dead = true;
  me.beam = null;
  me.jetting = false;
  me.killedBy = killer || '';
  pickerOpen = false;
  inventoryOpen = false;
  closeAdmin();
  dragTarget = null;
  deathBurst(me.x, me.y, me.color);
  broadcastState();
}

function resetLife() {
  me.boosted = false;
  updateMaxHp();
  me.hp = me.maxHp;
  me.frozenUntil = 0;
  me.burnUntil = me.burnNext = 0;
  me.combo = { id: '', n: 0 };
  me.dashT = me.dashCd = 0;
  me.charging = false;
  me.jetting = false;
  me.jetFuel = JET_TIME;
  me.jetEmpty = false;
  me.stunUntil = 0;
  me.ammo = SHURIKEN_AMMO;
  me.burst = 0;
  me.fuel = MAX_FUEL;
  me.laserOut = 0;
  me.beam = null;
  dashQueued = 0;
  powerQueued = '';
  burstQueued = jetQueued = false;
  me.dead = false;
  me.immuneUntil = performance.now() + SPAWN_IMMUNITY * 1000;
  me.flash = 0;
  me.regenAt = performance.now() + REGEN_INTERVAL * 1000;
  me.punchT = me.punchCd = me.punchBuffer = 0;
  me.lock = me.jumpBuffer = 0;
  jumpPressedQueued = punchQueued = false;
  spawn(me);
  cam.x = Math.max(0, Math.min(WORLD_W - VIEW_W, me.x - VIEW_W / 2));
  cam.y = Math.max(0, Math.min(WORLD_H - VIEW_H, me.y - VIEW_H / 2));
}

function respawn() {
  resetLife();
  broadcastState();
}

// Reloading gives a fresh peer ID; rejoining the room with the same ID can be
// ignored by peers that still hold the old connection.
function leaveGame() {
  const leaving = room ? Promise.resolve(room.leave()).catch(() => {}) : Promise.resolve();
  room = null;
  sendState = sendHit = sendDamage = null;
  sendChests = sendChestHit = sendChestBreak = sendArrow = sendStorm = sendBiome = sendAdmin = sendClover = sendThorns = null;
  craftOpen = storageOpen = false;
  state = 'leaving';
  Promise.race([leaving, new Promise(r => setTimeout(r, 800))]).then(() => location.reload());
}

function updateMe(dt) {
  syncFreezeBoost();
  if (craftOpen && !nearBench()) craftOpen = false;
  if (storageOpen && !nearVault()) storageOpen = false;
  updateBucket(dt);
  me.flash = Math.max(0, me.flash - dt);
  me.punchT = Math.max(0, me.punchT - dt);
  me.punchCd = Math.max(0, me.punchCd - dt);
  me.dashCd = Math.max(0, me.dashCd - dt);
  if (!me.jetting) {
    me.jetFuel = Math.min(JET_TIME, me.jetFuel + dt * JET_TIME / JET_COOLDOWN);
    if (me.jetFuel >= JET_TIME) me.jetEmpty = false;
  }
  if (performance.now() < me.stunUntil) {
    dashQueued = 0;
    if (powerKey() !== 'radar_blocker') powerQueued = '';
  }
  if (dashQueued) {
    tryDash(dashQueued);
    dashQueued = 0;
  }
  if (powerQueued) {
    usePower(powerQueued);
    powerQueued = '';
  }
  updateShuriken(dt);
  updateLaser(dt);
  if (me.charging) {
    if (heldItem().kind === 'bow') me.chargeT += dt;
    else me.charging = false;
  }
  if (punchQueued) {
    me.attackSource = punchQueued;
    punchQueued = false;
    me.punchBuffer = PUNCH_BUFFER;
  }
  if (me.punchBuffer > 0) {
    if (me.punchCd <= 0) {
      me.punchBuffer = 0;
      const kind = heldItem().kind;
      if (kind === 'bow') {
        if (!me.charging) fireArrow(false, me.attackSource === 'mouse');
      } else if (kind === 'staff') {
        fireArrow(false, me.attackSource === 'mouse');
      } else if (kind === 'shuriken') {
        shurikenAttack(me.attackSource === 'mouse');
      } else if (kind !== 'laser') {
        doMelee();
      }
    } else {
      me.punchBuffer -= dt;
    }
  }
}

let state = 'menu';
const cam = { x: 0, y: WORLD_H - VIEW_H };
let time = 0;

function startGame() {
  if (state !== 'menu') return;
  nameInput.blur();
  me.name = nameInput.value.trim() || DEFAULT_NAME;
  saveProfile();
  loadStorage();
  state = 'game';
  me.joinedAt = Date.now();
  joinedPerf = performance.now();
  keys.clear();
  resetLife();
  startNet();
}

function updateCamera(dt) {
  const tx = me.x + PLAYER_W / 2 - VIEW_W / 2 + me.facing * 24;
  const ty = me.y + PLAYER_H / 2 - VIEW_H / 2 - 10;
  const k = Math.min(1, dt * 6);
  cam.x += (tx - cam.x) * k;
  cam.y += (ty - cam.y) * k;
  cam.x = Math.max(0, Math.min(WORLD_W - VIEW_W, cam.x));
  cam.y = Math.max(worldTop(), Math.min(WORLD_H - VIEW_H, cam.y));
}

  green: { base: '#4fb53e', hover: '#6ad46a', top: '#86e05c', topHover: '#a6f08a', side: '#256d22', text: '#1d5a1a' },

function drawButton(b, label, theme) {
  const t = BUTTON_THEMES[theme];
  const hover = over(b);
  const press = hover ? 1 : 0;
  ctx.fillStyle = '#140c1c';
  ctx.fillRect(b.x - 1, b.y - 1, b.w + 2, b.h + 4);
  ctx.fillStyle = t.side;
  ctx.fillRect(b.x, b.y + 3, b.w, b.h);
  ctx.fillStyle = hover ? t.hover : t.base;
  ctx.fillRect(b.x, b.y + press, b.w, b.h);
  ctx.fillStyle = hover ? t.topHover : t.top;
  ctx.fillRect(b.x, b.y + press, b.w, 2);
  drawText(ctx, label, b.x + b.w / 2, b.y + press + 10, 2, '#ffffff', 'center', t.text);
  return hover;
}

  const cx = (Math.sin(time * 0.1) * 0.5 + 0.5) * (WORLD_W - VIEW_W);
  const cy = WORLD_H - VIEW_H;
  drawBackground(ctx, cx, cy);
  ctx.drawImage(levelCanvas, Math.round(cx), cy, VIEW_W, VIEW_H, 0, 0, VIEW_W, VIEW_H);
  ctx.fillStyle = 'rgba(11, 7, 20, 0.55)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  // Title
  const s = 7, ty = 40 + Math.round(Math.sin(time * 2) * 2);
  for (let i = 4; i >= 1; i--) drawText(ctx, 'COMBAT', VIEW_W / 2 + i, ty + i, s, i === 1 ? '#7a1f2b' : '#3a0d18', 'center');
  drawText(ctx, 'COMBAT', VIEW_W / 2, ty, s, '#ff5a4f', 'center');
  ctx.fillStyle = '#ffb09a';
  ctx.fillRect(VIEW_W / 2 - textWidth('COMBAT', s) / 2, ty, textWidth('COMBAT', s), 1);

  // Name chooser
  const focused = document.activeElement === nameInput;
  const nb = NAME_BOX;
  drawText(ctx, 'YOUR NAME', VIEW_W / 2, nb.y - 9, 1, '#b9a8e0', 'center');
  ctx.fillStyle = focused ? '#ffe66d' : over(nb) ? '#8a7aaf' : '#5a4a7a';
  ctx.fillRect(nb.x - 1, nb.y - 1, nb.w + 2, nb.h + 2);
  ctx.fillStyle = '#140c1c';
  ctx.fillRect(nb.x, nb.y, nb.w, nb.h);
  const val = nameInput.value;
  if (val) drawText(ctx, val, VIEW_W / 2, nb.y + 4, 2, '#ffffff', 'center');
  else if (!focused) drawText(ctx, 'CLICK TO TYPE', VIEW_W / 2, nb.y + 7, 1, '#5a4a7a', 'center');
  if (focused && Math.floor(time * 2) % 2 === 0) {
    const cxr = VIEW_W / 2 + Math.ceil(textWidth(val, 2) / 2) + (val ? 2 : 0);
    ctx.fillStyle = '#ffe66d';
    ctx.fillRect(cxr, nb.y + 4, 2, 10);
  }

  const hover = drawButton(PLAY_BTN, 'PLAY', 'green');

  drawText(ctx, 'ONLINE MULTIPLAYER LOBBY', VIEW_W / 2, 200, 1, '#b9a8e0', 'center');
  drawText(ctx, 'MOVE: A/D OR ARROWS   JUMP: SPACE/W', VIEW_W / 2, 213, 1, '#8a7aaf', 'center');
  drawText(ctx, 'ATTACK: ENTER / S / CLICK   INVENTORY: E', VIEW_W / 2, 226, 1, '#8a7aaf', 'center');
  drawText(ctx, 'BOW: CLICK TO AIM, HOLD RIGHT CLICK TO CHARGE', VIEW_W / 2, 239, 1, '#8a7aaf', 'center');
  canvas.style.cursor = hover || over(nb) ? 'pointer' : 'default';
}

function hpColor(frac) {
  return frac > 0.5 ? '#6ad46a' : frac > 0.25 ? '#f2c14e' : '#e84a5f';
}

function drawNameAndHp(name, x, y, col, hp, maxHp, hidden) {
  x = Math.round(x); y = Math.round(y);
  const frac = Math.max(0, Math.min(1, hp / maxHp));
  if (hidden) ctx.globalAlpha = 0.15;
  drawText(ctx, name, x + PLAYER_W / 2, y - 12, 1, col, 'center', '#140c1c');
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#140c1c';
  ctx.fillRect(x - 2, y - 5, PLAYER_W + 4, 3);
  ctx.fillStyle = hpColor(frac);
  ctx.fillRect(x - 1, y - 4, Math.round((PLAYER_W + 2) * frac), 1);
}

function drawChargeBar(x, y, charge, color) {
  if (charge < 0) return;
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = '#140c1c';
  ctx.fillRect(x - 2, y + PLAYER_H + 2, PLAYER_W + 4, 3);
  ctx.fillStyle = color || (charge >= 1 ? (Math.floor(time * 12) % 2 ? '#ffd84a' : '#ffffff') : '#e8e8e8');
  ctx.fillRect(x - 1, y + PLAYER_H + 3, Math.round((PLAYER_W + 2) * Math.min(1, charge)), 1);
}

function playerFx(color, flash, immune, punchT, item, armor, charge) {
  let f = null;
  if (flash > 0) f = hurtFlashColor(color);
  else if (immune && Math.floor(time * 10) % 2 === 0) f = '#4aa8ff';
  return { flash: f, punch: punchT > 0, item, armor, charge };
}

    for (let c = 0; c < 12; c++) {
      const ch = map[r][c];
      if (ch === '.') continue;
      ctx.fillStyle = pal[ch];
      ctx.fillRect(x + c, y + r, 1, 1);
    }
  }
}
function itemDescription(it) {
  if (it.chestDamage) return it.chestDamage + ' DMG TO CHESTS ONLY' + (it.cooldown ? ' / ' + it.cooldown + 'S' : '') + (it === ITEMS.frozen_pickaxe ? ' / BREAKS ICE CHESTS' : '');
  if (it.mineAll) return it.damage + ' DMG / ' + it.cooldown + 'S / MINES EVERY CHEST';
  if (it.kind === 'melee') return it.damage + ' DMG' + (it.freeze ? ' / CAN FREEZE' : it.cooldown ? ' / ' + it.cooldown + 'S COOLDOWN' : '');
  if (it.kind === 'bow') return it.damage + ' DMG / ' + it.charged + ' CHARGED';
  if (it.kind === 'shuriken') return it.damage + ' DMG X5 / RIGHT CLICK: X' + SHURIKEN_BURST_COUNT;
  if (it.flame) return Math.round(it.damage / it.tick) + ' DMG/S / ' + it.fuel + 'S FUEL / RIGHT CLICK: REFUEL';
  if (it.kind === 'laser') return LASER_DPS + ' DMG/S / RIGHT CLICK: REFUEL';
  if (it.kind === 'staff') return it.damage + ' DMG FIREBALLS / ' + it.cooldown + 'S / CAN SET ON FIRE';
  if (it.burn) return it.damage + ' DMG / ' + MAGMA_COMBO + ' HITS IN A ROW: BURN';
  if (ARMOR_KINDS[it.kind]) {
    const parts = [];
    if (it.hp) parts.push('+' + it.hp + ' MAX HP');
    if (it.speed) parts.push(it.speed > 1 ? 'RUN ' + Math.round((it.speed - 1) * 100) + '% FASTER' : it.speed + 'X SPEED');
    if (it.thorns) parts.push(Math.round(it.thorns * 100) + '% REFLECT ' + THORNS_DAMAGE + ' DMG');
    return parts.join(' / ');
  }
  if (it.kind === 'power') return POWER_HELP[Object.keys(ITEMS).find(k => ITEMS[k] === it)] || '';
  if (it.desc) return it.desc;
  if (it === ITEMS.luck_potion) return 'DOUBLE CLICK: ' + LUCK_MULT + 'X CHEST LUCK FOR 2 MIN';
  return '';
}

// Arrows are rasterized per pixel at the target angle; rotating a tiny sprite
// with nearest-neighbor sampling garbles diagonal directions.
const ARROW_R = 10;
// Head from x=1 to the tip at x=8, shaft from x=-6 to x=1.
function insideArrow(px, py, cos, sin) {
  const lx = px * cos + py * sin, ly = Math.abs(-px * sin + py * cos);
  return (lx >= 1 && lx <= 8 && ly <= (8 - lx) * 6 / 7) || (lx >= -6 && lx < 1 && ly <= 2);
}
function drawArrow(ax, ay, angle, color) {
  const cos = Math.cos(angle), sin = Math.sin(angle);
  for (let py = -ARROW_R; py <= ARROW_R; py++) {
    for (let px = -ARROW_R; px <= ARROW_R; px++) {
      if (!insideArrow(px, py, cos, sin)) continue;
      const edge = !insideArrow(px - 1, py, cos, sin) || !insideArrow(px + 1, py, cos, sin) ||
                   !insideArrow(px, py - 1, cos, sin) || !insideArrow(px, py + 1, cos, sin);
      ctx.fillStyle = edge ? '#140c1c' : color;
      ctx.fillRect(ax + px, ay + py, 1, 1);
    }
  }
}

// Edge-of-screen arrows pointing at players who are out of view.
function drawPlayerArrows(cx, cy) {
  const EDGE = 11;
  const hw = VIEW_W / 2, hh = VIEW_H / 2;
  for (const r of remotes.values()) {
    if (r.dead || r.rb) continue;
    const sx = r.x - cx, sy = r.y - cy;
    if (sx + PLAYER_W > 0 && sx < VIEW_W && sy + PLAYER_H > 0 && sy < VIEW_H) continue;
    const dx = sx + PLAYER_W / 2 - hw, dy = sy + PLAYER_H / 2 - hh;
    const t = Math.min((hw - EDGE) / Math.abs(dx || 1e-6), (hh - EDGE) / Math.abs(dy || 1e-6));
    if (hiddenFromMe(r)) ctx.globalAlpha = 0.2;
    drawArrow(Math.round(hw + dx * t), Math.round(hh + dy * t), Math.atan2(dy, dx), r.c);
    ctx.globalAlpha = 1;
  }
}

function drawChests(cx, cy) {
  for (const c of chests) {
    const sx = Math.round(c.x - cx), sy = Math.round(c.y - cy);
    const w = chestW(c), h = chestH(c);
    if (sx < -w || sx > VIEW_W || sy < -h - 6 || sy > VIEW_H) continue;
    const pal = CHEST_KINDS[chestKind(c)].pal;
    const maxHp = chestMaxHp(c);
    // Bigger chests stretch the same sprite (nearest neighbour).
    for (let r = 0; r < h; r++) {
      for (let col = 0; col < w; col++) {
        const ch = CHEST_SPRITE[Math.floor(r * CHEST_H / h)][Math.floor(col * CHEST_W / w)];
        if (ch === '.') continue;
        ctx.fillStyle = c.flash > 0 && ch !== 'o' ? '#ffffff' : pal[ch];
        ctx.fillRect(sx + col, sy + r, 1, 1);
      }
    }
    if (chestKind(c) === 'ice' && Math.floor(time * 3 + c.x) % 4 === 0) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(sx + 3 + Math.floor((time * 7 + c.x) % (w - 6)), sy + 3, 1, 1);
    }
    if (chestKind(c) === 'magma' && !(c.flash > 0)) {
      // Glowing cracks that pulse, plus the odd ember.
      const a = 0.55 + 0.45 * Math.sin(time * 4 + c.x);
      ctx.fillStyle = `rgba(255, 176, 64, ${a.toFixed(2)})`;
      for (const [px, py] of [[2, 6], [3, 7], [5, 8], [w - 4, 6], [w - 5, 8], [Math.floor(w / 2) + 2, h - 3]]) ctx.fillRect(sx + px, sy + py, 1, 1);
      if (Math.random() < 0.05) particles.push({ x: c.x + 2 + Math.random() * (w - 4), y: c.y, vx: (Math.random() - 0.5) * 6, vy: -18, life: 0.6, max: 0.6, color: '#ff8a2a', g: 0 });
    }
    if (c.hp < maxHp) {
      ctx.fillStyle = '#140c1c';
      ctx.fillRect(sx - 1, sy - 5, w + 2, 3);
      ctx.fillStyle = hpColor(c.hp / maxHp);
      ctx.fillRect(sx, sy - 4, Math.round(w * c.hp / maxHp), 1);
    }
  }
}

    ctx.fillRect(s.x, s.y, s.w, s.h);

    if (item) {
      const it = ITEMS[item.key];
      const isEquipped = EQUIP_SLOTS.some(slot => equipped[slot] === item);

      ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.fillStyle = rarityOf(it).bg;
      ctx.fillRect(s.x + 1, s.y + 1, s.w - 2, s.h - 2);
      drawItemIcon(it, s.x + 2, s.y + 2);
      if (item.n > 1) drawText(ctx, String(item.n), s.x + s.w, s.y + s.h - 5, 1, '#ffffff', 'right', '#140c1c');
      if (item.marked) drawDeleteMark(s.x, s.y, s.w);
      if (isOver) hovered = item;
    }
  }
  // Equipment column
  EQUIP_SLOTS.forEach(slot => {
    const s = equipSlotRect(slot);
    const active = slot === activeHand;
    drawText(ctx, EQUIP_LABELS[slot], s.x + s.w / 2, s.y - 8, 1, active ? '#ffe66d' : '#b9a8e0', 'center');

    ctx.fillRect(s.x + 1, s.y + 1, s.w - 2, s.h - 2);
    if (equipped[slot]) {
      drawItemIcon(ITEMS[equipped[slot].key], s.x + 5, s.y + 5);
      if (over(s)) hovered = equipped[slot];
    }
  });
  drawText(ctx, 'CLICK: EQUIP   RIGHT CLICK: MARK X   1/2/SCROLL: SWAP WEAPON', VIEW_W / 2, p.y + p.h + 4, 1, '#8a7aaf', 'center', '#140c1c');

  // Delete button (bottom-right corner of the screen)
  const marked = inventory.filter(i => i.marked).length;
  const db = DELETE_BTN;
  const dHover = over(db) && marked > 0;
  ctx.fillStyle = '#140c1c';
  ctx.fillRect(db.x - 1, db.y - 1, db.w + 2, db.h + 2);
  ctx.fillStyle = marked ? (dHover ? '#ff6a6a' : '#c8383c') : '#4a3a4a';
  ctx.fillRect(db.x, db.y, db.w, db.h);
  drawDeleteMark(db.x + 1, db.y + 1, db.w - 2, marked ? '#ffffff' : '#7a6a7a');
  drawText(ctx, marked ? 'DELETE ' + marked : 'RIGHT CLICK ITEMS TO MARK', db.x - 4, db.y + 7, 1,
    marked ? '#ff8a8a' : '#8a7aaf', 'right', '#140c1c');

  if (hovered) {
    const it = ITEMS[hovered.key];
    const rar = rarityOf(it);
    const desc = itemDescription(it);
    const w = Math.max(textWidth(it.name, 1), textWidth(desc, 1), textWidth(rar.label, 1)) + 6;
    const tx = Math.max(2, Math.min(VIEW_W - w - 2, mouse.x + 6)), ty = mouse.y - 28;
    ctx.fillStyle = '#140c1c';
    ctx.fillRect(tx, ty, w, 27);
    ctx.fillStyle = rar.bg;
    ctx.fillRect(tx, ty, 2, 27);
    drawText(ctx, it.name, tx + 4, ty + 3, 1, rar.text);
    drawText(ctx, rar.label, tx + 4, ty + 11, 1, shade(rar.text, -0.2));
    drawText(ctx, desc, tx + 4, ty + 19, 1, '#ffffff');
  }
}
